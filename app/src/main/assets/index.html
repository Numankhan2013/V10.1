<script id="qbank-question-ui-v2-script">
(function(){
  function sessionVisible(){
    return !!document.querySelector('.question-card') &&
      !!document.querySelector('.question-shell, .practice-actions, .exam-top');
  }
  function cleanInjectedSessionCards(){
    if(!sessionVisible()) return;
    document.querySelectorAll('.page > *').forEach(function(el){
      if(el.matches('.question-shell,.page-head,.exam-top,.fixed-actions')) return;
      if(el.closest('.question-shell,.fixed-actions')) return;
      var text=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
      var hasQuestion=el.querySelector('.question-card');
      if(hasQuestion) return;
      var explicitTool=el.matches('.focus-card,.action-grid,.dashboard-section,.action-card,.mode-choice,.v102-subject-hub');
      var accidentalLabel=/^(practice|timed cbt|cbt|your progress|your practice|performance)$/.test(text);
      if(explicitTool || accidentalLabel) el.remove();
    });
  }
  function run(){
    cleanInjectedSessionCards();
    var page=document.querySelector('.page');
    if(page && sessionVisible()) page.classList.add('qbank-session-ui-v2');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run);
  else setTimeout(run,30);
  setTimeout(run,250); setTimeout(run,700);
  new MutationObserver(run).observe(document.documentElement,{subtree:true,childList:true});
})();
</script>

__NK_DATA_UWORLD_SCRIPTS__<script>(() => {
  'use strict';

  const BASE_DATA = window.QBANK_DATA;
  const SUBJECT_DATA = window.SUBJECT_QBANK_DATA || {subjects:[]};
  if (!BASE_DATA || !Array.isArray(BASE_DATA.questions)) {
    document.getElementById('app').innerHTML = '<div style="padding:30px">Could not load the QBank source dataset.</div>';
    return;
  }

  /* NK_MARROW_BANK_PILOT_V1_START */
  const SUBJECTS = [
    {subject:'Biochemistry', topics:BASE_DATA.chapters.map(c=>({id:String(c.id),subject:'Biochemistry',title:c.title,questionCount:c.questionCount,startPage:c.startPage})), questions:BASE_DATA.questions.map(q=>({...q,subject:'Biochemistry',bank:'PrepLadder'}))},
    ...(Array.isArray(SUBJECT_DATA.subjects)?SUBJECT_DATA.subjects:[]).map(record=>({...record,questions:(record.questions||[]).map(q=>({...q,bank:q.bank||'PrepLadder'}))}))
  ];
/* @module question_content_hygiene.js */
  const SUBJECT_BY_NAME = Object.fromEntries(SUBJECTS.map(x=>[x.subject,x]));
  SUBJECTS.forEach(record=>(record.questions||[]).forEach(question=>nkSanitizeMarrowQuestion(question)));
  const MARROW_DATA = __NK_DATA_MARROW_DATA__;
  const MARROW_RECORDS = Array.isArray(MARROW_DATA.records) ? MARROW_DATA.records : [MARROW_DATA];
  const MARROW_BY_SUBJECT = Object.freeze(Object.fromEntries(
    MARROW_RECORDS
      .filter(record=>record&&record.subject)
      .map(record=>{
        const subject=String(record.subject);
        return [subject,{
          ...record,
          subject,
          bank:'Marrow',
          topics:Array.isArray(record.topics)?record.topics:[],
          questions:Array.isArray(record.questions)?record.questions:[]
        }];
      })
  ));
  const BANKS_BY_SUBJECT = Object.create(null);
  SUBJECTS.forEach(record=>{
    const subject=String(record.subject||'');
    const topicTitles=Object.fromEntries((record.topics||[]).map(topic=>[String(topic.id),String(topic.title||'')]));
    (record.questions||[]).forEach(question=>{
      nkSanitizeMarrowQuestion(question);
      question.subject=question.subject||subject;
      question.bank=question.bank||'PrepLadder';
      // This facet comes from the source chapter label, not an inferred exam/year.
      if(/\bPrevious Year Questions\b/i.test(topicTitles[String(question.chapterId)]||String(question.chapter||''))){
        question.studyCollections=[...new Set([...(Array.isArray(question.studyCollections)?question.studyCollections:[]),'pyq'])];
      }
    });
    if(subject)BANKS_BY_SUBJECT[subject]=[{...record,subject,bank:'PrepLadder'}];
  });
  Object.values(MARROW_BY_SUBJECT).forEach(record=>{
    (record.questions||[]).forEach(question=>{
      nkSanitizeMarrowQuestion(question);
      question.subject=question.subject||record.subject;
      question.bank='Marrow';
    });
    if(!record.subject||!record.questions.length)return;
    const list=BANKS_BY_SUBJECT[record.subject]||(BANKS_BY_SUBJECT[record.subject]=[]);
    list.push(record);
  });
  function nkBankRecords(name){
    return (BANKS_BY_SUBJECT[name]||[]).slice();
  }
  function nkBankRecord(name,bank){
    const list=nkBankRecords(name);return list.find(x=>x.bank===bank)||list[0]||null;
  }
  // The flattened bank (~30k copies) is rebuilt only when a bank record or its
  // question list changes; per-question lookups used to rebuild it every call.
  let nkAllBankQuestionsCache=null;
  function nkAllBankQuestionsBuild(){
    const sources=Object.values(BANKS_BY_SUBJECT).flatMap(records=>records),c=nkAllBankQuestionsCache;
    if(c&&c.sources.length===sources.length&&sources.every((r,i)=>r===c.sources[i]&&r.questions===c.lists[i]&&(r.questions||[]).length===c.lengths[i]))return c;
    const all=sources.flatMap(record=>(record.questions||[]).map(q=>({...q,subject:q.subject||record.subject,bank:q.bank||record.bank||'PrepLadder'})));
    return nkAllBankQuestionsCache={sources,lists:sources.map(r=>r.questions),lengths:sources.map(r=>(r.questions||[]).length),all,byId:null};
  }
  function nkAllBankQuestions(){
    return nkAllBankQuestionsBuild().all.slice();
  }
  function nkBankQuestionById(id){
    const c=nkAllBankQuestionsBuild();
    if(!c.byId){c.byId=new Map();c.all.forEach(q=>{const k=String(q.id);if(!c.byId.has(k))c.byId.set(k,q);});}
    return c.byId.get(String(id))||null;
  }
  /* NK_UWORLD_BANK_DATA_START */
  const NK_UWORLD_COLLECTIONS=(window.NK_UWORLD_DATA||[]).filter(Boolean);
  const NK_UWORLD_BIOCHEMISTRY_BANK=NK_UWORLD_COLLECTIONS[0];
  // Collection namespace participates in the shared engines, never My Subjects.
  BANKS_BY_SUBJECT[NK_UWORLD_BIOCHEMISTRY_BANK.subject]=[NK_UWORLD_BIOCHEMISTRY_BANK];
  SUBJECT_BY_NAME[NK_UWORLD_BIOCHEMISTRY_BANK.subject]=NK_UWORLD_BIOCHEMISTRY_BANK;
  for(const record of NK_UWORLD_COLLECTIONS.slice(1)){
    BANKS_BY_SUBJECT[record.subject]=[record];
    SUBJECT_BY_NAME[record.subject]=record;
  }
  const nkUworldOriginalBankRecord=nkBankRecord;
  nkBankRecord=function(name,bank){
    return nkUworldOriginalBankRecord(name==='Biochemistry'&&bank==='UWorld'?NK_UWORLD_BIOCHEMISTRY_BANK.subject:name,bank);
  };
  /* NK_UWORLD_BANK_DATA_END */
  let activeSubject = localStorage.getItem('qbank_active_subject_v1') || 'Biochemistry';
  if(!SUBJECT_BY_NAME[activeSubject]) activeSubject='Biochemistry';
  let activeBank = localStorage.getItem('qbank_active_bank_v1') || 'PrepLadder';
  if(!nkBankRecord(activeSubject,activeBank))activeBank='PrepLadder';
  let DATA = null, QUESTIONS = [], BY_ID = {}, CHAPTERS = [], CHAPTER_BY_ID = {};
  function applySubject(name,bank=activeBank){
    const source=nkBankRecord(name,bank)||nkBankRecord('Biochemistry','PrepLadder');
    if(!source)return;
    activeSubject=source.subject;
    activeBank=source.bank||'PrepLadder';
    localStorage.setItem('qbank_active_subject_v1',activeSubject);
    localStorage.setItem('qbank_active_bank_v1',activeBank);
    if(typeof nkScheduleCloudSync==='function')nkScheduleCloudSync();
    DATA={chapters:source.topics||[],questions:source.questions||[]};
    QUESTIONS=Array.isArray(source.questions)?source.questions.map(q=>({...q,subject:q.subject||source.subject,bank:q.bank||activeBank})):[];
    CHAPTERS=Array.isArray(source.topics)?source.topics.map((t,i)=>({...t,id:String(t.id),subject:t.subject||source.subject,bank:t.bank||activeBank,questionCount:Number(t.questionCount||0),startPage:t.startPage||null})):[];
    BY_ID=Object.fromEntries(nkAllBankQuestions().map(q=>[String(q.id),q]));
    CHAPTER_BY_ID=Object.fromEntries(CHAPTERS.map(c=>[String(c.id),c]));
  }
  applySubject(activeSubject,activeBank);
  const IMAGE_PAGES = new Set([6,9,11,62,98,101,160,161,169,217,222,279,306,308,347,348,351,353,354,393,394,395,465,474,526,532,570,596,610,612,614,617,645,652,756,761,763,765,796,887,889,891,900,907]);
  const LS_KEY = 'qbank_state_v1';

  const defaultState = () => ({
    attempts: {},
    bookmarks: {},
    questionNotes: {},
    reviews: {},
    tests: [],
    studyModules: [],
    activeSession: null,
    studyStartedAt: null
  });

  /* @module durable_persistence.js */

  let state = loadState();
  nkNormalizeStudyModules();
  let route = parseHash();
  let searchTerm = '';
  let topicFilter = 'all';
  let toastTimer = null;

  function loadState() { return nkDurableLoadState(); }

  function saveState() {
    if(typeof nkSyncModuleFromSession==='function')nkSyncModuleFromSession();
    const ok=nkDurablePersist(state,'state update');
    if(ok&&typeof nkScheduleCloudSync==='function')nkScheduleCloudSync();
    return ok;
  }

  function parseHash() {
    const h = location.hash.replace(/^#/, '') || 'dashboard';
    const [page, id] = h.split('/');
    return { page: page || 'dashboard', id: id || null };
  }

  function resetScrollPosition(){
    requestAnimationFrame(() => window.scrollTo(0,0));
    requestAnimationFrame(() => { document.documentElement.scrollTop=0; document.body.scrollTop=0; });
  }
  function navigate(page, id = '') {
    const target=id?page+'/'+encodeURIComponent(id):page;
    if((page==='practice'||page==='exam')&&state.activeSession&&!state.activeSession.originRoute){
      state.activeSession.originRoute=['chapter','topics','banks'].includes(route.page)?'topics':['tests','dashboard','bookmarks','wrong','review','modules'].includes(route.page)?route.page:'topics';
      saveState();
    }
    if(page==='result'&&(route.page==='practice'||route.page==='exam')){
      const t=state.tests.find(t=>String(t.id)===String(id)),parent=t?.originRoute||(route.page==='exam'?'tests':'topics');
      history.replaceState(null,'','#'+parent);
      history.pushState(null,'','#'+target);
      route=parseHash();render();resetScrollPosition();return;
    }
    if(location.hash==='#'+target){route=parseHash();render();resetScrollPosition();return;}
    location.hash=target;
  }
  window.addEventListener('hashchange', () => {
    route = parseHash();
    render();
    resetScrollPosition();
  });


  function esc(value) {
    return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
  function fmtNum(n) { return new Intl.NumberFormat('en-IN').format(Math.round(n || 0)); }
  function fmtPct(n) { return `${Math.round(Number(n || 0))}%`; }
  function subjectIcon(name,size=46){
    const n=String(name||'').toLowerCase();
    if(n==='anatomy') return `<svg class="subject-svg anatomy" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><path d="M17 9c-3 0-5 2-5 5v7c0 2 1 4 3 5l-2 10c0 2 2 4 4 4h2l2-9h2l2 9h2c2 0 4-2 4-4l-2-10c2-1 3-3 3-5v-7c0-3-2-5-5-5h-8Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 20h24M17 26h14M19 9v7m10-7v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
    if(n==='physiology') return `<svg class="subject-svg physiology" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M24 13v13m0-9-9-3m9 3 9-3M24 26l-8 12m8-12 8 12M15 21l-5 7m23-7 5 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 19h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
    return `<svg class="subject-svg biochemistry" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><path d="M18 5v8l-8 23a5 5 0 0 0 5 7h18a5 5 0 0 0 5-7l-8-23V5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 25h16M14 34c5-3 10 4 19 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M23 10h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
  }

  function subjectPickerMarkup(){
    return `<div class="nk-topic-subject-switch" aria-label="Choose subject"><div class="nk-topic-subject-label"><span class="nk-home-v4-label">STUDY LIBRARY</span><strong>${esc(activeSubject)}</strong></div><div class="nk-topic-subject-options">${SUBJECTS.map(x=>`<button type="button" class="nk-topic-subject-option ${x.subject===activeSubject?'is-active':''}" onclick="window.QB.nkOpenSubjectLibrary('${esc(x.subject)}')" aria-pressed="${x.subject===activeSubject?'true':'false'}">${esc(x.subject)}</button>`).join('')}</div></div>`;
  }
  
    function setSubject(name){
    if(!SUBJECT_BY_NAME[name]) return;
    applySubject(name,'PrepLadder');
    searchTerm='';
    topicFilter='all';
    if(route && route.page==='dashboard'){
      render();
      resetScrollPosition();
    } else {
      navigate('dashboard');
    }
  }
  function openSubjectTopics(name){
    if(!SUBJECT_BY_NAME[name]) return;
    activeSubject=name;
    localStorage.setItem('qbank_active_subject_v1',activeSubject);
    searchTerm='';
    topicFilter='all';
    navigate('banks',name);
  }
  function openBank(name,bank){
    if(!nkBankRecord(name,bank)) return;
    applySubject(name,bank);
    searchTerm='';
    topicFilter='all';
    navigate('topics');
  }
  function bankPage(name){
    const subject=SUBJECT_BY_NAME[name]?name:activeSubject;
    const banks=nkBankRecords(subject);
    const cards=banks.map(record=>{
      const questions=record.questions||[],topics=record.topics||[];
      const attempted=questions.filter(q=>qAttempts(q.id).length>0).length;
      const pct=questions.length?Math.round(attempted/questions.length*100):0;
      const marrow=record.bank==='Marrow';
      return `<button class="nk-bank-card ${marrow?'is-marrow':''}" onclick="window.QB.openBank('${esc(subject)}','${esc(record.bank)}')"><span class="nk-bank-mark">${record.bank==='UWorld'?'UW':marrow?'M':'PL'}</span><span class="nk-bank-copy"><strong>${esc(record.bank)}</strong><small>${fmtNum(questions.length)} questions · ${fmtNum(topics.length)} topics · ${pct}% completed</small></span><span class="nk-bank-tag">${record.bank==='UWorld'?'Source collection':marrow?'Text explanations':'Original PDF'}</span></button>`;
    }).join('');
    return shell(`<div class="nk-app-v114 nk-bank-page"><button class="nk-bank-back" onclick="window.QB.nav('dashboard')">${navIcon('back',17)} Home</button>${nkAppPageHead(`${subject} · QBank source`,'Choose a question bank','Each bank keeps its own progress. Practice, tests and revision work the same in all of them.')}<div class="nk-bank-grid">${cards}</div></div>`,'topics');
  }
  function subjectSourceNote(q){ const subj=q.subject||activeSubject; return `<div class="small-muted" style="margin-top:10px">Source: ${esc(q.sourceRef||`${subj} · PDF page ${q.sourcePage||'—'}`)}</div>`; }
  function fmtDate(ts, withTime = true) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) + (withTime ? ` · ${d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}` : '');
  }
  function relTime(ts) {
    const diff = Math.max(0, Date.now() - Number(ts || 0));
    const m = Math.round(diff / 60000), h = Math.round(diff / 3600000), d = Math.round(diff / 86400000);
    if (m < 60) return m <= 1 ? 'just now' : `${m} min ago`;
    if (h < 24) return `${h}h ago`;
    return `${d}d ago`;
  }
  function formatDuration(ms) {
    const sec = Math.max(0, Math.round((ms || 0) / 1000));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return `${h}h ${String(m).padStart(2,'0')}m`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function formatTimer(sec) {
    sec = Math.max(0, Math.floor(sec));
    return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  }
  function avg(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

  function qAttempts(qid) { return Array.isArray(state.attempts[qid]) ? state.attempts[qid] : []; }
  function latestAttempt(qid) { const a = qAttempts(qid); return a.length ? a[a.length - 1] : null; }
  function totalAttempted() { return QUESTIONS.filter(q => qAttempts(q.id).length).length; }
  function totalCorrectAttempts() { return Object.values(state.attempts).flat().filter(a => a.correct).length; }
  function totalIncorrectAttempts() { return Object.values(state.attempts).flat().filter(a => !a.correct).length; }
  function totalAttempts() { return totalCorrectAttempts()+totalIncorrectAttempts(); }
  function totalStudyMs() {
    const practiceTime = Object.values(state.attempts).flat().filter(a => a.source !== 'exam').reduce((s,a)=>s+(a.timeSpent||0),0);
    const testTime = state.tests.reduce((s,t)=>s+(t.totalTimeMs||0),0);
    return practiceTime + testTime;
  }
  function overallAccuracy() {
    const n = totalAttempts(); return n ? totalCorrectAttempts()/n*100 : 0;
  }
  function chapterQuestions(cid) { return QUESTIONS.filter(q => String(q.chapterId) === String(cid)); }
  function chapterStats(cid) {
    // Completion counts only questions that accept an answer; accuracy counts
    // only active answers (undo events and undone answers are not misses).
    const qs = chapterQuestions(cid).filter(q=>typeof nkFsrsAnswerable!=='function'||nkFsrsAnswerable(q));
    const at = qs.flatMap(q=>qAttempts(q.id)||[]).filter(a=>a&&!a.isUndo&&!a.isRatingRevision&&typeof a.correct==='boolean');
    const attempted = qs.filter(q=>qAttempts(q.id).length).length;
    const correct = at.filter(a=>a.correct).length;
    const incorrect = at.filter(a=>!a.correct).length;
    return {total:qs.length, attempted, correct, incorrect, accuracy: (correct+incorrect)?correct/(correct+incorrect)*100:0};
  }
  function wrongQuestions() { return QUESTIONS.filter(q => qAttempts(q.id).some(a=>!a.correct)); }
  function dueQuestions() { return QUESTIONS.filter(q => { const r=state.reviews[q.id]; return r && r.nextReviewAt && r.nextReviewAt <= Date.now(); }); }
  function bookmarkedQuestions() { return QUESTIONS.filter(q => state.bookmarks[q.id]); }
  function pendingReviewCount() { return dueQuestions().length; }

  function dayKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function dayStart(date = new Date()) {
    const d = new Date(date); d.setHours(0,0,0,0); return d;
  }
  function studyDayKeys() {
    // A study day needs a real answer: undo events, rating edits and undone
    // answers never create (or keep alive) a streak. Matches Insights.
    const keys=new Set();
    Object.entries(state.attempts||{}).forEach(([qid,list])=>{
      (typeof qAttempts==='function'?qAttempts(qid):(list||[])).forEach(a=>{if(a&&!a.isUndo&&!a.isRatingRevision&&typeof a.correct==='boolean'&&Number(a.reviewedAt||a.at)>0)keys.add(dayKey(Number(a.reviewedAt||a.at)));});
    });
    return keys;
  }
  function currentStreak() {
    const days=studyDayKeys(), today=dayStart();
    let cursor=new Date(today);
    if(!days.has(dayKey(cursor))){
      cursor.setDate(cursor.getDate()-1);
      if(!days.has(dayKey(cursor))) return 0;
    }
    let n=0;
    while(days.has(dayKey(cursor))){ n++; cursor.setDate(cursor.getDate()-1); }
    return n;
  }
  function streakMarkup(){
    const streak=currentStreak(), days=new Set();
    for(const a of Object.values(state.attempts)) for(const x of a) if(x.ts) days.add(dayKey(new Date(x.ts)));
    const now=new Date(), names=['S','M','T','W','T','F','S'], items=[];
    for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);const active=days.has(dayKey(d)),today=i===0;items.push(`<div class="streak-mini-day ${active?'done':''} ${today?'today':''}"><span>${active?'✓':names[d.getDay()]}</span></div>`)}
    return `<section class="card streak-card streak-card-compact"><div class="streak-compact-main"><div class="streak-compact-flame">${flameIcon(28)}</div><div><div class="streak-compact-title">Study streak</div><div class="streak-compact-number">${streak}<span> day${streak===1?'':'s'}</span></div></div></div><div class="streak-compact-week">${items.join('')}</div><div class="streak-compact-note">${streak?'Keep the chain alive today.':'Start today to begin your streak.'}</div></section>`;
  }

  function updateReview(qid, correct) {
    const now = Date.now();
    const prev = state.reviews[qid] || { attempts:0, streak:0, intervalDays:0, lastReviewedAt:null, nextReviewAt:null };
    const streak = correct ? Math.min(prev.streak + 1, 6) : 0;
    const intervals = [0.0069, 0.04, 1, 3, 7, 14, 30]; // ~10 min, 1h, 1d...
    const intervalDays = correct ? intervals[streak] : 0.0069;
    state.reviews[qid] = {
      attempts: prev.attempts + 1,
      streak,
      intervalDays,
      lastReviewedAt: now,
      nextReviewAt: now + intervalDays*86400000
    };
  }

  function recordAttempt(qid, selected, timeSpent, source='practice') {
    const q = BY_ID[qid];
    if (!q || !selected) return false;
    const correct = q.correctOption === selected;
    const entry = { id: `${Date.now()}_${Math.random().toString(16).slice(2)}`, selected, correct, timeSpent: Math.max(0, timeSpent || 0), at: Date.now(), source };
    if (!state.attempts[qid]) state.attempts[qid] = [];
    state.attempts[qid].push(entry);
    updateReview(qid, correct);
    saveState();
    return correct;
  }

  function nkMarkSkippedFromSession(s){
    // Skip rule (shared by Practice, timed tests, revision and study modules). An
    // unanswered question counts as skipped, and enters FSRS, when you clearly met it:
    //   1) it comes BEFORE your last answered question (you moved past it), or
    //   2) you spent real time on it (>= 15 s) - you tried and could not answer, even
    //      if it is one of the last questions of the session.
    // Questions you never opened (or only glanced at) after your last answer stay out,
    // and a session with no answers marks only questions you genuinely worked on.
    // Questions that already have history are in FSRS already; unanswerable ones never enter.
    if(!s?.questionIds?.length)return;
    const ENGAGED_MS=15000;

  function chapterPage(cid) {
    const c=CHAPTER_BY_ID[String(cid)];if(!c)return topics();
    const qs=chapterQuestions(c.id),s=chapterStats(c.id),total=s.total,now=Date.now();
    // Per-question status from the latest answer; the overview never reports accuracy before an answer exists.
    // Skipped = left unanswered in a submitted session (moved past it, or worked on it 15 s+); unattempted = never reached.
    const skippedIds=state.fsrsReviewEligible||{};
    const rows=qs.map(q=>{const a=latestAttempt(q.id);return {q,st:a?(a.correct?'c':'w'):skippedIds[q.id]?.reason==='skipped'?'k':'u',b:Boolean(state.bookmarks&&state.bookmarks[q.id])};});
    const correct=rows.filter(r=>r.st==='c').length,wrong=rows.filter(r=>r.st==='w').length,skipped=rows.filter(r=>r.st==='k').length,left=Math.max(0,total-s.attempted),fresh=Math.max(0,left-skipped),marked=rows.filter(r=>r.b).length;
    const due=qs.filter(q=>{const r=state.reviews&&state.reviews[q.id];return r&&r.nextReviewAt&&r.nextReviewAt<=now;}).length;
    const cont=typeof nkTopicPracticeContinuation==='function'?nkTopicPracticeContinuation(activeSubject,activeBank):null,resume=cont&&cont.sessionId&&cont.total>1&&String(cont.topicId)===String(c.id)?cont:null;

    const map=`<div class="nk-topic-map">${rows.map(({q,st,b})=>`<button class="nk-library-row nk-topic-cell is-${st}${b?' is-b':''}" data-s="${st}" aria-label="Question ${q.questionNumber}, ${label[st]}${b?', saved':''}" onclick="window.QB.practiceOne('${q.id}')">${q.questionNumber}</button>`).join('')}</div>`;

    const primary=phase==='new'?['Start practice',`${fmtNum(total)} questions`]:phase==='done'?['Practice again',`All ${fmtNum(total)}`]:phase==='paused'?['Start a new practice session',`${fmtNum(total)} questions`]:['Continue practice',`${fmtNum(left)} of ${fmtNum(total)} left`];

    </div>`,'topics');

  function nkTopicPracticeSet(cid,kind){

  /* @module study_modules.js */

  function richText(text) {
    return nkScientificMarkup(text).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  }

  function splitSourceParagraphs(text){
    const lines=String(text||'').replace(/\r/g,'').split('\n');
    const chunks=[]; let cur=[]; let bullet=false;
    const flush=()=>{if(cur.length){chunks.push(cur.join(' ').replace(/\s+/g,' ').trim());cur=[];bullet=false;}};
    const heading=/^(Algorithm|Investigations|Significance|Mechanism|Key point|Recognition|Cause|Regulation|Identification Tips|Other options|Correct Option|Simple carbohydrates|Polysaccharides|Locations of Various)\s*:?\s*$/i;
    lines.forEach(line=>{
      const t=line.trim();
      if(!t){flush();return;}
      if(heading.test(t)){flush();chunks.push(t);return;}
      if(/^•\s*/.test(t) || /^[-–—]\s+/.test(t)){flush();cur=[t];bullet=true;return;}
      if(bullet){cur.push(t);return;}
      cur.push(t);
    });
    flush();
    return chunks.filter(Boolean);
  }

  function parseOptionBlocks(text, question){
    const sourceOptions=Array.isArray(question?.options)?question.options:[];
    const raw=String(text||'').replace(/\r/g,'').trim();
    const headingMatch=/\b(Other options|Incorrect Options|Incorrect Option|Incorrect Choices)\s*:\s*/i.exec(raw);
    if(!headingMatch) return {pre:raw,items:[],heading:''};
    const pre=raw.slice(0,headingMatch.index).trim();
    const optionText=raw.slice(headingMatch.index+headingMatch[0].length).trim();
    const marker=/(?:\(\s*Option\s+([A-E])\s*\)|\bOption\s+([A-E])\s*[-:])/ig;
    const markers=[...optionText.matchAll(marker)];
    if(!markers.length) return {pre,items:[],heading:headingMatch[1]};
    const items=[];
    for(let i=0;i<markers.length;i++){
      const m=markers[i], letter=(m[1]||m[2]).toUpperCase();
      const segEnd=i<markers.length-1?markers[i+1].index:optionText.length;
      let after=optionText.slice(m.index+m[0].length,segEnd).trim();
      const opt=sourceOptions.find(o=>String(o.letter).toUpperCase()===letter);
      const title=opt?.text||`Option ${letter}`;
      const titleRx=new RegExp('^'+title.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\s*[:\\-–—]?\\s*','i');
      after=after.replace(titleRx,'').trim();
      if(i<markers.length-1){
        const nextLetter=(markers[i+1][1]||markers[i+1][2]).toUpperCase();
        const nextOpt=sourceOptions.find(o=>String(o.letter).toUpperCase()===nextLetter);
        if(nextOpt){const nextTitle=String(nextOpt.text||'').trim();const trailRx=new RegExp('\\s*'+nextTitle.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\s*$','i');after=after.replace(trailRx,'').trim();}
      }
      items.push({letter,title,body:after});
    }
    return {pre,items,heading:headingMatch[1]};
  }

  function parseSourceTable(text){
    const lines=String(text||'').replace(/\r/g,'').split('\n');
    for(let h=0;h<Math.min(lines.length,30);h++){
      const line=lines[h]; const runs=[...line.matchAll(/\s{4,}/g)]; if(runs.length<1) continue;
      const positions=[0,...runs.map(r=>r.index+r[0].length)]; const heads=line.split(/\s{4,}/).map(x=>x.trim()).filter(Boolean); if(heads.length<2)continue;
      const looksLikeRow=(l)=>{if(!l.trim())return false;const lead=(l.match(/^\s*/)||[''])[0].length;if(lead>0&&positions.some(p=>Math.abs(p-lead)<=2))return true;return /\s{4,}/.test(l);};
      let i=h+1,rowBlocks=[],cur=[],boundary=false;const flush=()=>{if(cur.length){rowBlocks.push(cur);cur=[];}};
      for(;i<lines.length;i++){const l=lines[i];if(!l.trim()){flush();boundary=true;continue;}if(/^(Other options|Incorrect Options|Incorrect Option|Incorrect Choices)\s*:/i.test(l.trim())){flush();break;}if(boundary&&rowBlocks.length&&!looksLikeRow(l))break;boundary=false;cur.push(l);}flush();
      const rows=[];for(const block of rowBlocks){const first=block[0],cells=[];for(let c=0;c<positions.length;c++){const aa=positions[c],bb=c+1<positions.length?positions[c+1]:first.length;cells.push(first.slice(aa,bb).trim());}for(const cont of block.slice(1)){for(let c=0;c<positions.length;c++){const piece=cont.slice(positions[c],c+1<positions.length?positions[c+1]:cont.length).trim();if(piece)cells[c]=(cells[c]?cells[c]+' ':'')+piece;}}if(cells.some(Boolean))rows.push(cells);}if(rows.length)return {heads,rows,startLine:h,consumedLines:i};
    }
    return null;
  }

  function renderSourceTable(table){
    const head=table.heads||[], rows=table.rows||[];
    return `<div class="source-table-card" role="table" aria-label="Source explanation table"><div class="source-table-desktop" style="--table-cols:${head.length}"><div class="source-table-head">${head.map(h=>`<div>${richText(h)}</div>`).join('')}</div>${rows.map(r=>`<div class="source-table-row">${head.map((h,j)=>`<div class="${j===0?'row-label':''}">${richText(r[j]||'')}</div>`).join('')}</div>`).join('')}</div><div class="source-table-mobile">${rows.map(r=>`<article class="source-table-mobile-row">${head.map((h,j)=>`<div class="source-table-mobile-cell"><span class="source-table-mobile-label">${richText(h)}</span><span class="source-table-mobile-value ${j===0?'row-label':''}">${richText(r[j]||'')}</span></div>`).join('')}</article>`).join('')}</div></div>`;
  }

  function renderOptionReview(items,question){
    const correct=Number(question?.correctOption||0);
    return `<div class="explain-section-title option-review-title">Option-by-option review</div><div class="explain-option-list">${items.map(x=>{const isCorrect=Number(x.letter.charCodeAt(0)-64)===correct;return `<article class="explain-option-item ${isCorrect?'fits':''}"><div class="explain-option-head"><span class="explain-tag">Option ${x.letter}</span><span>${richText(x.title)}</span></div><div class="explain-option-reason">${isCorrect?'Why it fits':'Why it doesn’t fit'}</div><div class="explain-option-body">${richText(x.body||'The supplied source does not provide a separate reason for this option.')}</div></article>`;}).join('')}</div>`;
  }

  function renderPlainExplanation(text){
    if(!text)return '';
    return splitSourceParagraphs(text).map(p=>{if(/^•\s*/.test(p))return `<div class="explain-bullet"><span class="bullet-dot">•</span><div>${richText(p.replace(/^•\s*/,''))}</div></div>`;if(/^(Algorithm|Investigations|Significance|Mechanism|Key point|Recognition|Cause|Regulation|Identification Tips|Other options|Correct Option|Simple carbohydrates|Polysaccharides|Locations of Various)\s*:?\s*$/i.test(p))return `<div class="explain-section-title">${richText(p.replace(/:$/,''))}</div>`;return `<p class="explain-paragraph">${richText(p)}</p>`;}).join('');
  }

  function renderExplanationText(text,question){
    const id=String(question?.id||'').toLowerCase();
    const sourceSubject=String(question?.subject||'').toLowerCase();
    const sourceRef=String(question?.sourceRef||'').toLowerCase();
    const subject=id.startsWith('anatomy-')?'anatomy':(sourceSubject==='physiology'||id.startsWith('physiology-')||sourceRef.includes('physiology')?'physiology':'biochemistry');
    const label=subject==='physiology'?'Physiology':(subject==='anatomy'?'Anatomy':'Biochemistry');
    let segments=[];
    if(subject==='biochemistry' && window.BIOCHEM_SOURCE_SOLUTIONS){
      const hit=window.BIOCHEM_SOURCE_SOLUTIONS.find(x=>x.id===String(question?.id||''));
      segments=hit?.segments||[];
    } else if(window.SUBJECT_SOURCE_SOLUTIONS?.[subject]) {
      const hit=window.SUBJECT_SOURCE_SOLUTIONS[subject].find(x=>x.id===String(question?.id||''));
      segments=hit?.segments||[];
    }
    if(!segments.length){
      const ref=String(question?.sourceRef||'');
      const m=ref.match(/Solution\s+Pages?\s+(\d+)(?:\s*-\s*(\d+))?/i);
      if(m){const a=Number(m[1]),b=Number(m[2]||m[1]);for(let p=a;p<=b;p++)segments.push({page:p});}
    }
    if(!segments.length)return '';
    if(location.hostname!=='qbank.local')return `<div class="source-pdf-explanation"><div class="source-pdf-scroll"><div class="source-pdf-head">Original source solution · ${label}</div>${segments.map(seg=>`<div class="source-pdf-page nk-web-pdf-segment" data-subject="${subject}" data-page="${seg.page}" data-top="${seg.top??''}" data-bottom="${seg.bottom??''}"><canvas aria-label="Original ${label} PDF solution page ${seg.page}"></canvas><div class="nk-web-pdf-status">Loading original source…</div></div>`).join('')}<div class="source-pdf-note">Rendered locally from the original PDF. No explanation text is reconstructed.</div></div></div>`;
    const url=seg=>`https://qbank.local/${subject}/pdf?page=${encodeURIComponent(seg.page)}&scale=4${seg.top!=null?`&top=${encodeURIComponent(seg.top)}`:''}${seg.bottom!=null?`&bottom=${encodeURIComponent(seg.bottom)}`:''}`;
    return `<div class="source-pdf-explanation"><div class="source-pdf-scroll"><div class="source-pdf-head">Original source solution · ${label}</div>${segments.map(seg=>`<div class="source-pdf-page" onclick="window.openSourceZoom(this.querySelector('img'))"><img loading="lazy" src="${url(seg)}" data-source-page="${seg.page}" alt="Original ${label} PDF solution page ${seg.page}"></div>`).join('')}<div class="source-pdf-note">Original PDF rendering only. No explanation text is parsed or reconstructed.</div></div></div>`;
  }

  function physSourcePages(q){const m=String(q?.sourceRef||'').match(/Solution Pages?\s+(\d+)(?:-(\d+))?/i);if(!m)return[];const a=+m[1],b=+(m[2]||m[1]),o=[];for(let p=a;p<=b;p++)o.push(p);return o;}
  function physQuestionPages(q){if(!q||q.subject!=='Physiology'||!Array.isArray(window.PHYSIOLOGY_IMAGE_PAGES))return[];const a=+q.sourcePage||0,b=+q.sourcePageEnd||a;return window.PHYSIOLOGY_IMAGE_PAGES.filter(p=>p>=a&&p<=b);}

  function renderPhysiologySourceExplanation(q){const pages=physSourcePages(q);if(!pages.length)return `<div class="phys-source-note">Original source explanation is not mapped.</div>`;return `<div class="phys-source-explanation"><div class="phys-source-head">Original source explanation</div>${pages.map(p=>`<div class="phys-source-page" onclick="window.openPhysSourceImage(this.querySelector('img'))"><img loading="lazy" src="${physPdfUrl(p)}" alt="Original Physiology explanation, PDF page ${p}" data-source-page="${p}"></div>`).join('')}<div class="phys-source-note">Taken directly from the original Physiology PDF. Tap to open full-screen; pinch, drag, or use +/− to zoom.</div></div>`;}

  function nkSourceTakeaway(q) {
    const reviewed=String(q?.keyTakeaway||q?.takeaway||'').replace(/\s+/g,' ').trim();
    if(reviewed.length>=24) return reviewed;
    const option=Array.isArray(q?.options)?q.options[Number(q.correctOption)-1]:null;
    const answer=String(option?.text||'').replace(/\s+/g,' ').trim();
    let source=String(q?.explanation||'').replace(/\r/g,'\n');
    if(!answer || !source) return '';
    source=source
      .replace(/^\s*Correct\s+(?:Answer|answer|Option)\s*:?\s*[A-E]\)?[^\n]*\n?/i,'')
      .replace(/^\s*Explanation\s*:?\s*/i,'')
      .replace(/[•▪◦]\s*/g,' ')
      .replace(/\s+/g,' ')
      .trim();
    const stop=new Set(['this','that','with','from','into','than','then','which','what','when','where','have','has','were','been','being','their','there','about','answer','option','correct']);
    const tokens=answer.toLowerCase().replace(/[^a-z0-9+]+/g,' ').split(/\s+/).filter(x=>x.length>=4&&!stop.has(x));
    if(!tokens.length) return '';
    const sentences=(source.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[])
      .map(x=>x.replace(/^[-–—:\s]+/,'').replace(/\s*\(Option\s+[A-E]\)\s*/ig,' ').replace(/\s+/g,' ').trim())
      .filter(x=>x.length>=35&&x.length<=300&&/^[A-Z0-9]/.test(x));
    let best='',bestScore=0;
    sentences.forEach(sentence=>{
      const lower=sentence.toLowerCase();
      const overlap=tokens.reduce((n,t)=>n+(lower.includes(t)?1:0),0);
      const exact=answer.length>=5&&lower.includes(answer.toLowerCase())?3:0;
      const score=overlap+exact-(sentence.length>240?1:0);
      if(score>bestScore){best=sentence;bestScore=score;}
    });
    const needed=tokens.length===1?1:2;
    return best&&bestScore>=needed?best:'';
  }

  // NK_MARROW_STRUCTURED_TABLE_RENDERER_V1
  function nkMarrowTableCellText(value){
    if(value===null||value===undefined)return '';
    if(Array.isArray(value))return value.map(nkMarrowTableCellText).filter(Boolean).join(' · ');
    if(typeof value==='object'){
      for(const key of ['text','label','value','title','name','content']){
        if(Object.prototype.hasOwnProperty.call(value,key)){
          const nested=nkMarrowTableCellText(value[key]);
          if(nested)return nested;
        }
      }
      return Object.values(value).map(nkMarrowTableCellText).filter(Boolean).join(' · ');
    }
    return String(value).trim();
  }

  function nkNormalizeMarrowStructuredTable(table){
    const sourceTable=(table&&typeof table==='object')?table:{};
    const rawColumns=Array.isArray(sourceTable.columns)&&sourceTable.columns.length
      ? sourceTable.columns
      : Array.isArray(sourceTable.headers)?sourceTable.headers:null;

    if(!rawColumns||rawColumns.length===0)return sourceTable;

    const columns=rawColumns.map((column,index)=>{
      if(column&&typeof column==='object'&&!Array.isArray(column)){
        const key=String(column.key??column.id??column.field??index);
        const label=Object.prototype.hasOwnProperty.call(column,'label')
          ? nkMarrowTableCellText(column.label)
          : nkMarrowTableCellText(column.title??column.name??column.text??column.key??'');
        return {key,label};
      }
      return {key:String(index),label:nkMarrowTableCellText(column)};
    });

    const rawRows=Array.isArray(sourceTable.rows)?sourceTable.rows:[];
    const rows=rawRows.map(row=>{
      if(Array.isArray(row))return columns.map((_,index)=>nkMarrowTableCellText(row[index]));
      if(row&&typeof row==='object'){
        if(Array.isArray(row.cells)){
          const byKey=new Map();
          row.cells.forEach((cell,index)=>{
            if(cell&&typeof cell==='object'&&!Array.isArray(cell)){
              const key=cell.key??cell.column??cell.columnKey;
              if(key!==undefined&&key!==null)byKey.set(String(key),cell);
            }
            if(!byKey.has(String(index)))byKey.set(String(index),cell);
          });
          return columns.map((column,index)=>{
            let cell=byKey.has(column.key)?byKey.get(column.key):byKey.get(String(index));
            if(cell&&typeof cell==='object'&&!Array.isArray(cell)){
              cell=Object.prototype.hasOwnProperty.call(cell,'value')?cell.value:
                   Object.prototype.hasOwnProperty.call(cell,'text')?cell.text:
                   Object.prototype.hasOwnProperty.call(cell,'content')?cell.content:
                   Object.prototype.hasOwnProperty.call(cell,'label')?cell.label:cell;
            }
            return nkMarrowTableCellText(cell);
          });
        }
        return columns.map(column=>nkMarrowTableCellText(row[column.key]));
      }
      return columns.map((_,index)=>index===0?nkMarrowTableCellText(row):'');
    });

    return {...sourceTable,columns:columns.map(column=>column.label),rows};
  }

  function nkRenderMarrowTableCompat(table){
    return nkRenderMarrowTable(nkNormalizeMarrowStructuredTable(table));
  }

  /* NK_CANONICAL_BANK_EXPLANATION_WIRING_V1 */
  const NK_MARROW_EXPLANATION_GOLD_V1=__NK_DATA_MARROW_EXPLANATION_GOLD__;

  function nkGoldText(text,emphasis=[]){
    let html=nkScientificMarkup(text);
    [...emphasis].sort((a,b)=>String(b).length-String(a).length).forEach(phrase=>{
      const needle=nkScientificMarkup(phrase);
      if(needle) html=html.split(needle).join('<strong class="nk-gold-em">'+needle+'</strong>');
    });
    return html;
  }

  function nkGoldSignalWords(text){
    const stop=new Set(['the','and','for','from','that','this','with','into','are','was','were','has','have','had','its','their','during','after','before','through','about','which','when','where','then','than','only','also','known','called']);
    return String(text||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').split(/\s+/).filter(w=>w.length>2&&!stop.has(w));
  }

  function nkGoldOverlap(a,b){
    const aa=new Set(nkGoldSignalWords(a)),bb=new Set(nkGoldSignalWords(b));
    if(!aa.size||!bb.size)return 0;
    let hit=0;aa.forEach(w=>{if(bb.has(w))hit++;});
    return hit/Math.min(aa.size,bb.size);
  }

  function nkGoldConciseText(text,q){
    let blocks=String(text||'').replace(/\r/g,'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    blocks=blocks.filter(block=>{
      const flat=block.replace(/\s+/g,' ').trim();
      if(/^options?\s+[a-d](?:\s*(?:,|and|&)\s*[a-d])*\s*:/i.test(flat))return false;
      const boiler=/\b(image|figure|flowchart)\b/i.test(flat)&&/\b(given below|shown below|below shows|image below|flowchart below|figure below)\b/i.test(flat);
      const sentences=(flat.match(/[.!?]+/g)||[]).length;
      if(boiler&&flat.length<180&&sentences<=1)return false;
      return true;
    });
    if(blocks.length>1){
      const first=blocks[0].replace(/\s+/g,' ').trim();
      const takeaway=nkMarrowTakeaway(q);
      if(first.length<=280&&takeaway&&nkGoldOverlap(first,takeaway)>=0.72)blocks.shift();
    }
    return blocks.join('\n\n');
  }

  function nkRenderMarrowGoldText(text,cfg){
    const lines=String(text||'').replace(/\r/g,'').split('\n'),out=[];let para=[],items=[],ordered=false;
    const emphasis=Array.isArray(cfg?.emphasis)?cfg.emphasis:[];
    const flushPara=()=>{if(para.length){out.push('<p>'+nkGoldText(para.join(' ').replace(/\s+/g,' ').trim(),emphasis)+'</p>');para=[];}};
    const flushList=()=>{if(items.length){const tag=ordered?'ol':'ul';out.push('<'+tag+'>'+items.map(x=>'<li>'+nkGoldText(x,emphasis)+'</li>').join('')+'</'+tag+'>');items=[];ordered=false;}};
    lines.forEach(line=>{
      const t=line.trim();
      if(!t){flushPara();flushList();return;}
      const bullet=t.match(/^[•▪◦-]\s*(.+)$/),num=t.match(/^\d+[.)]\s*(.+)$/);
      if(bullet||num){flushPara();if(items.length&&ordered!==Boolean(num))flushList();ordered=Boolean(num);items.push((bullet||num)[1]);return;}
      if(/^[A-Z][A-Za-z0-9 &/()'’+\-]{2,65}:$/.test(t)){flushPara();flushList();out.push('<div class="nk-marrow-heading">'+nkGoldText(t.slice(0,-1),emphasis)+'</div>');return;}
      para.push(t);
    });
    flushPara();flushList();
    return out.join('');
  }

  function nkRenderGoldWrongOptions(q,cfg){
    const reasons=cfg?.rationales||{},correct=Number(q.correctOption);
    const rows=(Array.isArray(q.options)?q.options:[]).map((o,i)=>({o,n:i+1})).filter(x=>x.n!==correct).map(({o,n})=>{
      const key=String(o.letter||String.fromCharCode(64+n)).toLowerCase();
      const reason=reasons[key];
      if(!reason)return'';
      return '<div class="nk-gold-wrong-row"><div class="nk-gold-wrong-option"><span>'+esc(String(o.letter||String.fromCharCode(64+n)).toUpperCase())+'</span><strong>'+esc(o.text||'')+'</strong></div><p>'+nkScientificMarkup(reason)+'</p></div>';
    }).join('');
    return rows?'<section class="nk-gold-wrong"><div class="nk-gold-wrong-title">Why the other options are wrong</div>'+rows+'</section>':'';
  }

  function nkRenderMarrowExplanation(q){
    return '<div data-marrow-explanation="'+esc(String(q.id))+'">'+nkRenderMarrowExplanationContent(q)+'</div>';
  }
  function nkRenderMarrowExplanationContent(q){
    const cfg=NK_MARROW_EXPLANATION_GOLD_V1[String(q.id)];
    if(!cfg)return nkRenderMarrowExplanationBase(q);
    const data=q.structuredExplanation||{},text=data.text||q.explanation||'',tables=Array.isArray(cfg?.displayTables)?cfg.displayTables:(Array.isArray(data.tables)?data.tables:[]);
    const displayText=String(cfg?.displayText||'').trim();
    const conciseText=displayText||nkGoldConciseText(text,q);
    const trace=q.provenance||{},pages=Array.isArray(trace.explanationPages)?trace.explanationPages:[];
    return '<div class="nk-marrow-native nk-gold-explanation">'+
      nkRenderMarrowGoldText(conciseText,cfg)+
      tables.map(nkRenderMarrowTableCompat).join('')+
      nkRenderGoldWrongOptions(q,cfg)+
      '<div class="nk-marrow-provenance">Marrow ED 8 structured transcription'+(pages.length?' · explanation page'+(pages.length===1?'':'s')+' '+pages.join(', '):'')+'. Figure metadata is preserved for later image-asset integration.</div></div>';
  }

  function nkMarrowTakeaway(q) {
    const augmented=(typeof NK_MARROW_EXPLANATION_GOLD_V1!=='undefined')?NK_MARROW_EXPLANATION_GOLD_V1[String(q?.id)]:null;
    const augmentedTakeaway=String(augmented?.takeaway||'').trim();
    if(augmentedTakeaway) return augmentedTakeaway;
    const reviewed=nkSourceTakeaway(q);
    if(reviewed) return reviewed;
    const structured=q?.structuredExplanation||{};
    const raw=String(structured.text||q?.explanation||'')
      .replace(/\r/g,'\n')
      .replace(/[•▪◦]\s*/g,' ')
      .replace(/\s+/g,' ')
      .trim();
    const sentences=(raw.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[])
      .map(x=>x.replace(/^[-–—:\s]+/,'').replace(/\s+/g,' ').trim())
      .filter(x=>x.length>=24&&x.length<=280);
    if(sentences.length) return sentences[0];
    const option=Array.isArray(q?.options)?q.options[Number(q.correctOption)-1]:null;
    const answer=String(option?.text||'').replace(/\s+/g,' ').trim();
    return answer?('Correct answer: '+answer+'.'):'';
  }

    return `<div class="nk-study-support">${time}${takeaway?`<section class="nk-key-takeaway"><span class="nk-takeaway-icon">${navIcon('bulb',22)}</span><div><div class="nk-takeaway-label">Key takeaway</div><p>${nkScientificMarkup(takeaway)}</p></div></section>`:''}${sourceHeader}</div>`;

  function buildReviewSession(t) {

  }

  function reviewTest(testId){
      let stage='lookup';
      try{
        let wanted=String(testId==null?'':testId);
        try{wanted=decodeURIComponent(wanted);}catch(_){stage='lookup-decode';}
        const tests=Array.isArray(state.tests)?state.tests:[];
        const t=tests.find(x=>String(x.id)===wanted || String(x.id)===String(testId));
        if(!t){showToast('That completed test could not be found.','bad');return false;}
        if(!Array.isArray(t.questionIds)||!t.questionIds.length){showToast('This test has no saved questions to review.','bad');return false;}
        stage='session';
        const session=buildReviewSession(t);
        session.questionEnteredAt=Date.now();
        state.activeSession=session;
        stage='save'; saveState();
        stage='route'; route={page:'review-test',id:String(t.id)};
        stage='render'; render();
        stage='history';
        try{history.replaceState(null,'',`#review-test/${encodeURIComponent(String(t.id))}`);}catch(_){location.hash=`#review-test/${encodeURIComponent(String(t.id))}`;}
        return true;
      }catch(e){
        console.error('Review Solutions failed at '+stage,e);
        showToast('Review Solutions failed at '+stage+'.','bad');
        return false;
      }
    }
    function reviewTestPage(){
    let s=state.activeSession;
    const routeId=(()=>{try{return decodeURIComponent(String(route.id||''));}catch(_){return String(route.id||'');}})();
    if(!s || s.mode!=='review' || (routeId&&String(s.sourceTestId)!==routeId)){
      const t=state.tests.find(x=>String(x.id)===routeId||String(x.id)===String(route.id));
      if(!t)return testsPage();
      s=buildReviewSession(t);state.activeSession=s;saveState();
    }
    const q=BY_ID[s.questionIds[s.index]];if(!q)return testsPage();
    const selected=s.answers[q.id]||null;
    const renderedSource=q.explanation?renderExplanationText(q.explanation,q):'';
    const gridAttrs='id="cr-grid" title="Question Navigator" onclick="window.QB.openQuestionNavigator()"';
    const headerClass='practice-focus-head nk-session-head';
    return sessionShell(`<div class="nk-v114-session is-review">${nkSessionHeader(q,s,'review','',gridAttrs,headerClass)}<div class="question-shell"><section class="question-card">${nkQuestionContext(q)}<div class="question-text" data-marrow-question="${q.bank!=='PrepLadder'?esc(String(q.id)):''}">${nkQuestionStemMarkup(q)}</div><div class="option-list">${nkSessionOptions(q,selected,'review',true)}</div>${nkStudySupport(q,s.questionTimes?.[q.id]||0,!selected,renderedSource)}</section></div></div>`,'tests')+nkSessionActionBar(s,'review');
  }

  function jumpFromNavigator(i){ closeQuestionNavigator(); goIndex(i); }

  function finishPracticeSession() {
    closeQuestionNavigator();
    const s=state.activeSession;
    if(!s || s.mode!=='practice') return;
    savePracticeElapsed();
    const qt={...(s.questionTimes||{})}, answers={...(s.answers||{})};
    let correct=0, incorrect=0, attempted=0;
    Object.entries(answers).forEach(([id,sel])=>{
      if(!sel) return;
      attempted++;
      const q=BY_ID[id];
      if(q && Number(q.correctOption)===Number(sel)) correct++; else incorrect++;
    });
    const total=s.questionIds.length;
    const unattempted=Math.max(0,total-attempted);
    const totalTimeMs=Object.values(qt).reduce((a,b)=>a+(Number(b)||0),0);
    const test={
      id:`p_${Date.now()}_${Math.random().toString(16).slice(2)}`,
      title:s.title,
      kind:'practice', studyModuleId:s.studyModuleId||null, sessionId:s.id,
      questionIds:[...s.questionIds],
      answers,
      questionTimes:qt,
      correct, incorrect, unattempted, total, attempted,
      totalTimeMs, createdAt:Date.now(), autoSubmitted:false
    };
    state.tests.push(test);
    state.tests=state.tests.slice(-100);
    if(s.studyModuleId) nkCompleteStudyModule(s.studyModuleId,test);
    state.activeSession=null;
    saveState();
    document.querySelectorAll('#toast-root .toast').forEach(e=>e.remove());
    navigate('result',test.id);
  }

  function endSession() {
    const s=state.activeSession;

    state.activeSession=null; saveState(); navigate('dashboard');
  }

  let ticker=null;
  function startExamTicker(){clearInterval(ticker);const current=state.activeSession;if(!current||current.mode!=='exam')return;ticker=setInterval(()=>{const s=state.activeSession;if(!s||s.mode!=='exam'){clearInterval(ticker);return;}let remaining;if(s.timerMode==='per-question'){const id=String(s.questionIds[s.index]);remaining=60-Math.floor(nkStrictSpent(s,id)/1000);const el=document.getElementById('exam-timer');if(el){el.textContent=remaining<=0?'Time expired':formatTimer(Math.max(0,remaining));el.className='timer '+(remaining<15?'danger':remaining<30?'warn':'');}if(remaining<=0){clearInterval(ticker);nkExpireTopicQuestion();}}else{remaining=s.questionIds.length*60-Math.floor((Date.now()-s.startedAt)/1000);const el=document.getElementById('exam-timer');if(el){el.textContent=formatTimer(Math.max(0,remaining));el.className='timer '+(remaining<120?'danger':remaining<300?'warn':'');}if(remaining<=0){clearInterval(ticker);submitExam(true);}}},250);}

    document.querySelectorAll('input[name="exam-chapter"]').forEach(x=>x.checked=true);
    updateExamPoolCount();
  }
  function updateExamPoolCount() {
    const ids=examPoolIds();
    const pool=document.getElementById('exam-pool-count');
    if(pool) pool.textContent=`Question pool: ${fmtNum(ids.length)}`;
    const sel=document.getElementById('session-count');
    if(sel){
      const current=Number(sel.value||20);
      const allowed=[10,20,30,40,60,80].filter(n=>n<=ids.length);
      if(ids.length && !allowed.includes(current)) sel.value=String(allowed[allowed.length-1]||ids.length);
      if(!ids.length) sel.innerHTML='<option value="0">No questions available</option>';
    }
    const count=document.getElementById('exam-selected-count');

  }
  function confirmSession(cid,mode,total) {
    let ids=cid?chapterQuestions(cid).map(q=>q.id):QUESTIONS.map(q=>q.id);
    let title=cid?(CHAPTER_BY_ID[String(cid)]?.title||'Chapter'):`Mixed ${activeSubject}`;
    if(mode==='exam'){
      ids=cid ? chapterQuestions(cid).map(q=>q.id) : examPoolIds();
      if(!ids.length){showToast('Select at least one topic.','bad');return;}
      const count=Math.min(Number(document.getElementById('session-count')?.value||20),ids.length);
      ids=ids.sort(()=>Math.random()-.5).slice(0,count);
      const selected=document.querySelectorAll('input[name="exam-chapter"]:checked');
      const allSelected=selected.length===CHAPTERS.length;
      if(cid) title=`${title} Test`;
      else if(allSelected) title=`${activeSubject} CBT`;
      else title=`Selected Topics CBT`;
    }
    closeModal(); startSession(ids,mode,title);
  }

  function goIndex(i){ const s=state.activeSession;if(!s)return; if(i<0||i>=s.questionIds.length)return; if(s.mode==='practice') savePracticeElapsed(); else if(s.mode==='exam') saveExamElapsed(); s.index=i; s.questionEnteredAt=Date.now(); saveState(); render(); }
  function savePracticeElapsed(){ const s=state.activeSession;if(!s||!s.questionEnteredAt)return;const id=s.questionIds[s.index];s.questionTimes[id]=(s.questionTimes[id]||0)+(Date.now()-s.questionEnteredAt);s.questionEnteredAt=Date.now(); }
  function saveExamElapsed(){ const s=state.activeSession;if(!s||!s.questionEnteredAt)return;const id=s.questionIds[s.index];s.questionTimes[id]=(s.questionTimes[id]||0)+(Date.now()-s.questionEnteredAt);s.questionEnteredAt=Date.now(); }

  function sessionReviewClass(status){return status?'answered':'unanswered';}
  function openSessionReview(){
    const s=state.activeSession;
    if(!s||!['practice','exam'].includes(s.mode))return;

      ? 'Check answered, skipped, and unanswered questions. You can jump back to any question before submitting the test.'
      : moduleSession?'Your progress is saved after every answer. Continue later, or complete the module when you are ready.':'Check the questions you answered and jump back to any unanswered question before finishing the session.';
    const actionLabel=s.mode==='exam'?'Submit Test':moduleSession?(unanswered?'Save & exit':'Complete module'):'Finish Session';
    const statusText=unanswered?
      `${answered} answered · ${unanswered} unanswered`:

    const cells=s.questionIds.map((id,i)=>{
      const answeredQ=Boolean(s.answers[id]);
      return `<button type="button" class="nk-session-review-q ${sessionReviewClass(answeredQ)} ${i===s.index?'active':''}" onclick="window.QB.__sessionReviewGo(${i})" aria-label="Question ${i+1}${answeredQ?' answered':' unanswered'}"><span>${i+1}</span><small>${answeredQ?'Answered':'Unanswered'}</small></button>`;
    }).join('');

      ? `<button type="button" class="ghost-btn" onclick="window.QB.__sessionReviewFirstUnanswered()">Review unanswered</button>`

<script>
(() => {
  'use strict';
  const polish = () => {
    // Rename the post-submit action without touching the underlying review engine.
    document.querySelectorAll('button').forEach(btn => {
      if (btn.textContent.trim() === 'Review Test') btn.textContent = 'Review Solutions';
    });

    const hero = document.querySelector('.result-hero');
    if (hero && !hero.dataset.v101Polished) {
      hero.dataset.v101Polished = '1';
      const kpi = hero.querySelector('.kpi');
      const minis = [...hero.querySelectorAll('.mini-card')];
      const read = label => {
        const card = minis.find(x => (x.querySelector('.label')?.textContent || '').trim().toLowerCase() === label.toLowerCase());
        return card?.querySelector('.value')?.textContent.trim() || '0';
      };
      const correct = read('Correct'), incorrect = read('Incorrect'), unattempted = read('Unattempted');
      const denom = document.createElement('div');
      denom.className = 'v101-result-summary';
      denom.textContent = `Score: ${kpi?.textContent.trim() || '0%'} — ${correct} correct · ${incorrect} incorrect · ${unattempted} unattempted`;
      denom.setAttribute('aria-label', denom.textContent);
      const first = hero.querySelector('.small-muted');
      if (first && first.nextElementSibling === kpi) first.after(denom);
      const accuracy = minis.find(x => (x.querySelector('.label')?.textContent || '').trim().toLowerCase() === 'accuracy');
      if (accuracy) {
        const label = accuracy.querySelector('.label');
        if (label) label.textContent = 'Attempt accuracy';
      }
    }
  };
  const style = document.createElement('style');
  style.textContent = '.v101-result-summary{margin:7px 0 12px;font-size:14px;font-weight:780;line-height:1.5;color:#303241;letter-spacing:-.1px}.result-hero .v101-result-summary+ .kpi{margin-top:0}';
  document.head.appendChild(style);
  polish();
  new MutationObserver(polish).observe(document.getElementById('app') || document.body,{childList:true,subtree:true});
})();
</script>

<script id="v102-next-ui-behavior">
(function(){
  'use strict';
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function subjects(){
    const base=window.QBANK_DATA||{};
    const extra=window.SUBJECT_QBANK_DATA&&Array.isArray(window.SUBJECT_QBANK_DATA.subjects)?window.SUBJECT_QBANK_DATA.subjects:[];
    const biochem={subject:'Biochemistry',topics:Array.isArray(base.chapters)?base.chapters:[],questions:Array.isArray(base.questions)?base.questions:[]};
    const all=[biochem].concat(extra||[]),seen=new Set();
    return all.filter(x=>x&&x.subject&&!seen.has(x.subject)&&seen.add(x.subject));
  }
  function topicsFor(subject){const item=subjects().find(x=>x.subject===subject);return item&&Array.isArray(item.topics)?item.topics:[];}
  function closeTopicModal(){document.getElementById('v102-topic-modal')?.remove();}
  function openTopicModal(subject){
    const topics=topicsFor(subject); closeTopicModal();
    const list=topics.map((t,i)=>{const id=t.id!=null?t.id:i+1,title=t.title||t.name||`Topic ${i+1}`,count=t.questionCount!=null?t.questionCount:(Array.isArray(t.questions)?t.questions.length:0);return `<button type="button" class="v102-topic-item" data-v102-topic="1" data-topic-id="${esc(id)}"><span class="v102-topic-num">${String(i+1).padStart(2,'0')}</span><span class="v102-topic-title">${esc(title)}${count?`<small style="display:block;color:#747b8b;font-size:10px;margin-top:3px">${count} questions</small>`:''}</span><span class="v102-topic-arrow" aria-hidden="true">›</span></button>`;}).join('');
    document.body.insertAdjacentHTML('beforeend',`<div class="v102-topic-modal" id="v102-topic-modal" role="dialog" aria-modal="true" aria-labelledby="v102-topic-title"><div class="v102-topic-dialog"><div class="v102-topic-head"><div><div class="v102-eyebrow">${esc(subject)}</div><h3 id="v102-topic-title">Choose a topic</h3><p>${topics.length} topics available. Select one to open its chapter.</p></div><button type="button" class="v102-topic-close" id="v102-topic-modal-close" aria-label="Close">×</button></div><div class="v102-topic-list">${list||'<div class="empty"><strong>No topics found</strong><span>Open the Topics tab to browse this subject.</span></div>'}</div></div></div>`);
  }
  function selectSubject(raw){let name='';try{name=decodeURIComponent(String(raw||''));}catch(_){name=String(raw||'');}if(!name)return;if(window.QB&&typeof window.QB.setSubject==='function')window.QB.setSubject(name);setTimeout(()=>openTopicModal(name),35);}
  window.QB=window.QB||{}; window.QB.v102SelectSubject=selectSubject; window.QB.v102CloseTopicModal=closeTopicModal;
  document.addEventListener('click',function(event){
    const subject=event.target&&event.target.closest?event.target.closest('[data-v102-subject-card]'):null;
    if(subject){event.preventDefault();event.stopPropagation();selectSubject(subject.getAttribute('data-subject'));return;}
    const topic=event.target&&event.target.closest?event.target.closest('[data-v102-topic]'):null;
    if(topic){event.preventDefault();event.stopPropagation();const id=topic.getAttribute('data-topic-id');closeTopicModal();setTimeout(()=>window.QB&&typeof window.QB.openChapter==='function'&&window.QB.openChapter(id),0);return;}
    if(event.target&&event.target.id==='v102-topic-modal')closeTopicModal();
    if(event.target&&event.target.id==='v102-topic-modal-close')closeTopicModal();
  },true);
  function formatExplanations(){
    document.querySelectorAll('.feedback-body').forEach(el=>{
      if(el.dataset.v102Formatted==='1'||el.children.length)return;
      const raw=(el.textContent||'').replace(/\r/g,'').trim();if(raw.length<120)return;
      const lines=raw.split('\n').map(x=>x.trim()).filter(Boolean),out=[];let para=[],bullets=[];
      const flushPara=()=>{if(para.length){out.push(`<p>${esc(para.join(' '))}</p>`);para=[];}}; const flushBullets=()=>{if(bullets.length){out.push(`<ul>${bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);bullets=[];}};
      const heading=/^(explanation|why|mechanism|key concept|key point|clinical features|diagnosis|investigations|treatment|pathophysiology|algorithm|other options|summary|important|note|features|functions|complications|source explanation|solution for question)\s*:?[ \t]*$/i; const option=/^option\s*([a-d])\s*[:.)-]\s*(.*)$/i;
      lines.forEach(line=>{if(/^•\s*/.test(line)){flushPara();bullets.push(line.replace(/^•\s*/,''));return;}const hm=line.match(heading);if(hm){flushPara();flushBullets();out.push(`<div class="v102-explanation-heading">${esc(hm[1])}</div>`);return;}const om=line.match(option);if(om){flushPara();flushBullets();out.push(`<div class="v102-explanation-option"><strong>Option ${esc(om[1].toUpperCase())}</strong><span>${esc(om[2])}</span></div>`);return;}para.push(line);});
      flushPara();flushBullets(); if(out.length){el.innerHTML=out.join('');el.dataset.v102Formatted='1';}
    });
  }
  const mo=new MutationObserver(()=>formatExplanations()); mo.observe(document.body,{subtree:true,childList:true});
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',formatExplanations);else formatExplanations(); [50,250,800].forEach(ms=>setTimeout(formatExplanations,ms));
})();
</script>




<script id="source-pdf-explanation-js-v14">
(function(){
  const escSource=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const subjectFromId=q=>String(q?.id||'').toLowerCase().startsWith('physiology-')?'physiology':null;
  const subjectFromRef=q=>String(q?.sourceRef||'').toLowerCase().includes('physiology')?'physiology':null;
  function sourceSubject(q){return String(q?.subject||'').toLowerCase()==='physiology'?'physiology':(subjectFromId(q)||subjectFromRef(q)||'biochemistry');}
  function sourcePages(q){const a=Number(q?.sourcePage||0),b=Number(q?.sourcePageEnd||a);if(!a)return[];const out=[];for(let p=a;p<=Math.max(a,b);p++)out.push(p);return out;}
  function sourcePdfUrl(q,p){return `https://qbank.local/${sourceSubject(q)}/pdf?page=${encodeURIComponent(p)}&scale=4`;}
  window.sourceSubjectV13=sourceSubject;window.sourceSubjectV14=sourceSubject;window.sourcePagesV13=sourcePages;window.sourcePdfUrlV13=sourcePdfUrl;
  function openSourceZoom(img){

    b.innerHTML=`<div class="source-pdf-zoombar"><div class="source-pdf-zoomtitle">Original source · PDF page ${escSource(img.dataset.sourcePage||'')}</div><div><button id="spz-minus">−</button><button id="spz-reset">1×</button><button id="spz-plus">+</button><button id="spz-close">×</button></div></div><div class="source-pdf-zoomstage"><img class="source-pdf-zoomimg" src="${img.src}" alt="${escSource(img.alt||'Original source')}"></div>`;
    document.body.appendChild(b);const st=b.querySelector('.source-pdf-zoomstage'),i=b.querySelector('.source-pdf-zoomimg');let scale=1,x=0,y=0,bx=0,by=0,sx=0,sy=0,pointers=new Map(),startDist=0,startScale=1;
    const apply=()=>i.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
    const reset=()=>{if(!i.naturalWidth)return;scale=Math.min(1,Math.min(st.clientWidth/i.naturalWidth,st.clientHeight/i.naturalHeight));x=(st.clientWidth-i.naturalWidth*scale)/2;y=(st.clientHeight-i.naturalHeight*scale)/2;apply();};
    i.addEventListener('load',reset);b.querySelector('#spz-close').onclick=()=>b.remove();b.querySelector('#spz-reset').onclick=reset;b.querySelector('#spz-plus').onclick=()=>{scale=Math.min(6,scale*1.35);apply();};b.querySelector('#spz-minus').onclick=()=>{scale=Math.max(.5,scale/1.35);apply();};
    st.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){sx=e.clientX;sy=e.clientY;bx=x;by=y;}else{const a=[...pointers.values()];startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startScale=scale;}});
    st.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pointers.values()];if(a.length===1){x=bx+e.clientX-sx;y=by+e.clientY-sy;apply();}else if(a.length===2&&startDist){scale=Math.max(.5,Math.min(6,startScale*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/startDist));apply();}});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>st.addEventListener(ev,e=>pointers.delete(e.pointerId)));b.addEventListener('click',e=>{if(e.target===b)b.remove();});
  }
  window.openSourceZoom=openSourceZoom;
})();
</script>

<script id="final-source-zoom-js">
(function(){
  function openSourceZoom(img){
    document.getElementById('source-pdf-zoom')?.remove();
    const b=document.createElement('div');b.id='source-pdf-zoom';b.className='source-pdf-zoom';
    b.innerHTML=`<div class="source-pdf-zoombar"><div class="source-pdf-zoomtitle">Original source · PDF page ${String(img.dataset.sourcePage||'')}</div><div><button id="spz-minus">−</button><button id="spz-reset">Fit</button><button id="spz-plus">+</button><button id="spz-close">×</button></div></div><div class="source-pdf-zoomstage"><img class="source-pdf-zoomimg" src="${img.src}" alt="Original source"></div>`;
    document.body.appendChild(b);
    const st=b.querySelector('.source-pdf-zoomstage'),i=b.querySelector('.source-pdf-zoomimg');
    let scale=1,x=0,y=0,baseScale=1,dragStart=null,pointers=new Map(),pinchDist=0,pinchScale=1,pinchMid=null;
    const clamp=()=>{const maxX=Math.max(0,(i.naturalWidth*scale-st.clientWidth)/2+st.clientWidth*.45),maxY=Math.max(0,(i.naturalHeight*scale-st.clientHeight)/2+st.clientHeight*.45);x=Math.max(-maxX,Math.min(maxX,x));y=Math.max(-maxY,Math.min(maxY,y));};
    const apply=()=>{clamp();i.style.transform=`translate3d(${x}px,${y}px,0) scale(${scale})`;};
    const fit=()=>{if(!i.naturalWidth)return;baseScale=Math.min(st.clientWidth/i.naturalWidth,st.clientHeight/i.naturalHeight);scale=Math.min(1,baseScale);x=(st.clientWidth-i.naturalWidth*scale)/2;y=(st.clientHeight-i.naturalHeight*scale)/2;apply();};
    const zoomAt=(next,cx=st.clientWidth/2,cy=st.clientHeight/2)=>{const old=scale;next=Math.max(baseScale*.75,Math.min(6,next));const ix=(cx-x)/old,iy=(cy-y)/old;scale=next;x=cx-ix*scale;y=cy-iy*scale;apply();};
    i.addEventListener('load',fit);if(i.complete)fit();
    b.querySelector('#spz-close').onclick=()=>b.remove();b.querySelector('#spz-reset').onclick=fit;b.querySelector('#spz-plus').onclick=()=>zoomAt(scale*1.35);b.querySelector('#spz-minus').onclick=()=>zoomAt(scale/1.35);
    st.addEventListener('pointerdown',e=>{e.preventDefault();st.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){dragStart={x:e.clientX,y:e.clientY,ox:x,oy:y};}else if(pointers.size===2){const a=[...pointers.values()];pinchDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchScale=scale;pinchMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}});
    st.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pointers.values()];if(a.length===1&&dragStart){x=dragStart.ox+e.clientX-dragStart.x;y=dragStart.oy+e.clientY-dragStart.y;apply();}else if(a.length===2&&pinchDist){const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoomAt(pinchScale*d/pinchDist,pinchMid.x,pinchMid.y);}});
    const end=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinchDist=0;if(pointers.size===0)dragStart=null;};['pointerup','pointercancel','pointerleave'].forEach(ev=>st.addEventListener(ev,end));
    st.addEventListener('dblclick',e=>{e.preventDefault();zoomAt(scale<baseScale*2?scale*2:baseScale,e.clientX,e.clientY);});
    b.addEventListener('click',e=>{if(e.target===b)b.remove();});
  }
  window.openSourceZoom=openSourceZoom;
})();
</script>

<script id="cbt-final-lock-v2">
(function(){
  function cleanExamUi(owner){
    // Submission cleanup belongs to the old exam. Fast Review/Practice entry
    // or a fresh test must never lose its newly opened navigator to this timer.
    const session=window.QB?.getState?.()?.activeSession;
    if(session&&(session.mode!=='exam'||(owner!=null&&String(session.id)!==owner)))return;
    document.querySelectorAll('.navigator .primary-btn, .qb-nav-submit').forEach(function(b){
      if(/submit\s*test/i.test(String(b.textContent||''))){b.disabled=true;b.remove();}
    });
    document.getElementById('qb-question-navigator')?.remove();
    document.querySelectorAll('#toast-root .toast').forEach(function(e){e.remove();});
  }

  // Preserve the original Review Solutions function exported by the main app.
  // Do not reassign window.QB.reviewTest here. Capturing the live function before
  // other layers run prevents wrapper recursion while keeping the tested engine.
  var liveReview=(window.QB&&typeof window.QB.reviewTest==='function')
    ? window.QB.reviewTest
    : null;

  function openReview(testId){
    try{
      if(typeof liveReview==='function') return liveReview.call(window.QB,testId);
      console.error('CBT Review: live reviewTest API unavailable');
      return false;
    }catch(e){
      console.error('CBT Review entry failed',e);
      return false;
    }
  }

  window.__QB_OPEN_REVIEW=openReview;
  if(window.QB) window.QB.openReviewSolutions=openReview;

  if(window.QB&&typeof window.QB.submitExam==='function'&&!window.QB.submitExam.__cbtFinalLock){
    const original=window.QB.submitExam;
    function submitExamFinalLock(){
      const owner=String(window.QB?.getState?.()?.activeSession?.id||'');
      cleanExamUi(owner);
      try{return original.apply(this,arguments);}
      finally{setTimeout(()=>cleanExamUi(owner),0);setTimeout(()=>cleanExamUi(owner),80);setTimeout(()=>cleanExamUi(owner),250);}
    }
    submitExamFinalLock.__cbtFinalLock=true;
    window.QB.submitExam=submitExamFinalLock;
  }

  const mo=new MutationObserver(function(){
    if(document.querySelector('.navigator'))cleanExamUi();
  });
  mo.observe(document.body,{subtree:true,childList:true});
})();
</script>
<script id="cbt-canonical-review">
(function(){
  'use strict';
  // The live engine was installed by cbt-final-lock-v2 immediately before
  // this canonical step. Preserve that function exactly; do not delegate
  // back through window.QB.reviewTest because that would recurse.
  if(typeof window.__QB_OPEN_REVIEW!=='function'){
    console.error('Canonical CBT Review: live __QB_OPEN_REVIEW API unavailable');
  }
})();
</script>
