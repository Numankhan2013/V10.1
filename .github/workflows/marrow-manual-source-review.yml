name: Marrow manual source-region review

on:
  workflow_dispatch:
    inputs:
      subject:
        description: Subject owned by the manual image worker
        required: true
        type: choice
        options: [Biochemistry, Physiology]
      start_chapter:
        description: First owned chapter, inclusive
        required: true
        type: number
      end_chapter:
        description: Last owned chapter, inclusive
        required: true
        type: number

permissions:
  contents: read

jobs:
  render-source-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source audit and CI renderer dependencies
        run: python -m pip install --disable-pip-version-check pypdf==6.18.0 PyMuPDF Pillow
      - name: Build authoritative source coverage
        run: |
          python tools/marrow_images.py audit
          python tools/marrow_image_coverage.py --subject Anatomy
          python tools/marrow_image_coverage.py --subject Biochemistry
          python tools/marrow_image_coverage.py --subject Physiology
      - name: Prepare exact source references in the selected chapter range
        env:
          SUBJECT: ${{ inputs.subject }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          END_CHAPTER: ${{ inputs.end_chapter }}
        run: |
          python tools/prepare_marrow_manual_region_batch.py \
            --subject "$SUBJECT" --start-chapter "$START_CHAPTER" \
            --end-chapter "$END_CHAPTER" --batch-id "manual-${SUBJECT,,}-ch${START_CHAPTER}-${END_CHAPTER}" \
            --output build/marrow-manual-source-review/checkpoint.json
      - name: Render authoritative source regions on Ubuntu
        run: |
          python tools/render_marrow_manual_batch_regions.py \
            --checkpoint build/marrow-manual-source-review/checkpoint.json \
            --output build/marrow-manual-source-review/regions
      - name: Upload source-fingerprinted review images
        uses: actions/upload-artifact@v4
        with:
          name: marrow-manual-source-review-${{ inputs.subject }}-ch${{ inputs.start_chapter }}-${{ inputs.end_chapter }}
          path: build/marrow-manual-source-review/
          if-no-files-found: error
          retention-days: 14
