name: Integrate Biochemistry Ch27-28

on:
  push:
    branches:
      - feature/marrow-biochem-ch27-28-integration
    paths:
      - '.github/workflows/integrate-biochem-ch27-28.yml'
      - 'tools/integrate_biochem_user_ch027_028.py'
      - 'data/marrow/automation_ingest/biochemistry/**'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and integrate source-faithfully
        run: python tools/integrate_biochem_user_ch027_028.py
      - name: Regenerate explanation inventory bookkeeping only
        run: python tools/inventory_marrow_explanations.py --write
      - name: Validate expanded banks
        run: |
          python tools/test_marrow_bank_pilot.py --data-only
          python tools/test_marrow_topic_taxonomy.py
          python tools/test_marrow_explanation_inventory.py
      - name: Commit deterministic integration outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/marrow tools .project-memory
          git status --short
          git diff --cached --quiet && { echo 'No integration changes'; exit 1; }
          git commit -m 'Integrate Biochemistry Marrow Ch27-28'
          git push
