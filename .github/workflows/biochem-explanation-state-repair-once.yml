name: Biochemistry Explanation State Repair Once
on:
  push:
    branches:
      - automation/biochem-explanation-state-repair-20260921
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/biochem-explanation-state-repair-20260921
          fetch-depth: 0
      - name: Verify exact canonical base and repair derived memory drift
        run: |
          git fetch origin feature/marrow-canonical-full-current
          test "$(git merge-base HEAD origin/feature/marrow-canonical-full-current)" = "0c57fd4deb0a0ffb6ea57865bef56ac00b52c1e0"
          python3 - <<'PY'
          from pathlib import Path
          state_path=Path('.project-memory/STATE.md')
          state=state_path.read_text()
          old='- Inventory remains **605 enhanced / 2,106 pending / 2,711 total**, fingerprint `995717a6ac450e2b6a530e0521d58a43e67d4e980401989c69b544c38de98300`; raw source hashes unchanged.'
          new='- Inventory is **615 enhanced / 2,096 pending / 2,711 total**, fingerprint `2ad7006f78607d0974269e4aad0baaed9cba6124560885adb3e30f3e6651ce14`; raw source hashes unchanged. This is the deterministic canonical full-corpus inventory after the verified Biochemistry Ch12 Q1–Q10 transplant.'
          assert old in state, 'expected stale explanation inventory line not found'
          state=state.replace(old,new,1)
          hist='- FULLY_VERIFIED history: Anatomy Ch6 Q1–Q7 at certified checkpoint `58bb99d5c1fc96a98b4f922a963dba16105487d1`; Anatomy Ch6 Q8–Q18 reconciled at `420928ae4e1314cb3a23c8687801be5c7b1f0a8c` and released after canonical dual-green Engineering `34834434837` + full run `34834434831`; Physiology Ch11 Q1–Q6 at `e01cc0b9a8e62885d29b0c2e7ac6417ce8c96f05`.'
          hist_new=hist+' Biochemistry Ch12 Q1–Q10 was transplanted by stable ID, dual-green on candidate `b541a61b5b037b9f9ae27e71bed5affafc60e3f4`, reconciled through canonical merge `76c3be68b9c24bec90af0d4868f896f687bb670b`, and followed by deterministic inventory refresh to canonical `0c57fd4deb0a0ffb6ea57865bef56ac00b52c1e0`; Q7 remains `needs_manual_review` as carried by the verified donor.'
          assert hist in state, 'expected FULLY_VERIFIED history line not found'
          state=state.replace(hist,hist_new,1)
          state_path.write_text(state)
          log=Path('.project-memory/SESSION_LOG.md')
          entry='''\n\n## 2026-09-21 — Biochemistry explanation canonical-memory drift repair\n- Re-read `docs/MARROW_EXPLANATION_AUTOMATION_RUNBOOK.md`, `docs/MARROW_CANONICAL_AUTOMATION_POLICY.md`, mandatory project memory and implementation guidance from live canonical `0c57fd4deb0a0ffb6ea57865bef56ac00b52c1e0`.\n- Reconciled derived `STATE.md` explanation memory with the deterministic canonical full-corpus inventory: **615 enhanced / 2,096 pending / 2,711 total**, fingerprint `2ad7006f78607d0974269e4aad0baaed9cba6124560885adb3e30f3e6651ce14`.\n- Recorded Biochemistry Ch12 Q1–Q10 as FULLY_VERIFIED_HISTORY; no new explanation content was authored in this repair.\n- Exact next Biochemistry source-order candidate after reacquiring a free explanation lane: Ch12 Q11–Q14. Raw source remains immutable; production promotion remains prohibited.\n'''
          log.write_text(log.read_text()+entry)
          PY
          rm .github/workflows/biochem-explanation-state-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .project-memory/STATE.md .project-memory/SESSION_LOG.md .github/workflows/biochem-explanation-state-repair-once.yml
          git commit -m "Repair Biochemistry explanation canonical memory drift"
          git push origin HEAD:automation/biochem-explanation-state-repair-20260921
