name: One-shot Biochemistry Q13 handoff cleanup

on:
  push:
    branches:
      - automation/marrow-images-biochemistry-NKQ_BIOCHEM_COVERAGE_Q13_20260911

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[q13-handoff-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/marrow-images-biochemistry-NKQ_BIOCHEM_COVERAGE_Q13_20260911
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install pypdf==6.18.0
      - name: Recompute coverage and update canonical memory
        run: |
          python3 tools/marrow_images.py audit >/tmp/audit.out
          python3 tools/marrow_image_coverage.py --subject Biochemistry >/tmp/coverage.out
          python3 - <<'PY'
          import json
          from pathlib import Path
          cov=json.loads(Path('data/marrow/images/coverage.json').read_text())
          unresolved=[r for r in cov['sourceVisuals'] if r['subject']=='Biochemistry' and r.get('coverageStatus') not in {'RELEASED','SOURCE_METADATA_INVALID'}]
          assert unresolved, 'Biochemistry unexpectedly complete'
          nxt=unresolved[0]
          next_text=f"{nxt['id']} ({nxt.get('role') or 'role-review-required'}, source pages {nxt.get('sourcePages')}, status {nxt.get('coverageStatus')})"
          state=Path('.project-memory/STATE.md')
          text=state.read_text()
          start=text.index('## Latest image recovery batch — VERIFIED_HISTORY')
          end=text.index('## Coverage and trust rules', start)
          replacement=f'''## Latest image recovery batch — VERIFIED_HISTORY\n\nClassification: **VERIFIED_HISTORY / COMPLETE bounded coverage-recovery batch**. It no longer owns the shared writer lane.\n\n- Subject: Biochemistry.\n- Batch: `NKQ_BIOCHEM_COVERAGE_Q13_20260911`.\n- Historical branch: `automation/marrow-images-biochemistry-NKQ_BIOCHEM_COVERAGE_Q13_20260911`.\n- Exact integration base: `c9b5930b7ffdbc9af7a1edcc5acc829ad96e79c3`.\n- Released reference: `marrow__BIOCHEM_CH02_Q013:figure:1`, explanation role, Marrow ED8 Biochemistry page 35 / xref 1126 / region `[162,453,450,669]`.\n- The authoritative page places this glycolysis pathway immediately after the Q13 solution and before Solution to Question 14.\n- Reused the already source-compared PASS glycolysis reconstruction `biochemistry-aa11f9fa6a08baea` / production SHA-256 `e6b4d76fa9ff07dbf62b5094b8fdcd46a744837bb802aa55945ac7021f6fa8e2`; no new medical or diagram content was invented.\n- Source/reference validation, release regeneration, progress check, coverage check, image tests, coverage tests, pipeline verification, project-memory verification and `git diff --check` passed in bounded recovery run `34623825459`.\n- Post-batch Biochemistry coverage: **95 raw / 94 effective / 66 released / 1 invalid metadata / 67 resolved / 4 tracked-unreleased / 24 untracked / 31 text-cue items**. Subject remains **INCOMPLETE**.\n- No `main` merge or production promotion occurred.\n\nExact next deterministic unresolved source reference: `{next_text}`.\n\n'''
          text=text[:start]+replacement+text[end:]
          text=text.replace('- released source visual references: **65**;','- released source visual references: **66**;')
          text=text.replace('- resolved source visual references: **66**;','- resolved source visual references: **67**;')
          text=text.replace('- untracked: **25**;','- untracked: **24**;')
          text=text.replace('The next deterministic unresolved source reference is `marrow__BIOCHEM_CH02_Q013:figure:1`, explanation role, source page 35 (`Glycolysis pathway diagrams`). The authoritative page does contain the pathway figure and the current registry has no binding for Q13.',f'The next deterministic unresolved source reference is `{next_text}`.')
          text=text.replace('Biochemistry still has 29 legitimate source references not learner-facing (4 tracked-unreleased + 25 untracked), plus 31 text-cue items requiring adjudication.','Biochemistry still has 28 legitimate source references not learner-facing (4 tracked-unreleased + 24 untracked), plus 31 text-cue items requiring adjudication.')
          text=text.replace('Start the next bounded Biochemistry recovery batch at `marrow__BIOCHEM_CH02_Q013:figure:1` (explanation, page 35) and continue only within the runbook workload budget.',f'Start the next bounded Biochemistry recovery batch at `{next_text}` and continue only within the runbook workload budget.')
          state.write_text(text)
          log=Path('.project-memory/SESSION_LOG.md')
          with log.open('a') as f:
              f.write(f'''\n\n## 2026-09-11 — Biochemistry coverage recovery: Ch2 Q13\n\n- Completed bounded batch `NKQ_BIOCHEM_COVERAGE_Q13_20260911` from image-lineage base `c9b5930b7ffdbc9af7a1edcc5acc829ad96e79c3`.\n- Authoritative Marrow ED8 Biochemistry page 35 inspection identified xref 1126 / region `[162,453,450,669]` as the Q13 explanation glycolysis pathway, positioned after the Q13 solution and before Q14.\n- Added an independently reviewed PASS binding for `marrow__BIOCHEM_CH02_Q013:figure:1` to the already source-compared PASS glycolysis asset `biochemistry-aa11f9fa6a08baea`; reused production SVG SHA-256 `e6b4d76fa9ff07dbf62b5094b8fdcd46a744837bb802aa55945ac7021f6fa8e2`.\n- Bounded recovery run `34623825459` passed registry validation, release regeneration, progress check, source-reference coverage check, image/coverage tests, pipeline verification, project-memory verification and diff check.\n- Coverage advanced from 65 to 66 released source references and from 25 to 24 untracked: 95 raw / 94 effective / 66 released / 1 invalid-source-metadata / 67 resolved / 4 tracked-unreleased / 24 untracked / 31 text-cue review items. Biochemistry remains INCOMPLETE.\n- Temporary generated `coverage.json` and Python bytecode are transport artifacts and are not retained in Git. `.gitignore` now excludes Python bytecode/cache.\n- Next deterministic unresolved source reference: `{next_text}`.\n- No main merge or production promotion.\n''')
          print('NEXT_REFERENCE', next_text)
          PY
      - name: Remove generated transport artifacts and harden ignore
        run: |
          rm -rf tools/__pycache__ data/marrow/images/coverage.json
          printf '\n# Python runtime artifacts\n__pycache__/\n*.pyc\n' >> .gitignore
          rm .github/workflows/one-shot-biochem-q13-handoff-cleanup.yml
          python3 tools/verify_project_memory.py
          git diff --check
      - name: Commit clean handoff
        run: |
          git config user.name 'Numankhan2013'
          git config user.email '124483154+Numankhan2013@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Biochemistry Q13 coverage handoff [q13-handoff-done]'
          git push origin HEAD:automation/marrow-images-biochemistry-NKQ_BIOCHEM_COVERAGE_Q13_20260911
