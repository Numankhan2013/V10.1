name: Physiology Safe Donor Image Integration

on:
  push:
    branches:
      - 'manual/physiology-images-ch03-07-20260928'
    paths:
      - '.github/workflows/physiology-safe-donor-image-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: physiology-safe-donor-image-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  revalidate-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python3 -m pip install --disable-pip-version-check pypdf==6.18.0 PyMuPDF Pillow

      - name: Build live source audit
        run: python3 tools/marrow_images.py audit

      - name: Retrieve historical donor review only
        run: |
          mkdir -p build/historical-physiology
          git fetch --no-tags origin 'manual/marrow-physiology-fastlane-20260912-b02'
          git show FETCH_HEAD:data/marrow/images/review_requests/MANUAL_FASTLANE_34700776495.json > build/historical-physiology/MANUAL_FASTLANE_34700776495.json

      - name: Revalidate and apply deterministic donor decisions
        run: >-
          python3 tools/apply_phys_ch03_07_historical_safe_batch.py
          --historical build/historical-physiology/MANUAL_FASTLANE_34700776495.json

      - name: Rebuild and validate image state
        run: |
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_image_coverage.py --subject Physiology
          python3 tools/marrow_images.py release
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
          python3 tools/marrow_image_coverage.py --subject Physiology --check
          git diff --check

      - name: Commit deterministic revalidation output
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/marrow/images/registry.json \
            data/marrow/images/source_reference_adjudications.json \
            data/marrow/images/review_requests/MANUAL_PHYS_CH03_07_SAFE_REVALIDATED_20260928.json \
            data/marrow/images/originals \
            data/marrow/images/progress.json \
            data/marrow/images/coverage.json \
            app/src/main/assets/marrow_visuals \
            app/src/main/assets/marrow_visual_metadata.js
          if git diff --cached --quiet; then
            echo 'No deterministic donor changes to commit.'
            exit 0
          fi
          git commit -m 'images: integrate safe physiology donor decisions'
          git push origin "HEAD:${BRANCH_NAME}"
