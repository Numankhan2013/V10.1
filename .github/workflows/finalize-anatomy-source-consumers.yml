name: Finalize Anatomy expanded source consumers

on:
  push:
    branches:
      - feature/marrow-automation-ingest-anatomy

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Update current operational documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path); text=p.read_text(encoding='utf-8'); n=text.count(old)
              if required and n < 1:
                  raise SystemExit(f'{path}: missing anchor {old!r}')
              if n:
                  p.write_text(text.replace(old,new),encoding='utf-8')
              print('REPLACE',path,n,old[:70])

          # Authoritative automation runbook: current source scope only.
          p='docs/MARROW_EXPLANATION_AUTOMATION_RUNBOOK.md'
          replace(p,'data/marrow/anatomy_phase_a.zlib.b64.part*','data/marrow/anatomy_ch001_048_plus_060_063.zlib.b64.part*')
          replace(p,'- Anatomy: 819 questions / 48 topics\n- Biochemistry: 543 / 26\n- Physiology: 753 / 33\n- Total: 2,376 questions',
                    '- Anatomy: 898 questions / 52 imported topics (source Ch1-48 + Ch60-63; Ch49-59 unavailable)\n- Biochemistry: 543 / 26\n- Physiology: 1,014 / 43\n- Total: 2,455 questions')
          replace(p,'2,192','2,271',required=False)
          replace(p,'2192','2271',required=False)
          replace(p,'2,376','2,455',required=False)
          replace(p,'2376','2455',required=False)

          # Architecture's live Marrow extension block.
          p='.project-memory/ARCHITECTURE.md'
          replace(p,'  - Anatomy: 819 questions / 48 topics.','  - Anatomy: 898 questions / 52 imported topics (Ch1-48 + Ch60-63; Ch49-59 source gap).')
          replace(p,'  - Physiology: 753 / 33.','  - Physiology: 1,014 / 43.')
          replace(p,'  - Combined: 2,376 unique questions / 107 topics.','  - Combined: 2,455 unique questions / 121 imported source topics.')
          replace(p,'`data/marrow/anatomy_phase_a.zlib.b64.part*` +\n  `anatomy_phase_a_manifest.json`;','`data/marrow/anatomy_ch001_048_plus_060_063.zlib.b64.part*` +\n  `anatomy_ch001_048_plus_060_063_manifest.json`;')
          replace(p,'`physiology_ch001_033.zlib.b64.part*` +\n  `physiology_ch001_033_manifest.json`.','`physiology_ch001_043.zlib.b64.part*` +\n  `physiology_ch001_043_manifest.json`.')
          replace(p,'metadata for all 2,376 IDs','metadata for all 2,455 IDs')
          replace(p,'142-question subset until a later explanation phase','184-question approved subset; newly ingested source questions remain pending until later explanation work')

          # Product's current candidate summary.
          p='.project-memory/PRODUCT.md'
          replace(p,'feature candidate additionally contains Anatomy 819/48, Biochemistry 543/26,\nand Physiology 753/33 (2,376 Marrow questions total).',
                    'feature candidate additionally contains Anatomy 898/52, Biochemistry 543/26,\nand Physiology 1,014/43 (2,455 Marrow questions total).')
          replace(p,'  - Anatomy → PrepLadder | Marrow (819 questions / 48 Marrow topics).','  - Anatomy → PrepLadder | Marrow (898 questions / 52 imported Marrow topics).')
          replace(p,'  - Physiology → PrepLadder | Marrow (753 / 33).','  - Physiology → PrepLadder | Marrow (1,014 / 43).')
          replace(p,'The previously approved enhanced explanation layer remains an auditable\n  augmentation subset (62 Anatomy + 80 Physiology) and must not be generalized\n  by silently rewriting stored source text.',
                    'The approved enhanced explanation layer remains an auditable 184-question\n  augmentation subset. Newly source-ingested questions stay pending and must not\n  be silently rewritten during integration.')

          # Roadmap: preserve historical completed milestones; update only current active inventory.
          p='.project-memory/ROADMAP.md'
          replace(p,'The 2,376-ID inventory is complete','The 2,455-ID inventory is complete')
          replace(p,'total to **184** with **2,192** remaining. Continue at Biochemistry Chapter 2.',
                    'total to **184** with **2,271** remaining after source expansion. Continue explanation work separately from source integration.')
          marker='- [ ] Continue later Marrow chapters beyond the supplied current scope only when\n      verified source JSONL is available.\n'
          addition=('- [x] Integrate verified Physiology Ch34–43 automation handoff: **+261 Q / +10 topics**, now **1,014 / 43**.\n'
                    '- [x] Integrate verified Anatomy Ch60–63 automation handoff: **+79 Q / +4 topics**, now **898 / 52**; Ch49–59 remain an explicit source gap.\n')
          replace(p,marker,addition+marker)

          # Fine-tuning/image docs: current totals only, leaving historical run IDs untouched.
          for p in ('docs/MARROW_EXPLANATION_FINE_TUNING.md','docs/MARROW_IMAGE_PIPELINE.md'):
              path=Path(p); text=path.read_text(encoding='utf-8')
              text=text.replace('2,376','2,455').replace('2376','2455')
              text=text.replace('2,192','2,271').replace('2192','2271')
              text=text.replace('Anatomy: 819','Anatomy: 898').replace('Physiology: 753','Physiology: 1,014')
              text=text.replace('anatomy_phase_a','anatomy_ch001_048_plus_060_063').replace('physiology_ch001_033','physiology_ch001_043')
              path.write_text(text,encoding='utf-8')
          PY
      - name: Validate current source consumers
        run: |
          python3 tools/test_marrow_bank_pilot.py --data-only
          python3 tools/test_marrow_topic_taxonomy.py
          python3 tools/test_marrow_explanation_inventory.py
          python3 tools/test_marrow_images.py
          python3 tools/test_marrow_biochem_explanation_rollout.py
          python3 tools/verify_project_memory.py
      - name: Report remaining stale operational references
        shell: bash
        run: |
          grep -nE 'anatomy_phase_a|physiology_ch001_033|Anatomy: 819|Physiology: 753|2,192|2192|2,376|2376' \
            docs/MARROW_EXPLANATION_AUTOMATION_RUNBOOK.md docs/MARROW_EXPLANATION_FINE_TUNING.md docs/MARROW_IMAGE_PIPELINE.md \
            .project-memory/ARCHITECTURE.md .project-memory/PRODUCT.md .project-memory/ROADMAP.md \
            tools/*.py || true
      - name: Commit current-scope cleanup
        shell: bash
        run: |
          rm -f .github/workflows/finalize-anatomy-source-consumers.yml
          git config user.name 'Numankhan2013'
          git config user.email '124483154+Numankhan2013@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Align Marrow consumers with Anatomy Ch60-63'
          git push origin HEAD:feature/marrow-automation-ingest-anatomy
