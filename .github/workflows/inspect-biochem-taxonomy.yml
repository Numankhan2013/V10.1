name: Inspect Biochemistry Taxonomy

on:
  push:
    branches:
      - feature/marrow-biochemistry-topic-index-v2
    paths:
      - '.github/workflows/inspect-biochem-taxonomy.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Print current Biochemistry taxonomy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/marrow/topic_index_taxonomy.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('BIOCHEM_TAXONOMY_BEGIN')
          print(json.dumps(d['subjects']['Biochemistry'], indent=2, ensure_ascii=False))
          print('BIOCHEM_TAXONOMY_END')
          PY
