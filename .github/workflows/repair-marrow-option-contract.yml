name: Repair Marrow option contract

on:
  push:
    branches:
      - feature/marrow-automation-ingest-anatomy
    paths:
      - tools/repair_marrow_option_contract.py
      - tools/repair_marrow_option_contract_v2.py
      - tools/repair_marrow_option_contract_v3.py
      - .github/workflows/repair-marrow-option-contract.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair option labels and regression guards
        run: python3 tools/repair_marrow_option_contract_v3.py
      - name: Refresh deterministic explanation inventory hashes
        run: python3 tools/inventory_marrow_explanations.py --write
      - name: Verify repaired source data
        run: |
          python3 tools/test_marrow_bank_pilot.py --data-only
          python3 tools/test_marrow_topic_taxonomy.py
          python3 tools/test_marrow_explanation_inventory.py
          git diff --check
      - name: Commit repaired contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/marrow/anatomy_ch001_048_plus_060_063.zlib.b64.part* \
            data/marrow/anatomy_ch001_048_plus_060_063_manifest.json \
            data/marrow/physiology_ch001_043.zlib.b64.part* \
            data/marrow/physiology_ch001_043_manifest.json \
            data/marrow/explanation_inventory_v1.json \
            tools/integrate_anatomy_automation_ch060_063.py \
            tools/integrate_physio_automation_ch034_043.py \
            tools/apply_marrow_bank_pilot.py \
            tools/test_marrow_bank_pilot.py \
            tools/apply_session_experience_v2.py \
            tools/verify_marrow_bank_browser_core.py \
            tools/verify_marrow_bank_browser.py \
            .project-memory/STATE.md
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Fix Marrow correct-answer highlight regression"
          git push origin HEAD:feature/marrow-automation-ingest-anatomy
