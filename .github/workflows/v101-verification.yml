name: V10.1 verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V10.1
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Apply Review Solutions UX polish and verify haptics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          haptic = "function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }"
          before_haptic = s.count(haptic)
          before_vibrate = s.count('navigator.vibrate')
          if before_haptic != 1:
              raise SystemExit(f'FAIL: expected exactly 1 canonical haptic function, found {before_haptic}')

          start = s.find('function reviewTestPage(){')
          if start < 0:
              raise SystemExit('FAIL: reviewTestPage() not found')
          brace = s.find('{', start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('FAIL: could not locate end of reviewTestPage()')

          new_fn = '''function reviewTestPage(){
            const s=state.activeSession; if(!s || s.mode!=='review') return testsPage();
            const q=BY_ID[s.questionIds[s.index]], selected=s.answers[q.id]||null;
            const corr=Number(selected)===Number(q.correctOption);
            const answerLetter=selected?String.fromCharCode(64+Number(selected)):null;
            const correctLetter=String.fromCharCode(64+Number(q.correctOption));
            const status=selected?(corr?'Correct':'Incorrect'):'Unattempted';
            const progress=Math.round(((s.index+1)/s.questionIds.length)*100);
            return shell(`
              <div class="page-head"><div><div class="mode-pill">Test Review</div><h1 class="page-title" style="margin-top:9px">${esc(s.title)}</h1><div class="page-sub">Question ${s.index+1} of ${s.questionIds.length}</div></div><button class="ghost-btn" onclick="window.QB.nav('tests')">Back to Tests</button></div>
              <div class="card v101-review-progress"><div><div class="small-muted">Review progress</div><strong>${s.index+1} / ${s.questionIds.length}</strong></div><div class="v101-progress-track"><span style="width:${progress}%"></span></div><div class="small-muted">${progress}%</div></div>
              <section class="card question-card"><div class="crumb">${esc(q.chapter)}</div><div class="v101-review-meta"><span>Question ${q.questionNumber}</span><span class="v101-status ${corr?'good':(selected?'bad':'neutral')}">${status}</span></div><div class="question-text">${esc(q.question)}</div><div class="option-list">${q.options.map(o=>{const n=o.letter.charCodeAt(0)-64,isSel=Number(selected)===n,isCor=Number(q.correctOption)===n;let cls='option';if(isSel)cls+=' selected';if(isCor)cls+=' correct';if(isSel&&!isCor)cls+=' wrong';const tag=isSel&&isCor?'Your answer · Correct':(isSel?'Your answer · Incorrect':(isCor?'Correct answer':''));return `<div class="${cls}"><span class="radio"></span><span class="option-letter">${o.letter}</span><span class="option-text">${esc(o.text)}</span>${tag?`<span class="v101-answer-tag">${tag}</span>`:''}</div>`}).join('')}</div><div class="feedback ${corr?'good':'bad'}"><div class="feedback-title">${status}</div><div class="v101-answer-summary"><div><div class="label">Your answer</div><strong>${answerLetter||'Not attempted'}</strong></div><div><div class="label">Correct answer</div><strong>${correctLetter}</strong></div></div>${q.explanation?`<div class="label">Source explanation</div><div class="feedback-body">${formatExplanation(q.explanation)}</div>`:''}</div><div class="q-footer"><button class="ghost-btn" onclick="window.QB.prevQ()">Previous</button>${s.index<s.questionIds.length-1?`<button class="primary-btn" onclick="window.QB.nextQ()">Next ${navIcon('chevron',15)}</button>`:`<button class="primary-btn" onclick="window.QB.nav('tests')">Finish Review</button>`}</div><div class="source-box"><details><summary>Source page ${q.sourcePage}</summary><a class="source-link" href="assets/Biochemistry_QBank_Source.pdf#page=${q.sourcePage}" target="_blank">Open original PDF</a></details></div></section>
            `,'tests','Review');
          }'''
          s = s[:start] + new_fn + s[end:]

          s = s.replace('>Review Test</button>', '>Review Solutions</button>')

          css = '''\n<style id="v101-review-ux">\n.v101-review-progress{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:13px 15px}.v101-progress-track{height:7px;flex:1;background:var(--line);border-radius:99px;overflow:hidden}.v101-progress-track span{display:block;height:100%;background:var(--primary-2);border-radius:99px}.v101-review-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 14px}.v101-status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px}.v101-status.good{background:rgba(21,154,116,.10);color:var(--success)}.v101-status.bad{background:rgba(223,78,82,.10);color:var(--danger)}.v101-status.neutral{background:rgba(111,113,128,.10);color:var(--muted)}.v101-answer-tag{margin-left:auto;font-size:11px;font-weight:800;line-height:1.2;padding:5px 7px;border-radius:8px;background:rgba(47,45,99,.07)}.v101-answer-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 16px}.v101-answer-summary>div{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.v101-answer-summary strong{font-size:18px}@media(max-width:640px){.v101-review-progress{gap:9px}.v101-answer-tag{font-size:10px}.v101-answer-summary{gap:8px}}\n</style>\n'''
          s = s.replace('</body>', css + '</body>', 1)

          after_haptic = s.count(haptic)
          after_vibrate = s.count('navigator.vibrate')
          if after_haptic != before_haptic or after_vibrate != before_vibrate:
              raise SystemExit('FAIL: haptic/vibration code changed')
          if 'Review Solutions' not in s or 'v101-review-ux' not in s or 'Your answer' not in s or 'Correct answer' not in s:
              raise SystemExit('FAIL: Review Solutions UX markers missing')

          p.write_text(s, encoding='utf-8')
          print('PASS: Review Solutions UX applied; haptic code unchanged')
          PY

      - name: Inspect Review Solutions flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'Review Solutions': 'Review Solutions' in s,
            'reviewTest': bool(re.search(r'function\s+reviewTest\s*\(',s)),
            'review mode': "mode:'review'" in s or 'mode: "review"' in s,
            'Your answer': 'Your answer' in s,
            'Correct answer': 'Correct answer' in s,
            'Source explanation': 'Source explanation' in s,
            'Previous': 'window.QB.prevQ()' in s,
            'Next': 'window.QB.nextQ()' in s,
          }
          for k,v in checks.items():
            print(f'{k}: {"PASS" if v else "FAIL"}')
          if not all(checks.values()): raise SystemExit(1)
          Path('v101_review_verification.txt').write_text('\n'.join(f'{k}: {v}' for k,v in checks.items()),encoding='utf-8')
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: V10.1-review-verification
          path: v101_review_verification.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: V10.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit Review Solutions UX polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Polish V10.1 Review Solutions UX'
            git push origin main
          fi
