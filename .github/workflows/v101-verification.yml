name: V10.1 verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V10.1
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Inspect Review Solutions flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          s = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          out = []
          out.append('V10.1 REVIEW SOLUTIONS VERIFICATION')
          out.append('==================================')
          out.append(f'index.html chars={len(s)} lines={len(s.splitlines())}')
          out.append('')

          patterns = [
              r'function\\s+reviewTest\\s*\\([^)]*\\)\\s*\\{',
              r'Review Test', r'Review Solutions', r'reviewMode', r'questionTimes',
              r'correctAnswer', r'explanation', r'previous', r'next',
              r'unattempted', r'answers', r'testsPage', r'resultPage'
          ]
          for pat in patterns:
              hits = list(re.finditer(pat, s, re.I))
              out.append(f'{pat}: {len(hits)} hits')
              for m in hits[:3]:
                  a=max(0,m.start()-1200); b=min(len(s),m.end()+3500)
                  out.append(f'--- window around offset {m.start()} ---')
                  out.append(s[a:b])
                  out.append('--- end window ---')
          Path('v101_review_verification.txt').write_text('\n'.join(out), encoding='utf-8')
          print('\n'.join(out[:30]))
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: V10.1-review-verification
          path: v101_review_verification.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: V10.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
