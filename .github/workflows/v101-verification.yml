name: V10.1 verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V10.1
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Apply safe Review Solutions UX polish and verify haptics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          haptic = "function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }"
          before_haptic = s.count(haptic)
          before_vibrate = s.count('navigator.vibrate')
          if before_haptic != 1:
              raise SystemExit(f'FAIL: expected exactly 1 canonical haptic function, found {before_haptic}')

          # Do not replace the question/review engine. Add only presentation-layer polish.
          if 'Review Solutions' not in s:
              s = s.replace('>Review Test</button>', '>Review Solutions</button>')

          css = '''\n<style id="v101-review-ux">\n.v101-review-ux-note{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:0 0 14px;border:1px solid var(--line);border-radius:14px;background:#fafbff;font-size:12px;color:var(--muted)}\n.v101-review-ux-note strong{color:var(--ink);font-size:13px}\n.review-test .option.correct,.review-test .option.wrong{transition:none}\n@media(max-width:640px){.v101-review-ux-note{padding:11px 12px}.review-test .option{min-height:52px}}\n</style>\n'''
          if 'id="v101-review-ux"' not in s:
              s = s.replace('</body>', css + '</body>', 1)

          after_haptic = s.count(haptic)
          after_vibrate = s.count('navigator.vibrate')
          if after_haptic != before_haptic or after_vibrate != before_vibrate:
              raise SystemExit('FAIL: haptic/vibration code changed')
          if 'Review Solutions' not in s or 'v101-review-ux' not in s:
              raise SystemExit('FAIL: Review Solutions UX markers missing')

          p.write_text(s, encoding='utf-8')
          print('PASS: presentation-only Review Solutions polish applied; haptic code unchanged')
          PY

      - name: Inspect Review Solutions flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks = {
            'Review Solutions': 'Review Solutions' in s,
            'review function': bool(re.search(r'function\s+reviewTest\s*\(', s)),
            'review mode': bool(re.search(r"mode\s*:\s*['\"]review['\"]", s)),
            'Your answer': 'Your answer' in s,
            'Correct answer': 'Correct answer' in s,
            'Source explanation': 'Source explanation' in s,
            'Previous': 'window.QB.prevQ()' in s,
            'Next': 'window.QB.nextQ()' in s,
            'haptic function': s.count("function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }") == 1,
          }
          for k, v in checks.items():
              print(f'{k}: {"PASS" if v else "FAIL"}')
          if not all(checks.values()):
              raise SystemExit(1)
          Path('v101_review_verification.txt').write_text('\n'.join(f'{k}: {v}' for k,v in checks.items()), encoding='utf-8')
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: V10.1-review-verification
          path: v101_review_verification.txt
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: V10.1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit Review Solutions UX polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Polish V10.1 Review Solutions UX'
            git push origin main
          fi
