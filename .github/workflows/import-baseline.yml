name: Import QBank baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V10.1 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone QBank baseline
        run: git clone --depth 1 https://github.com/Numankhan2013/QBank.git /tmp/qbank

      - name: Replace V10.1 contents with baseline (preserve workflow files)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          rm -rf /tmp/v101-github
          cp -a .github /tmp/v101-github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          cp -a /tmp/qbank/. .
          rm -rf .github
          cp -a /tmp/v101-github .github
          rm -rf .git
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import QBank baseline for V10.1"
          git branch -M main
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main
