name: Physiology Ambiguous Review Plan

on:
  push:
    branches:
      - 'manual/physiology-images-ch03-07-20260928'
    paths:
      - '.github/workflows/physiology-ambiguous-review-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-focused-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python3 -m pip install --disable-pip-version-check pypdf==6.18.0
      - name: Build live source audit and focused plan
        run: |
          python3 tools/marrow_images.py audit
          python3 tools/build_phys_ambiguous_review_plan.py
      - name: Commit focused review packet
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/marrow/images/review_requests/MANUAL_PHYS_AMBIGUOUS_14_PLAN_20260928.json
          git commit -m 'images: add focused physiology ambiguous review plan'
          git push origin "HEAD:${BRANCH_NAME}"
