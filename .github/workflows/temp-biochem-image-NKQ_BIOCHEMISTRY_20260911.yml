name: TEMP Biochemistry image batch NKQ_BIOCHEMISTRY_20260911

on:
  push:
    branches:
      - automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911

permissions:
  contents: write

jobs:
  stage-review-checkpoint:
    if: ${{ github.event.head_commit.message == 'Start Biochemistry image batch NKQ_BIOCHEMISTRY_20260911' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image audit dependencies
        run: python3 -m pip install pypdf==6.18.0 pymupdf pillow

      - name: Guard exact verified base and source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1ae61e205804d3d3b2359fcbad218f56e396896b"
          test "$(stat -c %s data/marrow/source_pdfs/biochemistryed8.pdf)" = "7958177"
          echo '463cb586aa18b702243d2467b4ad1f7fb24537d7ae73388607421516660643eb  data/marrow/source_pdfs/biochemistryed8.pdf' | sha256sum -c -

      - name: Read mandatory image-integration instructions
        shell: bash
        run: |
          set -euo pipefail
          cat docs/MARROW_IMAGE_AUTOMATION_RUNBOOK.md >/dev/null
          cat AGENTS.md >/dev/null
          cat .project-memory/STATE.md >/dev/null
          cat docs/MARROW_IMAGE_PIPELINE.md >/dev/null
          cat docs/MARROW_BANK_INTEGRATION.md >/dev/null

      - name: Audit and stage exactly one bounded Biochemistry batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/marrow-images
          python3 tools/marrow_images.py audit --output build/marrow-images/audit.json
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
          python3 tools/stage_marrow_image_review.py --per-subject 6 --batch-id NKQ_BIOCHEMISTRY_20260911 --subject Biochemistry | tee build/marrow-images/stage-output.txt
          grep -Eq '^STAGED_REVIEW_ITEMS [1-6] ' build/marrow-images/stage-output.txt
          if grep -Ev '^(STAGED_REVIEW_ITEMS|Biochemistry )' build/marrow-images/stage-output.txt | grep -q .; then
            echo 'Unexpected subject in staging output' >&2
            exit 1
          fi
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check

      - name: Generate source/candidate comparison evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          import fitz
          from PIL import Image, ImageOps, ImageDraw
          root=pathlib.Path('.')
          stage=(root/'build/marrow-images/stage-output.txt').read_text().splitlines()
          rows=[]
          for line in stage:
              if line.startswith('Biochemistry '):
                  subject,qid,aid,mode=line.split()
                  rows.append((qid,aid,mode))
          assert 1 <= len(rows) <= 6, rows
          reg=json.loads((root/'data/marrow/images/registry.json').read_text())
          byid={a['id']:a for a in reg['assets']}
          out=root/'build/marrow-images/review-evidence'; out.mkdir(parents=True,exist_ok=True)
          doc=fitz.open(root/'data/marrow/source_pdfs/biochemistryed8.pdf')
          manifest=[]
          for qid,aid,mode in rows:
              a=byid[aid]
              b=next(x for x in a['bindings'] if x['questionId']==qid)
              src=b.get('source') or a['source']
              page_no=src['page']; page=doc[page_no-1]
              page_png=out/f'{qid}__page-{page_no}.png'
              pix=page.get_pixmap(matrix=fitz.Matrix(1.6,1.6),alpha=False)
              pix.save(page_png)
              candidate=root/a['original']['path']
              cimg=Image.open(candidate).convert('RGB')
              pimg=Image.open(page_png).convert('RGB')
              maxw=1100
              def fit(im,w):
                  if im.width<=w:return im
                  h=round(im.height*w/im.width); return im.resize((w,h))
              pimg=fit(pimg,maxw); cimg=fit(cimg,maxw)
              label=Image.new('RGB',(maxw,90),'white'); d=ImageDraw.Draw(label)
              d.text((12,10),f'{qid} | {aid} | {mode}',fill='black')
              d.text((12,38),f'page {page_no} xref {src.get("xref")} role {b.get("role")} status {b.get("status")}',fill='black')
              d.text((12,64),f'region {src.get("region")}',fill='black')
              canvas=Image.new('RGB',(maxw,max(1,pimg.height)+max(1,cimg.height)+label.height+20),'white')
              canvas.paste(label,(0,0)); canvas.paste(pimg,((maxw-pimg.width)//2,label.height)); canvas.paste(cimg,((maxw-cimg.width)//2,label.height+pimg.height+20))
              combined=out/f'{qid}__comparison.jpg'; canvas.save(combined,quality=90)
              manifest.append({'questionId':qid,'assetId':aid,'mode':mode,'source':src,'role':b.get('role'),'assetStatus':a.get('status'),'bindingStatus':b.get('status'),'comparison':str(combined)})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Required source-level regression checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_image_progress.py --check
          python3 tools/test_marrow_images.py
          python3 tools/verify_build_pipeline.py
          python3 tools/verify_local.py

      - name: Commit safe REVIEW_REQUIRED checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nk-qbank-automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temp-biochem-image-NKQ_BIOCHEMISTRY_20260911.yml
          git add data/marrow/images/registry.json data/marrow/images/progress.json data/marrow/images/originals/
          git diff --cached --check
          git commit -m 'Checkpoint Biochemistry image batch NKQ_BIOCHEMISTRY_20260911'
          git push origin HEAD:automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Update authoritative memory handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path('.')
          batch='NKQ_BIOCHEMISTRY_20260911'
          branch='automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911'
          base='1ae61e205804d3d3b2359fcbad218f56e396896b'
          candidate=os.environ['CANDIDATE_SHA']
          stage=(root/'build/marrow-images/stage-output.txt').read_text().splitlines()
          rows=[]
          for line in stage:
              if line.startswith('Biochemistry '):
                  subject,qid,aid,mode=line.split(); rows.append((qid,aid,mode))
          reg_path=root/'data/marrow/images/registry.json'; prog_path=root/'data/marrow/images/progress.json'
          reg_sha=hashlib.sha256(reg_path.read_bytes()).hexdigest(); prog_sha=hashlib.sha256(prog_path.read_bytes()).hexdigest()
          ids=', '.join(f'`{q}`' for q,_,_ in rows)
          assets=', '.join(f'`{a}`' for _,a,_ in rows)
          block=f'''\n## Current image automation checkpoint\n\n- Classification: **CURRENT_UNFINISHED**; owner **Biochemistry**; batch `{batch}`.\n- Branch `{branch}`; verified working base `{base}`; substantive candidate `{candidate}`. Resolve live branch HEAD from Git.\n- Registry SHA-256 `{reg_sha}`; progress SHA-256 `{prog_sha}`.\n- Staged question IDs: {ids}.\n- Staged asset IDs: {assets}. All new/reused bindings remain **REVIEW_REQUIRED** pending source/page, phone-width, expanded-view, role/timing and answer-safety inspection.\n- Exact next action: resume this same branch/batch, inspect `marrow-biochem-{batch}-review` comparison evidence, then record PASS/SOURCE_LIMITED/REJECTED decisions; do not start a second Biochemistry image batch.\n'''
          state=root/'.project-memory/STATE.md'
          text=state.read_text()
          text=re.sub(r'\n## Current image automation checkpoint\n.*?(?=\n## |\Z)','',text,flags=re.S)
          anchor='\n## Known problems / verification cautions\n'
          if anchor in text:text=text.replace(anchor,block+anchor)
          else:text += block
          state.write_text(text)
          log=root/'.project-memory/SESSION_LOG.md'
          log.open('a').write(f'''\n\n## 2026-09-11 — Biochemistry image batch {batch} staged checkpoint\n\n- STARTED new bounded Biochemistry image batch from verified Batch 08 base `{base}` on `{branch}`. Historical Anatomy work was classified VERIFIED_HISTORY; no true concurrent registry writer was present.\n- Substantive checkpoint `{candidate}` staged {len(rows)} deterministic subject-only candidate binding(s): {ids}. Asset IDs: {assets}.\n- All staged items remain REVIEW_REQUIRED; no learner-facing release or production promotion occurred.\n- Registry/progress fingerprints: `{reg_sha}` / `{prog_sha}`.\n- Required source-level checks passed before checkpoint. Next worker must resume this exact branch/batch and complete visual/source QA before any release.\n''')
          PY
          python3 tools/verify_project_memory.py
          git add .project-memory/STATE.md .project-memory/SESSION_LOG.md
          git diff --cached --check
          git commit -m 'Document Biochemistry image checkpoint NKQ_BIOCHEMISTRY_20260911 [skip ci]'
          git push origin HEAD:automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: marrow-biochem-NKQ_BIOCHEMISTRY_20260911-review
          path: |
            build/marrow-images/stage-output.txt
            build/marrow-images/review-evidence/
          if-no-files-found: error
          retention-days: 14
