name: One-shot Physiology Fast-Lane Batch 02 Handoff

on:
  push:
    branches: ['manual/marrow-physiology-fastlane-20260912-b02']
    paths:
      - '.github/workflows/marrow-image-fast-lane-handoff.yml'

permissions:
  contents: write

concurrency:
  group: marrow-image-fast-lane-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  write-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python3 -m pip install --disable-pip-version-check pypdf==6.18.0
      - name: Verify exact ownership and image state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/marrow-canonical-full-current
          test "$(git rev-parse origin/feature/marrow-canonical-full-current)" = "700cde07869068a7d3aadf77dc89d7bd85726530"
          git merge-base --is-ancestor aedfe3164da35e875db347483d8db3283169f8c0 HEAD
          python3 tools/marrow_images.py audit
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
          python3 tools/marrow_image_coverage.py --subject Physiology --check
      - name: Write durable project memory
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          dec=lambda s: base64.b64decode(s).decode()
          image_lane=dec("")
          oldp=dec("")
          newp=dec("")
          oldprob=dec("LSBQaHlzaW9sb2d5IGltYWdlIGNvdmVyYWdlIHJlbWFpbnMgaW5jb21wbGV0ZSBhZnRlciB0aGUgdmVyaWZpZWQgYm91bmRlZCBiYXRjaCwgYW5kIEJpb2NoZW1pc3RyeSBRMTEgcmVtYWlucyB1bnJlc29sdmVkL3BhdXNlZC4=")
          newprob=dec("LSBQaHlzaW9sb2d5IGltYWdlIGNvdmVyYWdlIHJlbWFpbnMgaW5jb21wbGV0ZSBhZnRlciBGYXN0LUxhbmUgQmF0Y2ggMDI7IDE0IHJldmlld2VkIHNwZWNpYWxpc3QgZGVmZXJyYWxzIHJlbWFpbiB1bnJlc29sdmVkLCBiZWdpbm5pbmcgd2l0aCBgbWFycm93X19QSFlTX0NIMDNfUTAxMzpmaWd1cmU6MmAuIEJpb2NoZW1pc3RyeSBRMTEgcmVtYWlucyB1bnJlc29sdmVkL3BhdXNlZC4=")
          session=dec("")
          roadmap=dec("")
          pipeline=dec("")
          marker="PHYSIO_FASTLANE_BATCH02_HANDOFF_20260912"
          p=Path('.project-memory/STATE.md'); s=p.read_text(); a=s.index('## Image lane\n'); b=s.index('\n## Anti-fragmentation rules',a); s=s[:a]+image_lane+s[b:]
          if oldp not in s or oldprob not in s: raise SystemExit('STATE anchors changed')
          p.write_text(s.replace(oldp,newp).replace(oldprob,newprob))
          for path,entry in [(Path('.project-memory/SESSION_LOG.md'),session),(Path('.project-memory/ROADMAP.md'),roadmap),(Path('docs/MARROW_IMAGE_PIPELINE.md'),pipeline)]:
              text=path.read_text()
              if marker not in text: path.write_text(text+entry)
          PY
          python3 tools/verify_project_memory.py
          git diff --check
      - name: Commit handoff and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/marrow-image-fast-lane-handoff.yml
          git add .project-memory/STATE.md .project-memory/SESSION_LOG.md .project-memory/ROADMAP.md docs/MARROW_IMAGE_PIPELINE.md
          git diff --cached --check
          git commit -m "Record Physiology fast-lane batch 02 handoff"
          git push origin HEAD:"${GITHUB_REF_NAME}"
