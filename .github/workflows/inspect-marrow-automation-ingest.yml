name: Inspect Marrow automation ingest shapes

on:
  push:
    branches:
      - feature/marrow-automation-ingest-physio-biochem

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit old Physiology source-count assumptions
        shell: bash
        run: |
          echo '--- physiology_ch001_033 refs ---'
          rg -n 'physiology_ch001_033' tools docs .project-memory .github data/marrow || true
          echo '--- 753/33 refs ---'
          rg -n '753/33|753 questions|753 / 33|753 /33|physiology=753|Physiology: \*\*753|Physiology.*753' tools docs .project-memory .github data/marrow || true
          echo '--- 2115 refs ---'
          rg -n '2115|2,115|current_topics=107|107 source topics|107 current topics' tools docs .project-memory .github data/marrow || true
