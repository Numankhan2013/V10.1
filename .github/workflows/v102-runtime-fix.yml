name: V10.3 stabilization

on:
  push:
    branches:
      - v10.2-ui-overhaul

permissions:
  contents: write

jobs:
  stabilize:
    if: "!contains(github.event.head_commit.message, 'V10.3 stabilization applied')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: v10.2-ui-overhaul
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply V10.3 stabilization layer
        run: python tools/v103_stabilize.py

      - name: Commit V10.3 stabilization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'No stabilization changes needed.'
            exit 0
          fi
          git commit -m 'V10.3 stabilization applied'
          git push origin HEAD:v10.2-ui-overhaul
