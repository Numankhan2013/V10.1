name: V10.2 runtime repair

on:
  push:
    branches: [v10.2]
    paths:
      - qbank-v102-runtime-repair.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 1
      - name: Repair runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')

          # Persist the streak card through every render by making dashboard()
          # produce it instead of relying on a one-shot DOM injection.
          anchor='<div class="dashboard-section"><div class="section-title"><span>At a glance</span>'
          if '${streakMarkup()}' not in s:
              if anchor not in s: raise SystemExit('dashboard anchor missing')
              s=s.replace(anchor, '${streakMarkup()}'+anchor, 1)
          s=s.replace("if(document.querySelector('.v102-streak-card')) return;", "if(document.querySelector('.streak-card') || document.querySelector('.v102-streak-card')) return;", 1)

          # Make Review Solutions perform the state transition and render immediately;
          # do not depend on WebView hashchange delivery for the visible navigation.
          old=re.search(r'  function reviewTest\(testId\) \{.*?\n  \}\n\n  function reviewTestPage', s, re.S)
          if not old: raise SystemExit('reviewTest function missing')
          new="""  function reviewTest(testId) {
    const t=state.tests.find(x=>String(x.id)===String(testId)); if(!t) return;
    state.activeSession={ id:`review_${t.id}`, mode:'review', sourceTestId:t.id, title:`Review · ${t.title}`, questionIds:[...t.questionIds], index:0, answers:{...(t.answers||{})}, submitted:Object.fromEntries(t.questionIds.map(id=>[id,Boolean(t.answers?.[id])])), startedAt:t.createdAt, questionTimes:{...(t.questionTimes||{})} };
    saveState();
    route={page:'review-test',id:String(t.id)};
    render();
    const hash=`review-test/${encodeURIComponent(t.id)}`;
    if(location.hash!==`#${hash}`) history.pushState(null,'',`#${hash}`);
  }

  function reviewTestPage"""
          s=s[:old.start()]+new+s[old.end():]

          # Remove the old capture-time interception; the button's exported handler is
          # now authoritative and cannot be swallowed before its inline click runs.
          guard=re.compile(r'<script id="v102-review-cta-guard">.*?</script>\\?', re.S)
          replacement='''<script id="v102-review-cta-guard">
          (function(){
            document.addEventListener('click',function(e){
              var b=e.target && e.target.closest ? e.target.closest('[data-v102-review-cta]') : null;
              if(!b) return;
              var id=b.getAttribute('data-review-test-id');
              if(!id || !window.QB || typeof window.QB.reviewTest!=='function') return;
              if(e.defaultPrevented) return;
              window.QB.reviewTest(id);
            });
          })();
          </script>'''
          s,n=guard.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'review guard replacement count={n}')

          # Repair the earlier literal backslash-n injection artifacts.
          s=s.replace('</script>\\n','</script>\n').replace('</style>\\n','</style>\n')

          # Avoid duplicate focus-card selector mutations from earlier repair passes.
          s=s.replace('.card.pad.card.pad.focus-card{background:', '.card.pad.focus-card{background:')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'dashboard renders streak': '${streakMarkup()}' in s,
            'review direct render': bool(re.search(r'route=\{page:\x27review-test\x27,id:String\(t.id\)\}',s)),
            'review data id': 'data-review-test-id="${esc(t.id)}"' in s,
            'focus card': '.card.pad.focus-card{background:' in s,
            'green feedback': '.option.correct.selected{background:#eaf9f3!important' in s,
            'red feedback': '.option.wrong.selected{background:#fff0f1!important' in s,
            'no escaped separators': '\\n<script id="v102-' not in s and '\\n<style id="v102-' not in s,
          }
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              body=body.strip()
              if not body: continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(f'inline script {i} syntax failure')
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          assert all(checks.values()), checks
          assert s.count("function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }")==1
          PY
      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'V10.2 product source: repair review and streak runtime'
            git push
          else
            echo 'No source changes'
          fi
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace
      - name: Upload repaired APK
        uses: actions/upload-artifact@v4
        with:
          name: qbank-v10.2-runtime-repaired-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
