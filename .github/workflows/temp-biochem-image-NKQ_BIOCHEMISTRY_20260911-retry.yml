name: TEMP RETRY Biochemistry image batch NKQ_BIOCHEMISTRY_20260911

on:
  push:
    branches: [automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911]

permissions:
  contents: write

jobs:
  stage-review-checkpoint:
    if: ${{ github.event.head_commit.message == 'Retry Biochemistry image batch NKQ_BIOCHEMISTRY_20260911' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pypdf==6.18.0 pymupdf pillow
      - name: Guard lineage, source and no pre-existing image mutation
        shell: bash
        run: |
          set -euo pipefail
          BASE=1ae61e205804d3d3b2359fcbad218f56e396896b
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --quiet "$BASE"..HEAD -- data/marrow/images/registry.json data/marrow/images/progress.json data/marrow/images/originals/
          test "$(stat -c %s data/marrow/source_pdfs/biochemistryed8.pdf)" = "7958177"
          echo '463cb586aa18b702243d2467b4ad1f7fb24537d7ae73388607421516660643eb  data/marrow/source_pdfs/biochemistryed8.pdf' | sha256sum -c -
          cat docs/MARROW_IMAGE_AUTOMATION_RUNBOOK.md >/dev/null
          cat AGENTS.md >/dev/null
          cat .project-memory/STATE.md >/dev/null
          cat docs/MARROW_IMAGE_PIPELINE.md >/dev/null
          cat docs/MARROW_BANK_INTEGRATION.md >/dev/null
      - name: Audit and stage bounded subject-only batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/marrow-images
          python3 tools/marrow_images.py audit --output build/marrow-images/audit.json
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
          python3 tools/stage_marrow_image_review.py --per-subject 6 --batch-id NKQ_BIOCHEMISTRY_20260911 --subject Biochemistry | tee build/marrow-images/stage-output.txt
          test "$(grep -c '^Biochemistry ' build/marrow-images/stage-output.txt)" = "6"
          grep -q '^STAGED_REVIEW_ITEMS 6 ' build/marrow-images/stage-output.txt
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
      - name: Generate comparison evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          import fitz
          from PIL import Image,ImageDraw
          root=pathlib.Path('.')
          rows=[]
          for line in (root/'build/marrow-images/stage-output.txt').read_text().splitlines():
              if line.startswith('Biochemistry '):
                  _,qid,aid,mode=line.split(); rows.append((qid,aid,mode))
          assert len(rows)==6
          reg=json.loads((root/'data/marrow/images/registry.json').read_text()); byid={a['id']:a for a in reg['assets']}
          out=root/'build/marrow-images/review-evidence'; out.mkdir(parents=True,exist_ok=True)
          doc=fitz.open(root/'data/marrow/source_pdfs/biochemistryed8.pdf'); manifest=[]
          for qid,aid,mode in rows:
              a=byid[aid]; b=next(x for x in a['bindings'] if x['questionId']==qid); src=b.get('source') or a['source']
              page=doc[src['page']-1]; pix=page.get_pixmap(matrix=fitz.Matrix(1.6,1.6),alpha=False)
              p=out/f'{qid}__page.png'; pix.save(p)
              pimg=Image.open(p).convert('RGB'); cimg=Image.open(root/a['original']['path']).convert('RGB'); w=1100
              def fit(im):
                  return im if im.width<=w else im.resize((w,round(im.height*w/im.width)))
              pimg,cimg=fit(pimg),fit(cimg); label=Image.new('RGB',(w,95),'white'); d=ImageDraw.Draw(label)
              d.text((12,10),f'{qid} | {aid} | {mode}',fill='black'); d.text((12,38),f'page {src["page"]} xref {src.get("xref")} role {b.get("role")}',fill='black'); d.text((12,66),f'region {src.get("region")}',fill='black')
              canvas=Image.new('RGB',(w,label.height+pimg.height+cimg.height+20),'white'); canvas.paste(label,(0,0)); canvas.paste(pimg,((w-pimg.width)//2,label.height)); canvas.paste(cimg,((w-cimg.width)//2,label.height+pimg.height+20))
              comp=out/f'{qid}__comparison.jpg'; canvas.save(comp,quality=90)
              manifest.append({'questionId':qid,'assetId':aid,'mode':mode,'source':src,'role':b.get('role'),'assetStatus':a.get('status'),'bindingStatus':b.get('status'),'comparison':str(comp)})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Required regressions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_image_progress.py --check
          python3 tools/test_marrow_images.py
          python3 tools/verify_build_pipeline.py
          python3 tools/verify_local.py
      - name: Commit safe checkpoint and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name nk-qbank-automation
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/temp-biochem-image-NKQ_BIOCHEMISTRY_20260911.yml .github/workflows/temp-biochem-image-NKQ_BIOCHEMISTRY_20260911-retry.yml
          git add data/marrow/images/registry.json data/marrow/images/progress.json data/marrow/images/originals/
          git diff --cached --check
          git commit -m 'Checkpoint Biochemistry image batch NKQ_BIOCHEMISTRY_20260911'
          git push origin HEAD:automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Update memory handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,re
          root=pathlib.Path('.'); batch='NKQ_BIOCHEMISTRY_20260911'; branch='automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911'; base='1ae61e205804d3d3b2359fcbad218f56e396896b'; candidate=os.environ['CANDIDATE_SHA']
          rows=[]
          for line in (root/'build/marrow-images/stage-output.txt').read_text().splitlines():
              if line.startswith('Biochemistry '): _,qid,aid,mode=line.split(); rows.append((qid,aid,mode))
          reg=root/'data/marrow/images/registry.json'; prog=root/'data/marrow/images/progress.json'; rsha=hashlib.sha256(reg.read_bytes()).hexdigest(); psha=hashlib.sha256(prog.read_bytes()).hexdigest(); ids=', '.join(f'`{q}`' for q,_,_ in rows); assets=', '.join(f'`{a}`' for _,a,_ in rows)
          block=f'''\n## Current image automation checkpoint\n\n- Classification: **CURRENT_UNFINISHED**; owner **Biochemistry**; batch `{batch}`.\n- Branch `{branch}`; verified working base `{base}`; substantive candidate `{candidate}`. Resolve live branch HEAD from Git.\n- Registry SHA-256 `{rsha}`; progress SHA-256 `{psha}`.\n- Staged question IDs: {ids}.\n- Staged asset IDs: {assets}. All six assets/bindings remain **REVIEW_REQUIRED** pending source/page, phone-width, expanded-view, role/timing and answer-safety inspection.\n- Exact next action: resume this exact branch/batch, inspect `marrow-biochem-{batch}-review` evidence, record QA decisions, then run release/package checks only for items that pass. Do not start another Biochemistry batch.\n'''
          state=root/'.project-memory/STATE.md'; text=state.read_text(); text=re.sub(r'\n## Current image automation checkpoint\n.*?(?=\n## |\Z)','',text,flags=re.S); anchor='\n## Known problems / verification cautions\n'; state.write_text(text.replace(anchor,block+anchor) if anchor in text else text+block)
          log=root/'.project-memory/SESSION_LOG.md'; log.open('a').write(f'''\n\n## 2026-09-11 — Biochemistry image batch {batch} staged checkpoint\n\n- STARTED new bounded Biochemistry image batch from verified Batch 08 base `{base}` on `{branch}`. Historical Anatomy work is VERIFIED_HISTORY; no true concurrent registry writer was present.\n- Substantive checkpoint `{candidate}` staged six deterministic Biochemistry candidates: {ids}. Asset IDs: {assets}.\n- All remain REVIEW_REQUIRED; no learner-facing release or production promotion occurred. Registry/progress fingerprints: `{rsha}` / `{psha}`.\n- Required source-level checks passed. Resume this exact branch/batch for visual/source QA.\n''')
          PY
          python3 tools/verify_project_memory.py
          git add .project-memory/STATE.md .project-memory/SESSION_LOG.md
          git diff --cached --check
          git commit -m 'Document Biochemistry image checkpoint NKQ_BIOCHEMISTRY_20260911 [skip ci]'
          git push origin HEAD:automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911
      - uses: actions/upload-artifact@v4
        with:
          name: marrow-biochem-NKQ_BIOCHEMISTRY_20260911-review
          path: |
            build/marrow-images/stage-output.txt
            build/marrow-images/review-evidence/
          if-no-files-found: error
          retention-days: 14
