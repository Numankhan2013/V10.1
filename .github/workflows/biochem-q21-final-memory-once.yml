name: Biochemistry Q21 Final Memory Once

on:
  push:
    branches:
      - automation/marrow-images-biochemistry-coverage-20260912-q21-r2

permissions:
  contents: write

jobs:
  finalize-memory:
    if: ${{ !startsWith(github.event.head_commit.message, 'Finalize Biochemistry Q21 handoff') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/marrow-images-biochemistry-coverage-20260912-q21-r2
          fetch-depth: 0
      - name: Finalize canonical-ready image memory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          state_path = Path('.project-memory/STATE.md')
          s = state_path.read_text()
          s = s.replace(
              "- **build-verified:** last explanation-certified canonical content state is green through Engineering Gate **34650259296** and full Android/PWA/browser/APK/package/reproducibility/preview run **34650259281**; latest image-certified canonical product bytes are from Biochemistry Q6/Q7 recovery commit `1e8486edef6c0ba76904f098833fb3fe0bcfecc8`, with exact-head Engineering Gate **34678998929** and full Android/PWA/browser/APK/package/reproducibility/preview run **34679001808** passing on memory-only checkpoint `352418ef4e17e62fd9127849bb9476d12b70259b`; production promotion was skipped.",
              "- **build-verified:** last explanation-certified canonical content state is green through Engineering Gate **34650259296** and full Android/PWA/browser/APK/package/reproducibility/preview run **34650259281**; latest image-certified canonical product bytes include Biochemistry Q21 recovery integration `d7a1fc6fead85beb9354965b6621d6756cc30580`, exact-head handoff `88a068182b76a0ab4730c90b93b35f30cb31ca2a`, Engineering Gate **34686820682**, and full Android/PWA/browser/image-comparison/APK/package/reproducibility/preview run **34686821723**; production promotion was skipped."
          )
          s = s.replace(
              "- This batch is static/source validated but must not release the writer lane until exact-head Engineering + full Android/PWA/browser/APK/package verification succeeds and the verified commit is reconciled into `feature/marrow-canonical-full-current`. Production promotion is prohibited.",
              "- **Verification/reconciliation:** exact-head handoff `88a068182b76a0ab4730c90b93b35f30cb31ca2a` passed Engineering Gate **34686820682** and full Android/PWA/browser/image-comparison/APK/package/reproducibility/preview run **34686821723**. Production promotion was skipped. The verified handoff was fast-forwarded into `feature/marrow-canonical-full-current` with no registry/progress conflict; the image writer lane is released for the next deterministic Biochemistry reference."
          )
          s = s.replace(
              "- Biochemistry image coverage remains incomplete: 40 effective source references are not resolved yet (4 tracked-unreleased + 36 untracked), plus 31 text-cue review items still require adjudication.",
              "- Biochemistry image coverage remains incomplete: 39 effective source references are not learner-facing yet (4 tracked-unreleased + 35 untracked), plus 31 text-cue review items still require adjudication."
          )
          s = s.replace(
              "- Q21 image source/content review is complete; release is blocked only on durable production-byte provenance after two current-toolchain encoding mismatches. Do not skip to a later easier reference and do not relax the hash/source-comparison gate.",
              "- Q21 is now source-compared, released, exact-head product-verified, and reconciled into canonical using deterministic raw 300-DPI bytes SHA `f2a6b0691fffcbe3756d9db58d2baf28c3254f54ede9de577071b7b244bdc789`. Continue strictly from Q26; do not skip to an easier later reference."
          )
          old = "7. **Image lane:** resume `automation/marrow-images-biochemistry-coverage-20260912-q21` at safe checkpoint `e81157ca96a593975b00879fa425bd4690d3e637`. Recover the exact reviewed `07082b9d…` PNG bytes if possible; otherwise perform a fresh complete visual QA on one pinned deterministic encoding before changing the production hash. Then integrate Q21 non-destructively, regenerate progress/coverage/release, run full image/browser/PWA/APK/package gates, and reconcile into canonical before releasing the lane. Do not skip Q21."
          new = "7. **Image lane:** Q21 recovery is complete and reconciled. Next deterministic Biochemistry reference is `marrow__BIOCHEM_CH02_Q026:figure:1` (explanation, source page 41, two native candidates). Start the next bounded batch from the live canonical head and do not skip Q26 for an easier later reference. Production promotion remains prohibited."
          assert old in s
          s = s.replace(old, new)
          state_path.write_text(s)

          log = Path('.project-memory/SESSION_LOG.md')
          with log.open('a') as f:
              f.write('''\n\n## 2026-09-12 — Biochemistry Q21 image recovery fully verified and reconciled\n\n- Resumed the unfinished Ch2 Q21 explanation figure from the live canonical base `d84a8093468c278a19e81e917bcc66da91f33574` on `automation/marrow-images-biochemistry-coverage-20260912-q21-r2`.\n- Fresh source comparison used authoritative Biochemistry ED8 page 39, composite xrefs 83/84/85, exact region `[161.491,55.671,450.509,272.328]`; neighboring xref 86 is Q22-owned and excluded. Full-page, exact-region, 1206x904 native, 390px phone and 768px expanded views were inspected in workflow **34686576057**, artifact **10295084510**.\n- Adopted the deterministic raw 300-DPI source render SHA-256 `f2a6b0691fffcbe3756d9db58d2baf28c3254f54ede9de577071b7b244bdc789`; no reconstruction, generation, inpainting, or medical/diagram-detail alteration was used.\n- Registry/release integration commit: `d7a1fc6fead85beb9354965b6621d6756cc30580`; exact-head CI handoff: `88a068182b76a0ab4730c90b93b35f30cb31ca2a`. Engineering Gate **34686820682** passed. Full Android/PWA/browser/image-comparison/APK/package/reproducibility/preview run **34686821723** passed. Production promotion was skipped.\n- Post-release Biochemistry coverage: **110 raw / 109 effective / 70 released / 1 invalid source metadata / 71 resolved / 4 tracked-unreleased / 35 untracked / 31 text-cue review items**. Subject remains **INCOMPLETE**.\n- The verified handoff was fast-forwarded into `feature/marrow-canonical-full-current` without a registry/progress conflict. Image writer lane released.\n- Next deterministic source reference: `marrow__BIOCHEM_CH02_Q026:figure:1`, explanation, source page 41, two native candidates. Do not skip it for an easier later reference.\n''')

          cp = Path('data/marrow/images/recovery_checkpoints/biochem_ch02_q021_20260912_r2.json')
          obj = json.loads(cp.read_text())
          obj['status'] = 'FULLY_VERIFIED_RECONCILED'
          obj['exactHeadHandoffCommit'] = '88a068182b76a0ab4730c90b93b35f30cb31ca2a'
          obj['verification'] = {
              'engineeringGateRun': 34686820682,
              'fullAndroidPwaBrowserApkPackageRun': 34686821723,
              'productionPromotion': 'SKIPPED'
          }
          obj['canonicalReconciliation'] = {
              'branch': 'feature/marrow-canonical-full-current',
              'method': 'fast-forward',
              'verifiedHandoff': '88a068182b76a0ab4730c90b93b35f30cb31ca2a',
              'registryConflict': False
          }
          obj['nextAction'] = 'Start the next bounded Biochemistry image-recovery batch from live canonical at marrow__BIOCHEM_CH02_Q026:figure:1. Recompute audit/coverage first; do not skip source order.'
          cp.write_text(json.dumps(obj, indent=2) + '\n')
          PY
      - name: Verify memory and commit final handoff
        run: |
          python3 tools/verify_project_memory.py
          rm -f .github/workflows/biochem-q21-final-memory-once.yml
          git config user.name "NK QBank Image Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Biochemistry Q21 handoff"
          git push origin HEAD:automation/marrow-images-biochemistry-coverage-20260912-q21-r2
