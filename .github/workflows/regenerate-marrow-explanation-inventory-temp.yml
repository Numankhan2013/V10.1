name: Temporary Marrow explanation inventory regeneration

on:
  push:
    branches:
      - feature/marrow-explanation-rollout-anatomy-ch06-q001-q007-canonical-r3

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/marrow-explanation-rollout-anatomy-ch06-q001-q007-canonical-r3
      - name: Regenerate deterministic explanation inventory
        run: |
          python3 tools/inventory_marrow_explanations.py --write
          python3 tools/test_marrow_explanation_inventory.py
      - name: Commit generated inventory only
        run: |
          git config user.name 'NK QBank Explanation Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add data/marrow/explanation_inventory_v1.json
          if git diff --cached --quiet; then
            echo 'Inventory already current.'
            exit 0
          fi
          git commit -m 'Regenerate Marrow explanation inventory for Anatomy Ch6 Q1-Q7'
          git push origin HEAD:feature/marrow-explanation-rollout-anatomy-ch06-q001-q007-canonical-r3
