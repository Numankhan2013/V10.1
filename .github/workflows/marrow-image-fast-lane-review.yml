name: Manual Marrow Image Fast-Lane Source Review

on:
  push:
    branches: ['manual/marrow-*-fastlane-*']
    paths:
      - '.github/workflows/marrow-image-fast-lane-review.yml'
      - 'tools/marrow_image_fast_lane.py'
      - 'data/marrow/images/review_requests/*.json'
  workflow_dispatch:
    inputs:
      subject:
        description: Canonical Marrow subject
        required: true
        type: choice
        options: [Anatomy, Biochemistry, Physiology]
        default: Physiology
      reference_count:
        description: Deterministic unresolved references to audit (25-40)
        required: true
        type: number
        default: 35
      batch_id:
        description: Durable globally unique review batch identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marrow-image-fast-lane-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF dependencies
        run: python3 -m pip install --disable-pip-version-check pypdf==6.18.0 PyMuPDF Pillow
      - name: Verify source state and create deterministic plan
        run: |
          python3 tools/marrow_images.py audit
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
          python3 tools/marrow_image_coverage.py --subject "${{ inputs.subject || 'Physiology' }}" --check
          python3 tools/marrow_image_fast_lane.py plan --subject "${{ inputs.subject || 'Physiology' }}" --count "${{ inputs.reference_count || 40 }}" --batch-id "${{ inputs.batch_id || format('MANUAL_FASTLANE_{0}', github.run_id) }}" --base-sha "$GITHUB_SHA" --output build/marrow-fast-lane/plan.json
      - name: Batch-render source pages and candidate regions
        run: python3 tools/marrow_image_fast_lane.py render --plan build/marrow-fast-lane/plan.json --output build/marrow-fast-lane/evidence
      - name: Upload one conclusive source-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: marrow-fast-lane-${{ inputs.batch_id || format('MANUAL_FASTLANE_{0}', github.run_id) }}
          path: build/marrow-fast-lane/evidence
          if-no-files-found: error
          retention-days: 14
