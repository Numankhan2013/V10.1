name: Finalize Biochemistry Image Handoff

on:
  push:
    branches:
      - automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911
          fetch-depth: 0
      - name: Finalize authoritative image handoff
        shell: bash
        env:
          STATE_BLOCK_B64: 
          LOG_ENTRY_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          state = Path('.project-memory/STATE.md')
          text = state.read_text()
          start = text.index('## Current image automation checkpoint')
          end = text.index('\n## Known problems / verification cautions', start)
          replacement = base64.b64decode(os.environ['STATE_BLOCK_B64']).decode()
          state.write_text(text[:start] + replacement + text[end:])
          log = Path('.project-memory/SESSION_LOG.md')
          marker = '## 2026-09-11 — Biochemistry image batch NKQ_BIOCHEMISTRY_20260911 completed'
          if marker not in log.read_text():
              with log.open('a') as f:
                  f.write(base64.b64decode(os.environ['LOG_ENTRY_B64']).decode())
          PY
          rm .github/workflows/finalize-biochem-image-handoff.yml
      - name: Commit handoff
        shell: bash
        run: |
          git config user.name "nk-qbank-automation"
          git config user.email "actions@users.noreply.github.com"
          git add .project-memory/STATE.md .project-memory/SESSION_LOG.md .github/workflows/finalize-biochem-image-handoff.yml
          git diff --cached --check
          git commit -m "Finalize Biochemistry image batch handoff [skip ci]"
          git push origin HEAD:automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_20260911
