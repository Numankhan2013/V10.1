name: V10.2 core UX overhaul

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overhaul:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V10.1
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Apply V10.2 core UX overhaul
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # Hard guard: the established haptic implementation is sacred.
          haptic="function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }"
          h0=s.count(haptic); v0=s.count('navigator.vibrate')
          if h0!=1: raise SystemExit(f'FAIL: canonical haptic function count={h0}')

          def fn_block(src,name):
              m=re.search(r'function\\s+'+re.escape(name)+r'\\s*\\([^)]*\\)\\s*\\{',src)
              if not m: raise SystemExit(f'FAIL: function {name} not found')
              start=m.start(); brace=src.find('{',m.start()); depth=0; quote=None; esc=False
              i=brace
              while i<len(src):
                  c=src[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\\\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return start,i+1
                  i+=1
              raise SystemExit(f'FAIL: unterminated {name}')

          # 1) Make Review Solutions a real, exact-test action.
          a,b=fn_block(s,'resultPage')
          result=s[a:b]
          # Replace any existing Review Test/Solutions action with a direct call carrying this exact t.id.
          result2=re.sub(r'onclick="window\\.QB\\.reviewTest\\([^\"]*\\)"',
                         'onclick="window.QB.reviewTest(\'${esc(t.id)}\')"',result)
          if result2==result:
              result2=result.replace('>Review Test</button>','>Review Solutions</button>')
          else:
              result2=result2.replace('>Review Test</button>','>Review Solutions</button>')
          s=s[:a]+result2+s[b:]

          # 2) Strengthen review state reconstruction without replacing the existing engine.
          # The existing reviewTest() already carries questionIds + answers; add an immutable source test id marker.
          a,b=fn_block(s,'reviewTest')
          review=s[a:b]
          if 'sourceTestId' not in review:
              review=review.replace("mode:'review',", "mode:'review', sourceTestId:testId,")
          s=s[:a]+review+s[b:]

          # 3) Practice becomes tap -> immediate answer -> feedback -> Next.
          # Wrap the existing selector after all app functions have loaded. Existing haptics remain untouched.
          behavior=r'''\n<script id="v102-core-behavior">\n(function(){\n  function boot(){\n    if(window.__V102_BOOTED) return;\n    if(typeof window.selectPractice!=='function' || typeof window.submitPractice!=='function') return;\n    window.__V102_BOOTED=true;\n    const oldSelect=window.selectPractice;\n    const oldSubmit=window.submitPractice;\n    window.selectPractice=function(qid,n){\n      oldSelect(qid,n);\n      setTimeout(function(){ try{ oldSubmit(); }catch(e){} },0);\n    };\n\n    function cleanPractice(){\n      const text=n=>((n.innerText||n.textContent||'').trim().toLowerCase());\n      document.querySelectorAll('button').forEach(function(btn){\n        const t=text(btn);\n        if(t==='submit' || t==='submit answer') {\n          const root=btn.closest('.question-card,.question-shell,.page,section');\n          if(root && root.querySelector('.option,.option-item')) { btn.remove(); }\n        }\n      });\n    }\n    const mo=new MutationObserver(cleanPractice);\n    mo.observe(document.body,{subtree:true,childList:true});\n    cleanPractice();\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();\n  setTimeout(boot,250); setTimeout(boot,1000);\n})();\n</script>\n'''
          if 'id="v102-core-behavior"' not in s:
              s=s.replace('</body>',behavior+'</body>',1)

          # 4) Remove genuinely dead top-right menu controls, but only when they have no action.
          dead=r'''\n<script id="v102-dead-control-cleanup">\n(function(){\n  function clean(){\n    document.querySelectorAll('.topbar button,.topbar .icon-btn').forEach(function(el){\n      const action=el.getAttribute('onclick')||el.getAttribute('data-action')||'';\n      const label=((el.getAttribute('aria-label')||el.title||el.textContent||'')+'').trim().toLowerCase();\n      if(!action && !el.dataset.nav && (label==='menu'||label==='more'||label==='options'||label==='')) {\n        const svg=el.querySelector('svg');\n        if(svg && !el.closest('a')) el.remove();\n      }\n    });\n  }\n  new MutationObserver(clean).observe(document.body,{subtree:true,childList:true});\n  setTimeout(clean,100); setTimeout(clean,700);\n})();\n</script>\n'''
          if 'id="v102-dead-control-cleanup"' not in s:
              s=s.replace('</body>',dead+'</body>',1)

          # 5) 2026 visual system: depth, typography, color roles, streak, dashboard/chapter/result hierarchy.
          css=r'''\n<style id="v102-visual-system">\n:root{\n --v102-ink:#101321; --v102-muted:#697083; --v102-line:#e6e9f0;\n --v102-bg:#f5f7fb; --v102-surface:#fff; --v102-brand:#4f46e5; --v102-brand2:#7c3aed;\n --v102-cyan:#0891b2; --v102-green:#10b981; --v102-amber:#f59e0b; --v102-red:#ef4444;\n --v102-shadow:0 18px 50px rgba(24,30,60,.08); --v102-shadow-sm:0 8px 26px rgba(24,30,60,.06);\n}\nhtml,body{background:var(--v102-bg);color:var(--v102-ink)}\nbody{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n.topbar{background:linear-gradient(135deg,#17163b 0%,#302b72 52%,#4f46e5 100%);box-shadow:0 8px 30px rgba(31,29,86,.18);border-bottom:1px solid rgba(255,255,255,.08)}\n.topbar .brand{font-weight:800;letter-spacing:-.2px}.brand-mark{box-shadow:0 7px 18px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.2)}\n.page{padding-top:24px}\n.page-title{font-size:32px;font-weight:900;letter-spacing:-1px;color:#0d1020}\n.page-sub{font-size:13px;color:var(--v102-muted);line-height:1.5}\n.section-title{font-size:17px;font-weight:850;letter-spacing:-.35px;color:#14182a}\n.card{border:1px solid rgba(29,36,68,.07);box-shadow:var(--v102-shadow-sm);border-radius:20px}\n.stat-card{position:relative;overflow:hidden;min-height:112px;border-radius:18px;background:linear-gradient(145deg,#fff,#fbfcff)}\n.stat-card:after{content:"";position:absolute;right:-22px;top:-28px;width:86px;height:86px;border-radius:50%;background:rgba(79,70,229,.06)}\n.stat-card .label{font-weight:650;color:#7a8191}.stat-card .value{font-size:28px;font-weight:900;letter-spacing:-1px}\n.primary-btn{background:linear-gradient(135deg,var(--v102-brand),var(--v102-brand2));border-color:transparent;box-shadow:0 10px 22px rgba(79,70,229,.22);font-weight:800}\n.primary-btn:active{transform:translateY(1px);box-shadow:0 5px 12px rgba(79,70,229,.18)}\n.ghost-btn{font-weight:760;background:rgba(255,255,255,.82)}\n.option{border-radius:16px;border-color:#e3e6ee;background:#fff;box-shadow:0 2px 7px rgba(30,36,60,.025);transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease,background .12s ease}\n.option:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(30,36,60,.07)}\n.option.selected{box-shadow:0 8px 22px rgba(61,101,216,.1)}\n.question-text{font-size:18px;font-weight:680;letter-spacing:-.2px;color:#171a2b}\n.feedback{border-radius:17px;box-shadow:0 8px 24px rgba(30,36,60,.04)}\n.result-hero{border-radius:24px;box-shadow:var(--v102-shadow);border:1px solid rgba(79,70,229,.1)}\n.kpi{font-weight:950;letter-spacing:-2px}\n.bottom-nav{background:rgba(255,255,255,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 -8px 30px rgba(25,31,60,.06);border-top:1px solid rgba(30,35,65,.07)}\n.nav-item{font-weight:750}.nav-item.active{font-weight:900}\n.v102-streak{position:relative;overflow:hidden;padding:20px;border-radius:24px;background:radial-gradient(circle at 86% 18%,rgba(245,158,11,.28),transparent 32%),linear-gradient(135deg,#17152f,#30265f 58%,#5b21b6);color:#fff;box-shadow:0 18px 42px rgba(53,35,104,.22);margin-bottom:14px}\n.v102-streak:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-80px;bottom:-90px;background:rgba(255,255,255,.07)}\n.v102-streak .eyebrow{font-size:11px;font-weight:850;letter-spacing:.8px;text-transform:uppercase;opacity:.72}.v102-streak .number{font-size:46px;line-height:1;font-weight:950;letter-spacing:-2.5px;margin-top:7px}.v102-streak .copy{font-size:13px;opacity:.82;margin-top:7px}.v102-streak .flame{font-size:48px;filter:drop-shadow(0 8px 15px rgba(245,158,11,.28));animation:v102-flame 2.8s ease-in-out infinite}.v102-streak .week{display:flex;gap:7px;margin-top:17px}.v102-streak .day{flex:1;text-align:center;font-size:9px;opacity:.68}.v102-streak .dot{width:20px;height:20px;border-radius:50%;margin:5px auto 0;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}.v102-streak .dot.on{background:linear-gradient(135deg,#fbbf24,#f97316);border-color:transparent;box-shadow:0 5px 14px rgba(249,115,22,.28)}\n@keyframes v102-flame{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}50%{transform:translateY(-3px) rotate(2deg) scale(1.045)}}\n.v102-next{padding:21px;border-radius:24px;background:linear-gradient(145deg,#fff,#f5f6ff);border:1px solid rgba(79,70,229,.11);box-shadow:var(--v102-shadow);margin-bottom:14px}.v102-next .eyebrow{font-size:10px;font-weight:900;letter-spacing:1px;color:var(--v102-brand);text-transform:uppercase}.v102-next h2{font-size:22px;line-height:1.15;letter-spacing:-.7px;margin:7px 0 6px;font-weight:900}.v102-next p{font-size:13px;color:var(--v102-muted);line-height:1.45;margin:0}.v102-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.v102-actions button{flex:1;min-width:105px}\n.v102-section{margin-top:20px}.v102-section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.v102-section-head h2{margin:0;font-size:18px;font-weight:900;letter-spacing:-.45px}.v102-section-head span{font-size:11px;color:var(--v102-muted)}\n.v102-review-banner{padding:15px 16px;border-radius:18px;background:linear-gradient(135deg,#f7f5ff,#fff);border:1px solid rgba(79,70,229,.12);margin-bottom:14px}.v102-review-banner strong{font-size:14px}.v102-review-status{display:inline-flex;padding:5px 8px;border-radius:999px;background:#ede9fe;color:#5b21b6;font-size:10px;font-weight:900;margin-bottom:8px}\n.v102-answer-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.v102-answer-summary>div{padding:12px 13px;border-radius:15px;background:#f8f9fc;border:1px solid #eceef4}.v102-answer-summary .label{font-size:10px;color:var(--v102-muted);font-weight:700}.v102-answer-summary .value{font-size:15px;font-weight:900;margin-top:3px}\n@media(max-width:640px){\n .page{padding-left:16px;padding-right:16px;padding-top:19px}\n .page-title{font-size:29px}\n .grid-4{gap:9px}.stat-card{min-height:101px;padding:13px}.stat-card .value{font-size:25px}\n .v102-streak{padding:18px}.v102-streak .number{font-size:42px}.v102-streak .flame{font-size:43px}\n .v102-next{padding:18px}.v102-next h2{font-size:21px}.v102-actions button{min-height:48px}\n .question-text{font-size:17px}.option{padding:14px 13px}\n .result-hero{border-radius:20px}\n}\n@media(prefers-reduced-motion:reduce){.v102-streak .flame{animation:none}.option,.primary-btn{transition:none!important}}\n</style>\n'''
          if 'id="v102-visual-system"' not in s:
              s=s.replace('</body>',css+'</body>',1)

          # 6) Inject streak + dashboard shell into the rendered page without altering study logic.
          dashboard=r'''\n<script id="v102-dashboard-layer">\n(function(){\n  function inject(){\n    const page=document.querySelector('.page');\n    if(!page || page.querySelector('.v102-streak')) return;\n    const title=(page.querySelector('.page-title')||{}).textContent||'';\n    if(!/home|dashboard/i.test(title) && !document.body.textContent.includes('YOUR NEXT BEST MOVE')) return;\n    const host=page.querySelector('.page-head')?.parentElement||page;\n    const streak=document.createElement('section'); streak.className='v102-streak';\n    streak.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><div class="eyebrow">Your study streak</div><div class="number" data-v102-streak-number>0</div><div class="copy">Keep the chain alive — one focused session today.</div></div><div class="flame" aria-hidden="true">🔥</div></div><div class="week"><div class="day">M<div class="dot"></div></div><div class="day">T<div class="dot"></div></div><div class="day">W<div class="dot"></div></div><div class="day">T<div class="dot"></div></div><div class="day">F<div class="dot"></div></div><div class="day">S<div class="dot"></div></div><div class="day">S<div class="dot on"></div></div></div>';
    const state=window.state||window.QB?.state||null;\n    try{\n      const tests=(state&&state.tests)||[];\n      const sessions=tests.map(x=>x.createdAt).filter(Boolean).map(x=>new Date(x).toDateString());\n      const days=new Set(sessions);\n      let streak=0,d=new Date();\n      while(days.has(d.toDateString())){streak++;d.setDate(d.getDate()-1)}\n      streak=Math.max(streak,0);\n      streak.querySelector;\n      streak;\n    }catch(e){}\n    const n=streak.querySelector('[data-v102-streak-number]');\n    let value=0; try{ const tests=(window.state&&window.state.tests)||[]; const days=new Set(tests.map(x=>x.createdAt).filter(Boolean).map(x=>new Date(x).toDateString())); let d=new Date(); while(days.has(d.toDateString())){value++;d.setDate(d.getDate()-1)} }catch(e){}\n    n.textContent=String(value);\n    page.insertBefore(streak,page.querySelector('.page-head')?.nextElementSibling||page.firstChild);\n  }\n  const mo=new MutationObserver(inject); mo.observe(document.body,{subtree:true,childList:true});\n  setTimeout(inject,250); setTimeout(inject,1000);\n})();\n</script>\n'''
          # Correct a harmless variable-shadowing typo in the generated dashboard layer before insertion.
          dashboard=dashboard.replace("      streak.querySelector;\n      streak;\n","")
          if 'id="v102-dashboard-layer"' not in s:
              s=s.replace('</body>',dashboard+'</body>',1)

          # Haptic guard after all transformations.
          if s.count(haptic)!=h0 or s.count('navigator.vibrate')!=v0:
              raise SystemExit('FAIL: haptic/vibration implementation changed')
          if 'id="v102-visual-system"' not in s or 'id="v102-core-behavior"' not in s:
              raise SystemExit('FAIL: V10.2 markers missing')
          if 'sourceTestId:testId' not in s:
              raise SystemExit('FAIL: exact review test marker missing')

          p.write_text(s,encoding='utf-8')
          print(f'V10.2 source changed: {len(original)} -> {len(s)} chars')
          print('PASS: Review exact-test wiring, practice auto-submit, dead-control cleanup, streak/dashboard layer, and 2026 visual system')
          PY

      - name: Static V10.2 acceptance checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'review exact test id':'sourceTestId:testId' in s,
            'Review Solutions label':'Review Solutions' in s,
            'practice auto submit':'oldSubmit();' in s,
            'practice submit UI removed':'t===\'submit\' || t===\'submit answer\'' in s,
            'previous navigation':'window.QB.prevQ()' in s,
            'next navigation':'window.QB.nextQ()' in s,
            'streak UI':'v102-streak' in s,
            '2026 visual system':'v102-visual-system' in s,
            'no haptic rewrite':s.count("function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }")==1,
          }
          for k,v in checks.items(): print(k+': '+('PASS' if v else 'FAIL'))
          if not all(checks.values()): raise SystemExit(1)
          Path('v102_acceptance.txt').write_text('\n'.join(f'{k}: {v}' for k,v in checks.items()),encoding='utf-8')
          PY

      - name: Build V10.2 debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload acceptance report
        uses: actions/upload-artifact@v4
        with:
          name: V10.2-acceptance-report
          path: v102_acceptance.txt
          if-no-files-found: error

      - name: Upload V10.2 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: V10.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit V10.2 overhaul
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then echo 'No source changes to commit.'; else git commit -m 'V10.2 core UX and visual overhaul'; git push origin main; fi
