name: V10.2 source normalization

# One-time source repair + JavaScript syntax gate for V10.2 generated UX blocks.
on:
  push:
    branches: [v10.2]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 0

      - name: Normalize generated UX blocks
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          blocks=list(re.finditer(r'<(?:script|style)\s+id="v102-[^"]+"[^>]*>.*?</(?:script|style)>',s,re.S))
          changed=0
          out=[]; last=0
          for m in blocks:
              out.append(s[last:m.start()])
              block=m.group(0)
              if '\\n' in block:
                  block=block.replace('\\n','\n')
                  changed += 1
              out.append(block)
              last=m.end()
          out.append(s[last:])
          s=''.join(out)
          s=s.replace('\\n<script id="v102-', '\n<script id="v102-')
          s=s.replace('\\n<style id="v102-', '\n<style id="v102-')
          if s!=original:
              p.write_text(s,encoding='utf-8')
          print('Normalized blocks:', changed)
          print('Remaining escaped v102 tag separators:', s.count('\\n<script id="v102-') + s.count('\\n<style id="v102-'))

      - name: Validate generated UX JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert '\\n<script id="v102-' not in s
          assert '\\n<style id="v102-' not in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          checked=0
          for i,body in enumerate(scripts):
              body=body.strip()
              if not body: continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); name=f.name
              r=subprocess.run(['node','--check',name],text=True,capture_output=True)
              if r.returncode!=0:
                  print(r.stderr)
                  raise SystemExit(f'JavaScript syntax failure in script #{i}')
              checked+=1
          print(f'Validated JavaScript syntax for {checked} inline scripts')
          PY

      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'No source change to commit'
          else
            git commit -m 'Normalize V10.2 injected UX source'
            git push origin HEAD:v10.2
          fi
