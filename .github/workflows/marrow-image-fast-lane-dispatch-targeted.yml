name: One-shot Fast-Lane Targeted QA Dispatcher

# Trigger once, delete this file, then dispatch QA on the pushed exact head.
on:
  push:
    branches: ['manual/marrow-physiology-fastlane-20260912-b02']
    paths:
      - '.github/workflows/marrow-image-fast-lane-dispatch-targeted.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify ownership, remove dispatcher, and push exact target head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/marrow-canonical-full-current
          test "$(git rev-parse origin/feature/marrow-canonical-full-current)" = "700cde07869068a7d3aadf77dc89d7bd85726530"
          test -f data/marrow/images/review_batches/MANUAL_FASTLANE_34700776495.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/marrow-image-fast-lane-dispatch-targeted.yml
          git commit -m "Remove one-shot targeted QA dispatcher"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Dispatch targeted learner gate on pushed head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Numankhan2013/V10.1/actions/workflows/marrow-image-fast-lane-gate.yml/dispatches \
            -d '{"ref":"manual/marrow-physiology-fastlane-20260912-b02","inputs":{"reviewed_plan":"data/marrow/images/review_batches/MANUAL_FASTLANE_34700776495.json"}}'
