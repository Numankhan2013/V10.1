name: Repair Biochemistry explanation inventory once
on:
  push:
    branches:
      - feature/marrow-explanations-biochem-20260922-ch12-q12-q14
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/marrow-explanations-biochem-20260922-ch12-q12-q14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical 2711-ID explanation inventory
        run: python3 tools/inventory_marrow_explanations.py --write
      - name: Remove one-time repair workflow and commit deterministic result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-biochem-inventory-once.yml
          git add data/marrow/explanation_inventory_v1.json
          git commit -m "Repair explanation inventory for Biochemistry Ch12 Q12-Q14"
          git push origin HEAD:feature/marrow-explanations-biochem-20260922-ch12-q12-q14
