name: Apply Marrow Content Sanitizer

on:
  push:
    branches: [feature/marrow-content-sanitizer-20260912]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v5
        with:
          ref: feature/marrow-content-sanitizer-20260912
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Apply conservative learner-text sanitizer
        run: python3 tools/apply_question_content_hygiene_v1.py

      - name: Run focused sanitation regressions
        run: |
          python3 tools/test_question_content_hygiene_v1.py
          python3 tools/test_marrow_bank_pilot.py --data-only
          python3 tools/test_marrow_topic_taxonomy.py
          python3 tools/verify_product_contract.py --stage source
          git diff --check

      - name: Commit generated app shell
        run: |
          if git diff --quiet -- app/src/main/assets/index.html; then
            echo 'Sanitizer produced no generated-app diff' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git commit -m 'Apply generated Marrow content sanitizer [skip ci]'
          git push origin HEAD:feature/marrow-content-sanitizer-20260912
