name: Biochemistry Q26 Integrate Once

on:
  push:
    branches:
      - automation/marrow-images-biochemistry-coverage-20260912-q26

permissions:
  contents: write

concurrency:
  group: marrow-image-writer
  cancel-in-progress: false

jobs:
  integrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Integrate Biochemistry Q26 source figure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact specialist branch
        uses: actions/checkout@v5
        with:
          ref: automation/marrow-images-biochemistry-coverage-20260912-q26
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image/PDF dependencies
        run: python3 -m pip install --disable-pip-version-check PyMuPDF Pillow pypdf==6.18.0
      - name: Re-read canonical ownership and fingerprints
        run: |
          git fetch origin feature/marrow-canonical-full-current
          CANON=$(git rev-parse origin/feature/marrow-canonical-full-current)
          BASE=$(git merge-base HEAD origin/feature/marrow-canonical-full-current)
          echo "canonical=$CANON merge_base=$BASE"
          test "$CANON" = "72fa0b6a921015c2e35addaccf06c1949d938f35"
          test "$BASE" = "$CANON"
          test "$(git rev-parse HEAD:data/marrow/images/registry.json)" = "$(git rev-parse origin/feature/marrow-canonical-full-current:data/marrow/images/registry.json)"
          test "$(git rev-parse HEAD:data/marrow/images/progress.json)" = "$(git rev-parse origin/feature/marrow-canonical-full-current:data/marrow/images/progress.json)"
          grep -q 'Next deterministic image reference.*marrow__BIOCHEM_CH02_Q026' .project-memory/STATE.md
          grep -q 'image writer lane is released' .project-memory/STATE.md
          python3 tools/verify_project_memory.py
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
      - name: Recompute authoritative pre-mutation coverage
        run: |
          python3 tools/marrow_images.py audit
          python3 tools/marrow_image_coverage.py --subject Biochemistry
          python3 tools/marrow_image_coverage.py --subject Biochemistry --check
          python3 - <<'PY'
          import json
          c=json.load(open('data/marrow/images/coverage.json'))
          s=c['summary']['Biochemistry']
          assert s['sourceVisualReferences']==110, s
          assert s['releasedSourceVisualReferences']==70, s
          pending=[r for r in c['sourceVisuals'] if r.get('subject')=='Biochemistry' and r.get('coverageStatus') in {'UNTRACKED_SOURCE_VISUAL','UNRELEASED_TRACKED'}]
          assert pending and pending[0]['id']=='marrow__BIOCHEM_CH02_Q026:figure:1', pending[:1]
          PY
      - name: Integrate source-reviewed Q26 native figure
        run: python3 tools/integrate_biochem_q26_recovery.py
      - name: Regenerate release progress and coverage
        run: |
          python3 tools/marrow_images.py validate
          python3 tools/marrow_images.py release
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_image_progress.py --check
          python3 tools/marrow_images.py audit
          python3 tools/marrow_image_coverage.py --subject Biochemistry
          python3 tools/marrow_image_coverage.py --subject Biochemistry --check
      - name: Update canonical handoff memory deterministically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          coverage = json.loads(Path('data/marrow/images/coverage.json').read_text())
          s = coverage['summary']['Biochemistry']
          assert s['releasedSourceVisualReferences'] == 71, s
          pending = [r for r in coverage['sourceVisuals'] if r.get('subject') == 'Biochemistry' and r.get('coverageStatus') in {'UNTRACKED_SOURCE_VISUAL','UNRELEASED_TRACKED'}]
          assert pending, 'Expected remaining Biochemistry image backlog'
          nxt = pending[0]
          next_desc = f"{nxt['id']} ({nxt.get('role')}, source pages {nxt.get('sourcePages')}, {nxt.get('coverageStatus')})"

          state_path = Path('.project-memory/STATE.md')
          state = state_path.read_text()
          replacement = f'''## Current image state / cautions\n\n- **Latest bounded image batch:** Biochemistry `NKQ_BIOCHEM_COVERAGE_Q26_20260912`, exact canonical base `72fa0b6a921015c2e35addaccf06c1949d938f35`, branch `automation/marrow-images-biochemistry-coverage-20260912-q26`.\n- Released `marrow__BIOCHEM_CH02_Q026:figure:1` as an explanation-only native JPEG from authoritative Biochemistry ED8 page 41, xref 92, region `[162.0,515.0,450.0,731.0]`; neighboring xref 91 is above the Q26 solution heading and excluded.\n- Direct source QA verified the hash-matched 7,958,177-byte PDF, full page ownership, native 960x540 JPEG, 390px phone preview and 768px expanded preview. Native/original/production SHA-256 is `22651a6eb0d53c783ebdaa8d967948ed3a88a2ef96669ed84c6788e18bf8645c`. No crop, reconstruction, generation, inpainting or sharpening was used.\n- Post-release coverage: **{s['sourceVisualReferences']} raw / {s['effectiveLearnerVisualReferences']} effective / {s['releasedSourceVisualReferences']} released / {s['invalidSourceMetadataReferences']} invalid-source-metadata / {s['resolvedSourceVisualReferences']} resolved / {s['trackedButUnreleasedReferences']} tracked-unreleased / {s['untrackedSourceVisualReferences']} untracked / {s['textCueReviewItems']} text-cue**. Subject remains **INCOMPLETE**.\n- **Next deterministic image reference:** `{next_desc}`. Do not skip it for an easier later reference.\n- This batch is source/static validated but the image writer lane remains locked to Biochemistry until exact-head Engineering + full Android/PWA/browser/APK/package verification succeeds and the verified handoff is reconciled into `feature/marrow-canonical-full-current`. Production promotion is prohibited.\n\n'''
          state2, n = re.subn(r'## Current image state / cautions\n.*?(?=## Current product handoff)', replacement, state, count=1, flags=re.S)
          assert n == 1
          state_path.write_text(state2)

          log = Path('.project-memory/SESSION_LOG.md')
          with log.open('a') as f:
              f.write(f'''\n## 2026-09-12 — Biochemistry Q26 coverage recovery\n- Canonical base: `72fa0b6a921015c2e35addaccf06c1949d938f35`; branch `automation/marrow-images-biochemistry-coverage-20260912-q26`.\n- Direct QA of hash-verified ED8 page 41 established xref 92 as the Q26 explanation-owned glycolysis/gluconeogenesis figure; xref 91 is the separate neighboring pyruvate-carboxylase figure above the Q26 solution and was excluded.\n- Released exact native 960x540 JPEG bytes SHA `22651a6eb0d53c783ebdaa8d967948ed3a88a2ef96669ed84c6788e18bf8645c`; no crop/reconstruction/generation/inpainting/sharpening.\n- Coverage after release: {s['releasedSourceVisualReferences']} released, {s['trackedButUnreleasedReferences']} tracked-unreleased, {s['untrackedSourceVisualReferences']} untracked, {s['invalidSourceMetadataReferences']} invalid metadata, {s['textCueReviewItems']} text-cue review items; subject incomplete.\n- Next deterministic reference: `{next_desc}`.\n- Production promotion prohibited; exact-head product CI still required before canonical reconciliation.\n''')

          roadmap = Path('.project-memory/ROADMAP.md')
          marker = '### Biochemistry image coverage recovery — Q26'
          rtxt = roadmap.read_text()
          if marker not in rtxt:
              roadmap.write_text(rtxt + f'''\n\n{marker}\n- Q26 native page-41 explanation figure released on the bounded specialist batch; Biochemistry remains incomplete at {s['resolvedSourceVisualReferences']}/{s['sourceVisualReferences']} raw references resolved, with {s['textCueReviewItems']} text-cue review items.\n- Continue strictly from `{next_desc}` after this batch is exact-head verified and reconciled into canonical.\n''')

          pipeline = Path('docs/MARROW_IMAGE_PIPELINE.md')
          marker2 = '## Canonical coverage recovery update — 2026-09-12 Q26'
          ptxt = pipeline.read_text()
          if marker2 not in ptxt:
              pipeline.write_text(ptxt + f'''\n\n{marker2}\n\nBiochemistry canonical coverage uses the complete 582-question corpus and source-reference denominator. After the Q26 page-41 native-xref-92 release, live coverage is {s['sourceVisualReferences']} raw / {s['effectiveLearnerVisualReferences']} effective / {s['releasedSourceVisualReferences']} released / {s['invalidSourceMetadataReferences']} invalid metadata / {s['trackedButUnreleasedReferences']} tracked-unreleased / {s['untrackedSourceVisualReferences']} untracked, plus {s['textCueReviewItems']} text-cue review items. Subject completeness remains false; next source-order work is `{next_desc}`.\n''')

          cp = Path('data/marrow/images/recovery_checkpoints/biochem_ch02_q026_20260912.json')
          obj = json.loads(cp.read_text())
          obj['status'] = 'RELEASE_VALIDATED_PENDING_FULL_CI'
          obj['postReleaseCoverage'] = s
          obj['nextDeterministicReference'] = nxt
          cp.write_text(json.dumps(obj, indent=2) + '\n')
          print('NEXT_DETERMINISTIC_REFERENCE', next_desc)
          print('POST_RELEASE_COVERAGE', json.dumps(s, sort_keys=True))
          PY
      - name: Run required source-level gates
        run: |
          git diff --check
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
          python3 tools/marrow_image_coverage.py --subject Biochemistry --check
          python3 tools/test_marrow_images.py
          python3 tools/test_marrow_image_coverage.py
          python3 tools/verify_build_pipeline.py
          python3 tools/verify_local.py
          python3 tools/verify_project_memory.py
      - name: Commit bounded release and remove one-shot machinery
        run: |
          rm -f tools/integrate_biochem_q26_recovery.py
          rm -f .github/workflows/biochem-q26-integrate-once.yml
          git config user.name "NK QBank Image Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "Integrate Biochemistry Q26 source figure"
          git push origin HEAD:automation/marrow-images-biochemistry-coverage-20260912-q26
