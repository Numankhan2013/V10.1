name: V10.3 review and explanation overlay
on:
  workflow_dispatch:
  push:
    branches: [v10.2-ui-overhaul]
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-ui-overhaul
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply V10.3 review and explanation overlay
        run: python tools/v103_review_explanation_overlay.py
      - name: Validate overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text()
          assert 'V103_REVIEW_EXPLANATION_OVERLAY' in s
          assert 'window.QB.reviewTest=function' in s
          assert 'QB_V103_EXPLANATION' in s
          print('V10.3 overlay markers OK')
          PY
      - name: Commit overlay
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html tools/v103_review_explanation_overlay.py
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'V10.3 harden review and explanation readability'
          git push origin HEAD:v10.2-ui-overhaul
