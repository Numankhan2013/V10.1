name: NK QBank Engineering Gate

on:
  workflow_dispatch:
  push:
    branches: [main, 'consolidation/**', v11.1-engineering-foundation, v11.2-study-clarity, v11.3-question-experience, v11.4-whole-app-vision, v11.5-custom-study-modules, v11.6-content-quality, v11.7-cross-device-pwa-sync, 'feature/home-*', feature/marrow-bank-pilot, feature/marrow-canonical-full-current]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Verify project memory
        run: python3 tools/verify_project_memory.py
      - name: Test local and CI verification preflight
        run: python3 tools/test_verification_preflight.py
      - name: Compile Python tooling
        run: python3 -m compileall -q tools
      - name: Test study metrics behavior
        run: python3 tools/test_study_metrics.py
      - name: Test Custom Study Modules behavior
        run: python3 tools/test_custom_study_modules_v1.py
      - name: Test Home Today’s Focus command center
        run: python3 tools/test_home_command_center_v1.py
      - name: Test cross-device merge and PWA contracts
        run: python3 tools/test_cross_device_sync_v1.py
      - name: Test FSRS scheduler and queue contracts
        run: python3 tools/test_fsrs_v1.py
      - name: Validate Marrow pilot source bundle
        run: python3 tools/test_marrow_bank_pilot.py --data-only
      - name: Validate Marrow image registry, bindings, and progress
        run: python3 tools/test_marrow_images.py
      - name: Validate Marrow image source-coverage accounting
        run: python3 tools/test_marrow_image_coverage.py
      - name: Install Marrow PDF audit dependency
        run: python3 -m pip install pypdf==6.18.0
      - name: Compute authoritative Marrow visual coverage
        run: |
          python3 tools/marrow_images.py audit
          python3 tools/marrow_image_coverage.py --subject Anatomy
          python3 tools/marrow_image_coverage.py --subject Biochemistry
          python3 tools/marrow_image_coverage.py --subject Physiology
      - name: Validate explicit Marrow topic taxonomy
        run: python3 tools/test_marrow_topic_taxonomy.py
      - name: Validate Marrow explanation inventory
        run: python3 tools/test_marrow_explanation_inventory.py
      - name: Validate Marrow Biochemistry explanation gold sample
        run: python3 tools/test_marrow_biochem_explanation_sample.py
      - name: Validate Marrow Biochemistry explanation rollout
        run: python3 tools/test_marrow_biochem_explanation_rollout.py
      - name: Validate Marrow Physiology explanation rollout
        run: python3 tools/test_marrow_physio_explanation_rollout.py
      - name: Test question content hygiene behavior
        run: python3 tools/test_question_content_hygiene_v1.py
      - name: Verify source product contract
        run: python3 tools/verify_product_contract.py --stage source
      - name: Verify deterministic build pipeline
        run: python3 tools/verify_build_pipeline.py
