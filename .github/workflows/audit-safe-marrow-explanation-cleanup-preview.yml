name: Audit safe Marrow explanation cleanup preview

on:
  push:
    branches:
      - fix/marrow-full-content-cleanup-20260913
    paths:
      - tools/audit_safe_marrow_explanation_cleanup_preview.py
      - data/marrow/explanation_cleanup_auto_review/**
      - data/marrow/content_audit_effective/**
      - tools/find_marrow_visible_debris.py
      - tools/split_marrow_debris_review.py
      - .github/workflows/audit-safe-marrow-explanation-cleanup-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run inert safe-cleanup preview
        run: python tools/audit_safe_marrow_explanation_cleanup_preview.py
      - name: Verify preview is inert
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/marrow/explanation_cleanup_auto_review')
          summary=json.loads((root/'preview_summary.json').read_text())
          assert summary['active'] is False
          assert summary['previewOnly'] is True
          assert summary['safeCleanupQuestionsApplied'] > 0
          index=json.loads((root/'preview_residual_index.json').read_text())
          assert index['active'] is False and index['previewOnly'] is True
          print('SAFE_MARROW_EXPLANATION_PREVIEW_INERT_OK', summary)
          PY
      - name: Commit compact preview reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982154+github-actions[bot]@users.noreply.github.com"
          git add data/marrow/explanation_cleanup_auto_review/preview_summary.json \
                  data/marrow/explanation_cleanup_auto_review/preview_residual_index.json
          if git diff --cached --quiet; then
            echo "Preview reports already current."
            exit 0
          fi
          git commit -m "Refresh safe explanation cleanup preview [skip ci]"
          git fetch origin fix/marrow-full-content-cleanup-20260913
          git rebase origin/fix/marrow-full-content-cleanup-20260913
          git push origin HEAD:fix/marrow-full-content-cleanup-20260913
