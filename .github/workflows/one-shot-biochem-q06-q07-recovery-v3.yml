name: One-shot Biochemistry Q6-Q7 canonical coverage recovery v3

on:
  push:
    branches:
      - automation/marrow-images-biochemistry-coverage-20260912-q06-q07-v3

permissions:
  contents: write

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[q06-q07-v3-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/marrow-images-biochemistry-coverage-20260912-q06-q07-v3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install pypdf==6.18.0 pillow
      - name: Reconfirm canonical coverage order and source fidelity
        run: |
          python3 tools/marrow_images.py audit
          python3 tools/marrow_image_coverage.py --subject Biochemistry
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from PIL import Image,ImageChops,ImageStat
          import hashlib,io,json
          pdf=Path('data/marrow/source_pdfs/biochemistryed8.pdf')
          assert pdf.stat().st_size==7958177
          assert hashlib.sha256(pdf.read_bytes()).hexdigest()=='463cb586aa18b702243d2467b4ad1f7fb24537d7ae73388607421516660643eb'
          coverage=json.load(open('data/marrow/images/coverage.json'))
          rows=[r for r in coverage['sourceVisuals'] if r['subject']=='Biochemistry' and r['coverageStatus'] in {'UNTRACKED_SOURCE_VISUAL','UNRELEASED_TRACKED'}]
          assert [r['id'] for r in rows[:3]]==['marrow__BIOCHEM_CH02_Q006:figure:1','marrow__BIOCHEM_CH02_Q007:figure:1','marrow__BIOCHEM_CH02_Q021:figure:1'],rows[:3]
          page=PdfReader(str(pdf)).pages[30]
          objs=page['/Resources']['/XObject']
          by={r.idnum:r.get_object() for r in objs.values() if r.get_object().get('/Subtype')=='/Image'}
          a,b=by[1126],by[1125]
          assert (int(a['/Width']),int(a['/Height']))==(600,450)==(int(b['/Width']),int(b['/Height']))
          ia=Image.open(io.BytesIO(a._data)).convert('RGB'); ib=Image.open(io.BytesIO(b._data)).convert('RGB')
          diff=ImageStat.Stat(ImageChops.difference(ia,ib)).mean
          assert max(diff)<2.0,diff
          registry=json.load(open('data/marrow/images/registry.json'))
          matches=[]
          for asset in registry['assets']:
              if asset.get('subject')!='Biochemistry' or asset.get('status')!='PASS' or asset.get('method')!='svg-reconstruction': continue
              if asset.get('production',{}).get('sha256')!='e6b4d76fa9ff07dbf62b5094b8fdcd46a744837bb802aa55945ac7021f6fa8e2': continue
              if not asset.get('qa',{}).get('sourceCompared'): continue
              if any(x.get('questionId')=='marrow__BIOCHEM_CH02_Q013' and x.get('role')=='explanation' and x.get('status',asset['status'])=='PASS' for x in asset.get('bindings',[])):
                  matches.append(asset)
          assert len(matches)==1,[m.get('id') for m in matches]
          assert matches[0]['id']=='biochemistry-aa11f9fa6a08baea'
          print('Q06_Q07_REUSE_ASSET_OK',matches[0]['id'],'pixel_mean_diff=',diff)
          PY
      - name: Add independently reviewed Q6-Q7 bindings and release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path('data/marrow/images/registry.json')
          value=json.loads(path.read_text())
          asset=next(a for a in value['assets'] if a.get('id')=='biochemistry-aa11f9fa6a08baea')
          assert asset.get('status')=='PASS' and asset.get('method')=='svg-reconstruction'
          assert asset.get('production',{}).get('sha256')=='e6b4d76fa9ff07dbf62b5094b8fdcd46a744837bb802aa55945ac7021f6fa8e2'
          existing={b['questionId'] for b in asset['bindings']}
          assert 'marrow__BIOCHEM_CH02_Q006' not in existing and 'marrow__BIOCHEM_CH02_Q007' not in existing
          batch='NKQ_BIOCHEM_COVERAGE_Q06_Q07_20260912_V3'
          asset['bindings'] += [
            {'questionId':'marrow__BIOCHEM_CH02_Q006','role':'explanation','order':1,'alt':'Glycolysis pathway diagram','status':'PASS','reviewBatch':batch,
             'qa':{'sourceCompared':True,'notes':'Authoritative page 31 places native xref 1126 directly inside Solution to Q6. Fresh native-pixel comparison against page-31 xref 1125 shows the same complete glycolysis pathway with only minor JPEG compression differences; the already PASS source-faithful reconstruction preserves all metabolites, enzyme labels, ATP/ADP and NAD+/NADH+H+ relationships, reversible arrows and irreversible-step markings. Explanation-only timing is answer-safe.','evidence':'Marrow ED8 Biochemistry page 31 / xref 1126 / native 600x450 source comparison performed in canonical recovery CI on 2026-09-12.'},
             'source':{'page':31,'xref':1126,'region':[162.0,110.0,450.0,326.16]}},
            {'questionId':'marrow__BIOCHEM_CH02_Q007','role':'explanation','order':1,'alt':'Glycolysis pathway diagram','status':'PASS','reviewBatch':batch,
             'qa':{'sourceCompared':True,'notes':'Authoritative page 31 places native xref 1125 directly inside Solution to Q7. This exact source object is semantically and visually matched to the already PASS source-faithful glycolysis reconstruction. Explanation-only placement preserves answer timing and pathway semantics.','evidence':'Marrow ED8 Biochemistry page 31 / xref 1125 / region [162,512.976,450,729.136] plus existing independently approved glycolysis asset QA, rechecked 2026-09-12.'},
             'source':{'page':31,'xref':1125,'region':[162.0,512.976,450.0,729.136]}}
          ]
          path.write_text(json.dumps(value,indent=2)+'\n')
          print('Q06_Q07_BINDINGS_STAGED',asset['id'])
          PY
          python3 tools/marrow_images.py validate
          python3 tools/marrow_images.py release
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_images.py audit
          python3 tools/marrow_image_coverage.py --subject Biochemistry
          python3 tools/marrow_image_progress.py --check
          python3 tools/marrow_image_coverage.py --subject Biochemistry --check
      - name: Update canonical handoff memory and verify source-level gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          cov=json.load(open('data/marrow/images/coverage.json'))
          s=cov['summary']['Biochemistry']
          unresolved=[r for r in cov['sourceVisuals'] if r['subject']=='Biochemistry' and r['coverageStatus'] in {'UNTRACKED_SOURCE_VISUAL','UNRELEASED_TRACKED'}]
          assert unresolved and unresolved[0]['id']=='marrow__BIOCHEM_CH02_Q021:figure:1',unresolved[:3]
          n=unresolved[0]
          next_text=f"`{n['id']}` ({n['role']}, source pages {n['sourcePages']}, {n['coverageStatus']})"
          state=Path('.project-memory/STATE.md'); text=state.read_text()
          a=text.index('## Current image state / cautions'); b=text.index('## Current product handoff — Continue Practice')
          section=f'''## Current image state / cautions\n\n- **Image lane owner:** Biochemistry `NKQ_BIOCHEM_COVERAGE_Q06_Q07_20260912_V3`, branch `automation/marrow-images-biochemistry-coverage-20260912-q06-q07-v3`, exact canonical base `e17b622b238280c127cd7c91a420dee82bdafdd9`; **CURRENT_UNVERIFIED** pending exact-head full CI.\n- Candidate released bindings: `marrow__BIOCHEM_CH02_Q006:figure:1` (page 31 / xref 1126) and `marrow__BIOCHEM_CH02_Q007:figure:1` (page 31 / xref 1125), both explanation-only and independently source-compared to existing PASS asset `biochemistry-aa11f9fa6a08baea` / production SHA `e6b4d76f…`. No new production asset or medical pixels were generated.\n- Candidate coverage: **{s['sourceVisualReferences']} raw / {s['effectiveLearnerVisualReferences']} effective / {s['releasedSourceVisualReferences']} released / {s['invalidSourceMetadataReferences']} invalid / {s['resolvedSourceVisualReferences']} resolved / {s['trackedButUnreleasedReferences']} tracked-unreleased / {s['untrackedSourceVisualReferences']} untracked / {s['textCueReviewItems']} text-cue**; Biochemistry remains **INCOMPLETE**.\n- Next deterministic unresolved reference: {next_text}. It is composite/multi-object and must not be skipped for an easier later JPEG.\n- Historical image branches are evidence only; Physiology remains paused; production promotion is prohibited.\n\n'''
          state.write_text(text[:a]+section+text[b:])
          with Path('.project-memory/SESSION_LOG.md').open('a',encoding='utf-8') as f:
              f.write(f'''\n\n## 2026-09-12 — Biochemistry Ch2 Q6/Q7 canonical image coverage candidate\n\n- Started `NKQ_BIOCHEM_COVERAGE_Q06_Q07_20260912_V3` from exact canonical SHA `e17b622b238280c127cd7c91a420dee82bdafdd9`.\n- Recovered Q6 page 31/xref 1126/region `[162,110,450,326.16]` and Q7 page 31/xref 1125/region `[162,512.976,450,729.136]`. Both 600x450 native figures were source-compared; Q7 is the exact source represented by the existing PASS reconstruction and Q6 differs only by minor JPEG compression while preserving identical pathway semantics.\n- Reused existing PASS asset `biochemistry-aa11f9fa6a08baea` by independent per-binding provenance; no duplicate asset was created.\n- Candidate coverage: {s['sourceVisualReferences']} raw / {s['effectiveLearnerVisualReferences']} effective / {s['releasedSourceVisualReferences']} released / {s['invalidSourceMetadataReferences']} invalid / {s['resolvedSourceVisualReferences']} resolved / {s['trackedButUnreleasedReferences']} tracked-unreleased / {s['untrackedSourceVisualReferences']} untracked / {s['textCueReviewItems']} text-cue. Subject remains INCOMPLETE.\n- Next deterministic unresolved reference: {next_text}. Exact-head full CI still required; no main or production promotion.\n''')
          print('Q06_Q07_MEMORY_UPDATED',next_text)
          PY
          rm -f data/marrow/images/coverage.json
          rm -f .github/workflows/one-shot-biochem-q06-q07-recovery-v3.yml
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
          python3 tools/test_marrow_images.py
          python3 tools/test_marrow_image_coverage.py
          python3 tools/verify_build_pipeline.py
          python3 tools/verify_project_memory.py
          git diff --check
      - name: Commit recovery candidate
        run: |
          git config user.name 'Numankhan2013'
          git config user.email '124483154+Numankhan2013@users.noreply.github.com'
          git add -A
          git commit -m 'Recover Biochemistry Ch2 Q6-Q7 source figures [q06-q07-v3-done]'
          git push origin HEAD:automation/marrow-images-biochemistry-coverage-20260912-q06-q07-v3
