name: Marrow Anatomy Automation Finalize
on:
  push:
    branches: [automation/marrow-images-anatomy-NKQ_ANATOMY_20260910]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install audit dependency
        run: python3 -m pip install --disable-pip-version-check pypdf==6.18.0
      - name: Update mandatory project memory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          state=Path('.project-memory/STATE.md')
          s=state.read_text()
          marker='## Known problems / verification cautions'
          block='''## Anatomy image automation checkpoint — NKQ_ANATOMY_20260910\n\n- Candidate branch: `automation/marrow-images-anatomy-NKQ_ANATOMY_20260910`, based exactly on image integration base `20161bbeac6440ac93ddff7ca55e08f9c5be4909`.\n- Six Anatomy Chapter 9 native candidates were staged and source-page compared: `marrow__ANAT_CH09_Q005`, Q008, Q009, Q010, Q012, Q013. Assets: `anatomy-d3f9220198201a07`, `anatomy-3baaad0ddf8e32e3`, `anatomy-267154fe7beac514`, `anatomy-1ea13802a456a2f9`, `anatomy-390f89119b18e515`, `anatomy-e0c1ff1656105c71`.\n- All six remain `REVIEW_REQUIRED`; none is released. Q5 is an educational diagram; Q8/Q9/Q10 are authentic labelled gross-brain specimens and Q12/Q13 are authentic clinical photographs, all preserved as native JPEG bytes.\n- Source ownership is supported by direct source-page placement, but phone/expanded learner-view readability, question/explanation timing, and final packaged-byte/browser QA have not been completed. Resume this exact held batch before selecting further Anatomy candidates.\n- Registry checkpoint totals: 156 assets, 198 bindings, still 166 released bindings / 152 released questions; Anatomy remains 58 released questions.\n\n'''
          if '## Anatomy image automation checkpoint — NKQ_ANATOMY_20260910' not in s:
              s=s.replace(marker,block+marker)
              state.write_text(s)
          log=Path('.project-memory/SESSION_LOG.md')
          entry='''\n\n## 2026-09-10 — Anatomy image automation safe checkpoint NKQ_ANATOMY_20260910\n\n- Read the complete image automation runbook and all mandatory repository documents before editing. Single-writer preflight found no competing image-integration branch; CI rechecked the exact integration-base SHA and registry blob before staging.\n- Created `automation/marrow-images-anatomy-NKQ_ANATOMY_20260910` from `20161bbeac6440ac93ddff7ca55e08f9c5be4909`. Added a backward-compatible `--subject` filter to `stage_marrow_image_review.py` so automation staging can be Anatomy-only.\n- Deterministically staged six Chapter 9 native JPEG candidates: Q005 / asset `anatomy-d3f9220198201a07` (brain-flexure diagram, p154/xref405); Q008 / `anatomy-3baaad0ddf8e32e3` (labelled gross-brain specimen, p156/xref3533); Q009 / `anatomy-267154fe7beac514` (question-time axial brain specimen, p148/xref389); Q010 / `anatomy-1ea13802a456a2f9` (septum-pellucidum gross-brain specimen, p157/xref413); Q012 / `anatomy-390f89119b18e515` (question-time encephalocele clinical photo, p149/xref392); Q013 / `anatomy-e0c1ff1656105c71` (question-time anencephaly clinical photo, p150/xref395).\n- Source-page/native-candidate comparisons support ownership and were recorded with concrete QA notes. Medical/specimen/clinical images remain authentic native bytes. No reconstruction or processing was performed.\n- All six assets and bindings remain `REVIEW_REQUIRED` because phone/expanded learner display, answer-timing behavior and packaged/browser visual QA have not yet been completed. No runtime release, main merge, or production promotion occurred.\n- Staged progress: 156 assets total (145 PASS, 2 SOURCE_LIMITED, 7 REVIEW_REQUIRED, 2 REJECTED), 198 bindings with 7 pending; released totals unchanged at 166 bindings / 152 questions, Anatomy 58 released questions.\n- Review evidence artifact from staging run 34398425559: `marrow-anatomy-NKQ_ANATOMY_20260910-review`. Resume by reviewing these six held items in generated phone + expanded views before considering PASS; do not select a seventh Anatomy candidate until this batch is resolved.\n'''
          text=log.read_text()
          if '## 2026-09-10 — Anatomy image automation safe checkpoint NKQ_ANATOMY_20260910' not in text:
              log.write_text(text+entry)
          PY
      - name: Remove one-shot workflow before final diff
        run: rm .github/workflows/marrow-anatomy-automation-finalize.yml
      - name: Required image and regression gates
        run: |
          git diff --check origin/feature/marrow-image-rollout-current...HEAD
          git diff --check
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_image_progress.py --check
          python3 tools/test_marrow_images.py
          python3 tools/verify_build_pipeline.py
          python3 tools/verify_local.py
          python3 tools/verify_project_memory.py
      - name: Inspect final scope and commit checkpoint
        run: |
          git status --short
          git diff --stat origin/feature/marrow-image-rollout-current...HEAD
          git config user.name nk-qbank-automation
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "Checkpoint Anatomy image batch NKQ_ANATOMY_20260910"
          git push origin HEAD
