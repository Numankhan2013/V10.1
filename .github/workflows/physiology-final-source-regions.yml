name: Render reviewed final Physiology source regions
on:
  push:
    branches: ['integration/remaining-source-images-20260930']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: physiology-final-source-regions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrate-reviewed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source extraction dependencies
        run: python3 -m pip install pypdf==6.18.0 PyMuPDF Pillow
      - name: Render only directly reviewed source regions and package bindings
        run: |
          python3 tools/apply_phys_final_source_review.py
          python3 tools/marrow_images.py audit
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_image_coverage.py
          python3 tools/marrow_images.py release
          python3 tools/marrow_image_progress.py --check
          python3 tools/marrow_image_coverage.py --check
          python3 tools/test_marrow_image_coverage.py
          git diff --check
      - name: Checkpoint exact source-generated images
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/marrow/images/registry.json data/marrow/images/originals data/marrow/images/progress.json data/marrow/images/coverage.json app/src/main/assets/marrow_visuals app/src/main/assets/marrow_visual_metadata.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate all source-reviewed final Physiology images'
          git push origin "HEAD:${BRANCH_NAME}"
