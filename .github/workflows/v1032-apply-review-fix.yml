name: V10.3.2 Apply Review Fix
on:
  workflow_dispatch:
  push:
    branches: [v10.2-ui-overhaul]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.2-ui-overhaul
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply V10.3.2 patch
        run: python tools/v1032_review_fix.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          required=['V1032_REVIEW_FIX','v1032-review-fix-script','qbank_state_v1','mode==='"'"'review'"'"'']
          missing=[x for x in required if x not in s]
          assert not missing, missing
          for i,src in enumerate(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)):
              if not src.strip(): continue
              p=Path(tempfile.gettempdir())/f'qbank-v1032-{i}.js';p.write_text(src)
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              assert r.returncode==0, r.stderr
          print('V10.3.2 review patch + inline JS syntax OK')
          PY
      - name: Commit applied patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html tools/v1032_review_fix.py
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'chore: apply V10.3.2 review fix [skip ci]'
          git push origin HEAD:v10.2-ui-overhaul
