name: V10.3.2 Apply Review Fix

on:
  workflow_dispatch:
  push:
    branches: [v10.3.2-review-fix]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V10.3.2 patch
        run: python3 tools/v1032_review_fix.py

      - name: Commit injected patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: apply V10.3.2 review fix [skip ci]"
          git push
