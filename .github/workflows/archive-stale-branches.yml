name: Archive stale branches

# One-off cleanup. Every branch outside KEEP is removed: branches already merged
# into main are deleted, and the rest are first preserved as archive/<branch>
# tags so they can be restored with `git push origin archive/<b>:refs/heads/<b>`.
# Delete this workflow once it has run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type archive-and-delete to apply; anything else is a dry run
        required: false
        default: dry-run

permissions:
  contents: write

concurrency:
  group: archive-stale-branches
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      KEEP: main feature/home-v12-redesign feature/no-answer-banner feature/rarity-tiers wip/bake-source wip/geist-verifiers
      APPLY: ${{ inputs.confirm == 'archive-and-delete' }}
    steps:
      - name: Check out main with every branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - name: Archive and delete
        run: |
          set -eu
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          merged=() archived=()
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            [ "$ref" = HEAD ] && continue
            case " $KEEP " in *" $ref "*) continue ;; esac
            if git merge-base --is-ancestor "origin/$ref" origin/main; then
              merged+=("$ref")
            else
              git tag -f "archive/$ref" "origin/$ref" >/dev/null
              archived+=("$ref")
            fi
          done
          echo "Merged into main (delete): ${#merged[@]}"; printf '  %s\n' "${merged[@]}"
          echo "Not merged (tag archive/<b>, then delete): ${#archived[@]}"; printf '  %s\n' "${archived[@]}"
          if [ "$APPLY" != true ]; then echo 'Dry run: nothing pushed.'; exit 0; fi
          for b in "${archived[@]}"; do git push --quiet origin "refs/tags/archive/$b"; done
          for b in "${archived[@]}"; do
            test "$(git ls-remote origin "refs/tags/archive/$b" | cut -f1)" = "$(git rev-parse "origin/$b")"
          done
          for b in "${merged[@]}" "${archived[@]}"; do git push --quiet origin --delete "$b"; done
          echo "Remaining branches:"; git ls-remote --heads origin | sed 's#.*refs/heads/#  #'
