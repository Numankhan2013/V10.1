name: Marrow Anatomy Automation QA Checkpoint
on:
  push:
    branches: [automation/marrow-images-anatomy-NKQ_ANATOMY_20260910]
permissions:
  contents: write
jobs:
  checkpoint:
    if: ${{ !contains(github.event.head_commit.message, '[qa-recorded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record source-comparison findings without release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/marrow/images/registry.json')
          v=json.loads(p.read_text())
          findings={
            'anatomy-d3f9220198201a07':('diagram','Native brain-flexure diagram matches the owning Q5 explanation on source page 154: telencephalic, cephalic, pontine and cervical flexures plus telencephalon/diencephalon/mesencephalon/metencephalon/myelencephalon/spinal-cord labels are present and readable in the extracted candidate. Ownership is supported by the figure occurring inside the Q5 solution. Final phone/expanded app readability and timing remain unverified, so held REVIEW_REQUIRED.'),
            'anatomy-3baaad0ddf8e32e3':('medical','Native labelled gross-brain specimen image matches the Q8 commissural-fibres explanation on source page 156 and identifies anterior/posterior commissures, corpus callosum and related landmarks. Authentic source pixels are preserved. Final phone/expanded app readability and timing remain unverified, so held REVIEW_REQUIRED.'),
            'anatomy-267154fe7beac514':('medical','Native labelled axial brain specimen is embedded directly in Q9 on source page 148; the green A marker points to the midline corpus-callosum region and the same image carries left/right hemisphere, choroid plexus and lateral-ventricle labels. Authentic source pixels are preserved. Question-time neutral presentation plus phone/expanded readability remain unverified, so held REVIEW_REQUIRED.'),
            'anatomy-1ea13802a456a2f9':('medical','Native labelled gross-brain specimen matches the Q10 septum-pellucidum solution on source page 157; corpus callosum, septum pellucidum, fornix and adjacent landmarks are preserved. Authentic source pixels are preserved. Final phone/expanded app readability and explanation timing remain unverified, so held REVIEW_REQUIRED.'),
            'anatomy-390f89119b18e515':('medical','Native clinical photograph is embedded directly in Q12 on source page 149 and depicts the newborn occipital mass used for the encephalocele identification question. Authentic clinical pixels are preserved byte-for-byte by native extraction. Question-time neutral presentation and phone/expanded app QA remain unverified, so held REVIEW_REQUIRED.'),
            'anatomy-e0c1ff1656105c71':('medical','Native clinical photograph is embedded directly in Q13 on source page 150 and depicts the cranial defect used for the anencephaly identification question. Authentic clinical pixels are preserved byte-for-byte by native extraction. Question-time neutral presentation and phone/expanded app QA remain unverified, so held REVIEW_REQUIRED.'),
          }
          for a in v['assets']:
            if a['id'] not in findings: continue
            kind,note=findings[a['id']]
            a['kind']=kind
            a['status']='REVIEW_REQUIRED'
            a.setdefault('qa',{})['sourceCompared']=True
            a['qa']['notes']=note
            a['qa']['evidence']='Automation run NKQ_ANATOMY_20260910 source-page/native-candidate comparison artifact; visual inspection 2026-09-10.'
            for b in a['bindings']:
              if b.get('reviewBatch')!='NKQ_ANATOMY_20260910': continue
              b['status']='REVIEW_REQUIRED'
              b.setdefault('qa',{})['sourceCompared']=True
              b['qa']['notes']=note
              b['qa']['evidence']='Automation run NKQ_ANATOMY_20260910 source-page/native-candidate comparison artifact; visual inspection 2026-09-10.'
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_image_progress.py --check
      - name: Commit QA checkpoint
        run: |
          git config user.name nk-qbank-automation
          git config user.email actions@users.noreply.github.com
          git add data/marrow/images/registry.json data/marrow/images/progress.json
          git commit -m "Record Anatomy source QA NKQ_ANATOMY_20260910 [qa-recorded]"
          git push origin HEAD
