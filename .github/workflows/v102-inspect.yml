name: V10.2 source inspection

on:
  push:
    branches: [v10.2-ui-overhaul]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Inspect index structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          print('--- SIZE ---')
          print(len(s), 'chars', s.count('\n')+1, 'lines')
          print('--- FUNCTIONS ---')
          print(', '.join(dict.fromkeys(m.group(1) for m in re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\(', s))))
          print('--- REVIEW ---')
          for term in ['Review Solutions','reviewTest','window.QB','data-v102-review-cta','review-test/','function resultPage','function reviewTestPage']:
              print('\n###',term)
              for m in list(re.finditer(re.escape(term), s))[:5]:
                  print(s[max(0,m.start()-450):m.start()+900].replace('\n',' ')[:1400])
          print('--- SELECTS ---')
          for m in re.finditer(r'<select[^>]*>', s, re.I):
              print(s[max(0,m.start()-350):m.start()+1800].replace('\n',' ')[:2100])
          print('--- TOPBAR ---')
          for m in re.finditer(r'<[^>]*class="[^"]*topbar[^"]*"[^>]*>',s,re.I):
              print(m.group(0))
          PY
