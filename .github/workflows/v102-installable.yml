name: V10.2 installable APK
on:
  workflow_dispatch:
  push:
    branches:
      - v10.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v10.2
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Apply V10.2 review repair
        run: python3 tools/repair_v102_review.py
      - name: Validate HTML scripts and subject data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          subject_file=Path('app/src/main/assets/subjects_qbank_data.js')
          required=[
            'function buildReviewSession(t)',
            "String(s.sourceTestId)!==String(route.id)",
            '${streakMarkup()}',
            'Review Solutions',
            'data-v102-review-cta="1"',
            'v102-review-direct-handler',
            'window.SUBJECT_QBANK_DATA',
          ]
          for x in required:
            assert x in s, x
          assert subject_file.exists(), 'Anatomy/Physiology data file missing'
          data=subject_file.read_text(encoding='utf-8')
          assert '"subject":"Physiology"' in data and '"subject":"Anatomy"' in data, 'Subject data missing'
          assert ('data-v102-review-cta="1"' in s and 'data-review-test-id="${esc(t.id)}"' in s), 'Review CTA action missing'
          for i,body in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
            if not body.strip(): continue
            with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(body); name=f.name
            subprocess.run(['node','--check',name],check=True)
          print('V10.2 source validation passed')
          PY
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Check APK
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -t "$apk" >/dev/null
          echo "APK=$apk"
          ls -lh "$apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: qbank-v10.2-installable-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
