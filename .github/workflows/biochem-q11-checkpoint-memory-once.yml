name: Biochemistry Q11 Checkpoint Memory Once

on:
  push:
    branches:
      - automation/biochem-q11-checkpoint-memory-20260912

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/biochem-q11-checkpoint-memory-20260912
          fetch-depth: 0
      - name: Verify canonical exact head and unchanged image state
        run: |
          git fetch origin feature/marrow-canonical-full-current
          CANON=$(git rev-parse origin/feature/marrow-canonical-full-current)
          test "$CANON" = "36c9e1a92a3925c17f6914c2a6ffebf73948ba14"
          test "$(git merge-base HEAD origin/feature/marrow-canonical-full-current)" = "$CANON"
          test "$(git rev-parse HEAD:data/marrow/images/registry.json)" = "$(git rev-parse origin/feature/marrow-canonical-full-current:data/marrow/images/registry.json)"
          test "$(git rev-parse HEAD:data/marrow/images/progress.json)" = "$(git rev-parse origin/feature/marrow-canonical-full-current:data/marrow/images/progress.json)"
      - name: Update STATE and SESSION_LOG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          state_path=Path('.project-memory/STATE.md')
          state=state_path.read_text()
          block='''## Current image state / cautions

- **Latest Biochemistry recovery checkpoint:** `NKQ_BIOCHEM_COVERAGE_Q11_20260912`, exact canonical base `36c9e1a92a3925c17f6914c2a6ffebf73948ba14`, specialist branch `automation/marrow-images-biochemistry-coverage-20260912-q11`, durable checkpoint commit `a3fa300a054393fd7f217580e634f481c0a7b649`.
- Deterministic next reference remains `marrow__BIOCHEM_CH04_Q011:figure:1` (explanation, recorded source page 69, tracked binding REJECTED). Full rendered-source review established that page 69's educational figure is fructose metabolism (xref 1146, SHA `bb781d8346ed1c3677ac8faf3a5a54501d09f583509a91d1aa0d7ecf9d1198d4`), while the Q11 explanation points to a galactose flowchart below and authoritative page 70 contains the correct native galactose diagram (xref 162, 600x451 JPEG, SHA `e302242457457cdcabcca8ced492809b2f1947c049b719ff49a0be6bd6a222f6`). Preserve the historical rejected Q11/fructose binding.
- Two bounded installer attempts failed closed **before any registry/progress/coverage or learner-facing mutation** because embedded PDF text extraction is corrupted on these pages: run `34694510806` failed on the parsed word `galactose` on page 69; retry run `34694608472` failed on the parsed page-70 title. Rendered-page ownership, native xrefs/regions, source PDF size/hash and native image hashes remain verified. Per two-attempt containment, no third same-class mutation attempt was made.
- Live canonical Biochemistry coverage is unchanged at **110 raw / 109 effective / 71 released / 1 invalid-source-metadata / 72 resolved / 4 tracked-unreleased / 34 untracked / 31 text-cue**. Subject remains **INCOMPLETE**.
- **Next image action:** resume this exact Q11 reference from the then-live canonical head. Use rendered-page plus native xref/region/hash evidence instead of corrupted embedded text; re-run audit/coverage and single-writer checks before mutation. Do not skip Q11. The checkpoint branch contains no shared-registry mutation and is not itself a lock on unrelated image work.
- Q26 remains the latest fully product-verified image release: exact-head Engineering Gate **34692045844** and full Android/PWA/browser/image-comparison/APK/package/reproducibility/preview run **34692046932** passed; production promotion was skipped.

'''
          state,n=re.subn(r'## Current image state / cautions\n.*?(?=## Current product handoff)',block,state,count=1,flags=re.S)
          assert n==1
          state,n2=re.subn(r'7\. \*\*Image lane:\*\*.*?(?=\n\nCanonical source handoff:)', '7. **Image lane:** Q11 is the next deterministic Biochemistry reference and has a durable fail-closed source-review checkpoint at `a3fa300a054393fd7f217580e634f481c0a7b649`. Resume Q11 from the live canonical head using rendered-page/xref/hash evidence; do not repeat the corrupted embedded-text gate and do not skip ahead. No shared-registry mutation is pending from this checkpoint; production promotion remains prohibited.', state, count=1, flags=re.S)
          assert n2==1
          state_path.write_text(state)

          with Path('.project-memory/SESSION_LOG.md').open('a') as f:
              f.write('''\n## 2026-09-12 — Biochemistry Ch4 Q11 fail-closed source-review checkpoint\n- Canonical base at batch start: `36c9e1a92a3925c17f6914c2a6ffebf73948ba14`; specialist branch `automation/marrow-images-biochemistry-coverage-20260912-q11`; durable checkpoint `a3fa300a054393fd7f217580e634f481c0a7b649`.\n- Fresh audit/coverage confirmed Q11 as the first deterministic Biochemistry backlog item: 110 raw / 109 effective / 71 released / 1 invalid metadata / 72 resolved / 4 tracked-unreleased / 34 untracked / 31 text-cue.\n- Hash-verified ED8 source review: recorded page 69 xref 1146 is fructose metabolism, SHA `bb781d8346ed1c3677ac8faf3a5a54501d09f583509a91d1aa0d7ecf9d1198d4`; the Q11 explanation visually points to the galactose flowchart below, and page 70 xref 162 is the correct native 600x451 galactose-metabolism figure, SHA `e302242457457cdcabcca8ced492809b2f1947c049b719ff49a0be6bd6a222f6`. Historical rejected Q11/fructose binding must be preserved.\n- Installer run `34694510806` failed before mutation because PDF text extraction garbled `galactose` on page 69. One bounded retry removed only that brittle assertion while retaining page/xref/region/hash/ownership gates; run `34694608472` then failed before mutation because text extraction also garbled the page-70 title. Two-attempt containment triggered; no third same-class attempt was made.\n- Registry, progress, coverage and learner-facing assets remained unchanged. Temporary installer/workflow helpers were removed from the specialist branch and a durable JSON checkpoint was committed.\n- Next run must resume Q11 from live canonical, trust rendered-page/native-xref/hash evidence rather than corrupted embedded text, recompute source coverage, and stop or mark REVIEW_REQUIRED if ownership cannot be proven without inference. Production untouched.\n''')
          PY
          python3 tools/verify_project_memory.py
      - name: Remove one-shot workflow, commit, and fast-forward canonical memory only
        run: |
          rm .github/workflows/biochem-q11-checkpoint-memory-once.yml
          git diff --check
          git config user.name "NK QBank Image Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record Biochemistry Q11 fail-closed checkpoint"
          git push origin HEAD:feature/marrow-canonical-full-current
