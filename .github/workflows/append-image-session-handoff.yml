name: Append image automation session handoff

on:
  push:
    branches:
      - automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_CRISPR_20260911
    paths:
      - .project-memory/SESSION_LOG_PENDING_RETIRE_NKQ_BIOCHEMISTRY_CRISPR_20260911.md

permissions:
  contents: write

jobs:
  append-session-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_CRISPR_20260911
          fetch-depth: 0
      - name: Append retirement handoff safely
        shell: bash
        run: |
          set -euo pipefail
          pending=.project-memory/SESSION_LOG_PENDING_RETIRE_NKQ_BIOCHEMISTRY_CRISPR_20260911.md
          test -f "$pending"
          printf '\n' >> .project-memory/SESSION_LOG.md
          cat "$pending" >> .project-memory/SESSION_LOG.md
          rm "$pending"
          git config user.name "nk-qbank-automation"
          git config user.email "actions@users.noreply.github.com"
          git add .project-memory/SESSION_LOG.md "$pending"
          git commit -m "Append retired Biochemistry CRISPR handoff [skip ci]"
          git push origin HEAD:automation/marrow-images-biochemistry-NKQ_BIOCHEMISTRY_CRISPR_20260911
