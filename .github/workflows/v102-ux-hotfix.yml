name: V10.2 UX/UI hotfix

on:
  push:
    branches: [v10.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 0
      - name: Add keyboard focus treatment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="v102-a11y-ui">button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[role="button"]:focus-visible{outline:3px solid rgba(79,70,229,.32);outline-offset:2px} @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style>'''
          if 'id="v102-a11y-ui"' not in s:
              s=s.replace('</body>',css+'</body>',1)
          p.write_text(s,encoding='utf-8')
          print('V10.2 accessibility focus treatment applied')
          PY
      - name: Validate UX/UI source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="v102-modern-ui"' app/src/main/assets/index.html
          grep -q 'id="v102-streak-layer"' app/src/main/assets/index.html
          grep -q 'id="v102-review-cta-guard"' app/src/main/assets/index.html
          grep -q 'Review Solutions' app/src/main/assets/index.html
          grep -q 'id="v102-a11y-ui"' app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          h="function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }"
          assert s.count(h)==1
          print('V10.2 UX/UI hotfix checks passed')
          PY
      - name: Commit UX/UI hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if ! git diff --cached --quiet; then git commit -m 'V10.2 UX UI accessibility polish' && git push origin HEAD:v10.2; fi
