name: One-shot Biochemistry Q6-Q7 coverage recovery

on:
  push:
    branches:
      - automation/marrow-images-biochemistry-coverage-20260912-q06-q07

permissions:
  contents: write

jobs:
  recover:
    if: ${{ !contains(github.event.head_commit.message, '[q06-q07-recovery-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: automation/marrow-images-biochemistry-coverage-20260912-q06-q07
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install pypdf==6.18.0 pillow
      - name: Preflight authoritative source and source-order coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('data/marrow/source_pdfs/biochemistryed8.pdf')
          assert p.stat().st_size == 7958177
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '463cb586aa18b702243d2467b4ad1f7fb24537d7ae73388607421516660643eb'
          PY
          python3 tools/marrow_images.py audit
          python3 tools/marrow_image_coverage.py --subject Biochemistry
          python3 - <<'PY'
          import json
          c=json.load(open('data/marrow/images/coverage.json'))
          rows=[r for r in c['sourceVisuals'] if r['subject']=='Biochemistry' and r['coverageStatus'] in {'UNTRACKED_SOURCE_VISUAL','UNRELEASED_TRACKED'}]
          assert len(rows)>=3, rows
          expected=[
            ('marrow__BIOCHEM_CH02_Q006:figure:1','marrow__BIOCHEM_CH02_Q006','explanation',[31]),
            ('marrow__BIOCHEM_CH02_Q007:figure:1','marrow__BIOCHEM_CH02_Q007','explanation',[31]),
          ]
          for row,want in zip(rows[:2],expected):
              assert (row['id'],row['questionId'],row['role'],row['sourcePages'])==want,(row,want)
          assert rows[2]['id']=='marrow__BIOCHEM_CH02_Q021:figure:1', rows[2]
          print('Q06_Q07_RECOVERY_PREFLIGHT_OK', rows[:3])
          PY
      - name: Verify page-31 native objects and approved asset reuse
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          from PIL import Image, ImageChops, ImageStat
          import io, json
          pdf=Path('data/marrow/source_pdfs/biochemistryed8.pdf')
          page=PdfReader(str(pdf)).pages[30]
          objects=page['/Resources']['/XObject']
          by_xref={ref.idnum:ref.get_object() for ref in objects.values() if ref.get_object().get('/Subtype')=='/Image'}
          assert 1126 in by_xref and 1125 in by_xref
          a,b=by_xref[1126],by_xref[1125]
          assert (int(a['/Width']),int(a['/Height']))==(600,450)
          assert (int(b['/Width']),int(b['/Height']))==(600,450)
          ia=Image.open(io.BytesIO(a._data)).convert('RGB')
          ib=Image.open(io.BytesIO(b._data)).convert('RGB')
          assert ia.size==ib.size==(600,450)
          diff=ImageStat.Stat(ImageChops.difference(ia,ib)).mean
          assert max(diff)<2.0, diff
          registry=json.load(open('data/marrow/images/registry.json'))
          matches=[asset for asset in registry['assets'] if asset.get('subject')=='Biochemistry' and asset.get('method')=='svg-reconstruction' and asset.get('production',{}).get('sha256')=='e6b4bb81c890ab0ad56f7883799fdcdff71e7bf00f19f2063cf061a5fa8ec994']
          assert len(matches)==1, [m.get('id') for m in matches]
          asset=matches[0]
          assert asset['status']=='PASS'
          assert asset['qa']['sourceCompared'] is True
          assert asset['source']['page']==31 and asset['source']['xref']==1125
          assert any(x.get('questionId')=='marrow__BIOCHEM_CH02_Q013' and x.get('status',asset['status'])=='PASS' for x in asset['bindings'])
          print('Q06_Q07_SOURCE_EQUIVALENCE_OK',asset['id'],'mean_abs_diff=',diff)
          PY
      - name: Add independently reviewed Q6 and Q7 bindings and release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          path=Path('data/marrow/images/registry.json')
          value=json.loads(path.read_text())
          asset=next(a for a in value['assets'] if a.get('subject')=='Biochemistry' and a.get('production',{}).get('sha256')=='e6b4bb81c890ab0ad56f7883799fdcdff71e7bf00f19f2063cf061a5fa8ec994')
          assert asset['status']=='PASS'
          existing={b['questionId'] for b in asset['bindings']}
          assert 'marrow__BIOCHEM_CH02_Q006' not in existing and 'marrow__BIOCHEM_CH02_Q007' not in existing
          batch='NKQ_BIOCHEM_COVERAGE_Q06_Q07_20260912'
          asset['bindings'].extend([
            {
              'questionId':'marrow__BIOCHEM_CH02_Q006','role':'explanation','order':1,
              'alt':'Glycolysis pathway diagram','status':'PASS','reviewBatch':batch,
              'qa':{
                'sourceCompared':True,
                'notes':'Authoritative page 31 places native xref 1126 directly in Solution to Question 6. Fresh pixel comparison against the page-31 xref 1125 source underlying the approved glycolysis reconstruction shows the same 600x450 pathway with only minor JPEG compression differences; all metabolites, enzymes, ATP/ADP and NAD/NADH relationships, reversible arrows and irreversible-step markings are unchanged. Explanation-only placement is answer-safe.',
                'evidence':'Marrow ED8 Biochemistry page 31 full-page inspection; xref 1126 region [162,110,450,326.16] compared with independently approved page-31 glycolysis source/reconstruction on 2026-09-12.'
              },
              'source':{'page':31,'xref':1126,'region':[162.0,110.0,450.0,326.16]}
            },
            {
              'questionId':'marrow__BIOCHEM_CH02_Q007','role':'explanation','order':1,
              'alt':'Glycolysis pathway diagram','status':'PASS','reviewBatch':batch,
              'qa':{
                'sourceCompared':True,
                'notes':'Authoritative page 31 places native xref 1125 directly in Solution to Question 7. This exact native source object is the source underlying the already PASS/source-compared glycolysis reconstruction. Explanation-only placement preserves answer timing and all pathway semantics.',
                'evidence':'Marrow ED8 Biochemistry page 31 full-page inspection; xref 1125 region [162,512.976,450,729.136], existing approved asset QA and production hash verified on 2026-09-12.'
              },
              'source':{'page':31,'xref':1125,'region':[162.0,512.976,450.0,729.136]}
            }
          ])
          path.write_text(json.dumps(value,indent=2)+'\n')
          print('Q06_Q07_BINDINGS_ADDED',asset['id'])
          PY
          python3 tools/marrow_images.py validate
          python3 tools/marrow_images.py release
          python3 tools/marrow_image_progress.py
          python3 tools/marrow_images.py audit
          python3 tools/marrow_image_coverage.py --subject Biochemistry
          python3 tools/marrow_image_progress.py --check
          python3 tools/marrow_image_coverage.py --subject Biochemistry --check
      - name: Update canonical handoff memory and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          cov=json.load(open('data/marrow/images/coverage.json'))
          s=cov['summary']['Biochemistry']
          unresolved=[r for r in cov['sourceVisuals'] if r['subject']=='Biochemistry' and r['coverageStatus'] in {'UNTRACKED_SOURCE_VISUAL','UNRELEASED_TRACKED'}]
          assert unresolved and unresolved[0]['id']=='marrow__BIOCHEM_CH02_Q021:figure:1', unresolved[:3]
          next_ref=unresolved[0]
          next_text=f"`{next_ref['id']}` ({next_ref['role']}, source pages {next_ref['sourcePages']}, status {next_ref['coverageStatus']})"
          state=Path('.project-memory/STATE.md')
          text=state.read_text()
          start=text.index('## Current image state / cautions')
          end=text.index('## Current product handoff — Continue Practice')
          section=f'''## Current image state / cautions\n\n- **Image lane owner:** Biochemistry batch `NKQ_BIOCHEM_COVERAGE_Q06_Q07_20260912`, branch `automation/marrow-images-biochemistry-coverage-20260912-q06-q07`, exact canonical base `e17b622b238280c127cd7c91a420dee82bdafdd9`. State: **CURRENT_UNVERIFIED** pending exact-head CI.\n- Fresh authoritative audit recovered two source-order explanation references on page 31: `marrow__BIOCHEM_CH02_Q006:figure:1` (xref 1126) and `marrow__BIOCHEM_CH02_Q007:figure:1` (xref 1125). Both independently bind to the existing PASS/source-compared glycolysis reconstruction; no new diagram or medical pixels were generated.\n- Post-batch candidate coverage: **{s['sourceVisualReferences']} raw / {s['effectiveLearnerVisualReferences']} effective / {s['releasedSourceVisualReferences']} released / {s['invalidSourceMetadataReferences']} invalid metadata / {s['resolvedSourceVisualReferences']} resolved / {s['trackedButUnreleasedReferences']} tracked-unreleased / {s['untrackedSourceVisualReferences']} untracked / {s['textCueReviewItems']} text-cue items**. Biochemistry remains **INCOMPLETE**.\n- Exact next deterministic unresolved reference is {next_text}; it is a composite/multi-object figure and must not be skipped for an easier later JPEG.\n- Historical image branches/PRs are evidence only. Physiology image recovery remains paused. Production promotion is prohibited.\n\n'''
          state.write_text(text[:start]+section+text[end:])
          log=Path('.project-memory/SESSION_LOG.md')
          with log.open('a',encoding='utf-8') as f:
              f.write(f'''\n\n## 2026-09-12 — Biochemistry Ch2 Q6/Q7 source-coverage candidate\n\n- Started bounded batch `NKQ_BIOCHEM_COVERAGE_Q06_Q07_20260912` from exact canonical head `e17b622b238280c127cd7c91a420dee82bdafdd9`.\n- Recovered `marrow__BIOCHEM_CH02_Q006:figure:1` and `marrow__BIOCHEM_CH02_Q007:figure:1`, both explanation-only on authoritative page 31. Q6 uses xref 1126 / region `[162,110,450,326.16]`; Q7 uses xref 1125 / region `[162,512.976,450,729.136]`.\n- Fresh native comparison showed both 600x450 source JPEGs contain the same glycolysis pathway with only minor compression differences. Q7 xref 1125 is the source underlying the existing PASS/source-compared glycolysis SVG; Q6 was independently ownership/semantic-checked before reuse. No source content or production asset was reconstructed or changed in this batch.\n- Candidate coverage: {s['sourceVisualReferences']} raw / {s['effectiveLearnerVisualReferences']} effective / {s['releasedSourceVisualReferences']} released / {s['invalidSourceMetadataReferences']} invalid / {s['resolvedSourceVisualReferences']} resolved / {s['trackedButUnreleasedReferences']} tracked-unreleased / {s['untrackedSourceVisualReferences']} untracked / {s['textCueReviewItems']} text-cue items. Subject remains INCOMPLETE.\n- Next deterministic unresolved source reference: {next_text}. Exact-head CI is still required; no main merge or production promotion.\n''')
          print('MEMORY_Q06_Q07_UPDATED next=',next_text)
          PY
          rm -f data/marrow/images/coverage.json
          rm -f .github/workflows/one-shot-biochem-q06-q07-recovery.yml
          python3 tools/marrow_images.py validate
          python3 tools/marrow_image_progress.py --check
          python3 tools/test_marrow_images.py
          python3 tools/test_marrow_image_coverage.py
          python3 tools/verify_build_pipeline.py
          python3 tools/verify_project_memory.py
          git diff --check
      - name: Commit recovery candidate
        run: |
          git config user.name 'Numankhan2013'
          git config user.email '124483154+Numankhan2013@users.noreply.github.com'
          git add -A
          git commit -m 'Recover Biochemistry Ch2 Q6-Q7 source figures [q06-q07-recovery-done]'
          git push origin HEAD:automation/marrow-images-biochemistry-coverage-20260912-q06-q07
