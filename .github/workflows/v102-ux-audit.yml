name: V10.2 UX/UI audit

on:
  push:
    branches: [v10.2]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 1

      - name: Apply V10.2 runtime repair for audit
        run: python3 tools/repair_v102_review.py

      - name: Run UX/UI static acceptance audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'modern UI layer': 'v102-modern-ui' in s,
            'streak/dashboard layer': 'v102-streak-layer' in s,
            'review CTA direct handler': 'v102-review-direct-handler' in s and 'data-v102-review-cta="1"' in s,
            'practice submission': 'submitPractice();' in s,
            'review solutions': 'Review Solutions' in s,
            'canonical haptic': s.count("function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }")==1,
            'single vibrate call': s.count('navigator.vibrate(')==1,
            'focus card specificity guard': '.card.pad.focus-card{background:linear-gradient(135deg,#2f2d63 0%,#3d65d8 100%)!important' in s,
            'practice correct feedback': '.option.correct.selected{background:#eaf9f3!important' in s,
            'practice wrong feedback': '.option.wrong.selected{background:#fff0f1!important' in s,
            'review CTA data id': 'data-review-test-id="${esc(t.id)}"' in s,
            'Anatomy/Physiology data': 'window.SUBJECT_QBANK_DATA' in s and Path('app/src/main/assets/subjects_qbank_data.js').exists(),
            'reduced motion': 'prefers-reduced-motion' in s,
            'responsive layout': bool(re.search(r'@media',s)),
            'no escaped v102 script separators': '\\n<script id="v102-' not in s,
            'no escaped v102 style separators': '\\n<style id="v102-' not in s,
          }
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          syntax_ok=True
          checked=0
          for i,body in enumerate(scripts):
              body=body.strip()
              if not body: continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); name=f.name
              r=subprocess.run(['node','--check',name],text=True,capture_output=True)
              checked+=1
              if r.returncode!=0:
                  syntax_ok=False
                  print(r.stderr)
                  break
          checks['inline JavaScript syntax'] = syntax_ok
          failed=[k for k,v in checks.items() if not v]
          print('V10.2 UX/UI audit:')
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          print('Inline scripts checked:', checked)
          assert not failed, 'UX/UI acceptance failures: '+', '.join(failed)
          print('All V10.2 static UX/UI acceptance checks passed')
          PY
