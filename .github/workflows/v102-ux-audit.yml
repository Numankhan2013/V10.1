name: V10.2 UX/UI audit

on:
  push:
    branches: [v10.2-ui-overhaul]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply immersive UI and review reliability layer
        run: python3 tools/v102_ui_overhaul.py

      - name: Remove temporary inspection scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v102-inspect.yml
          rm -f .github/workflows/v102-ui-overhaul-apply.yml
          rm -f tools/v102_source_inspect.py tools/v102_branch_marker.txt tools/v102_branch_seed.txt tools/.keep

      - name: Run V10.2 static UX/UI acceptance audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'next UI layer': 'id="v102-next-ui"' in s and 'id="v102-next-ui-behavior"' in s,
            'subject hub': 'v102-subject-hub' in s and 'data-v102-subject' in s and 'Choose a subject' in s and 'Choose a topic' in s,
            'topbar simplified': '.topbar.v102-topbar' in s and 'Open navigation' not in s and 'Notifications' not in s,
            'whole-card correct feedback': '.option.correct,.option.correct.selected' in s,
            'whole-card wrong feedback': '.option.wrong,.option.wrong.selected' in s,
            'large readable options': '.option-text{font-size:16px' in s and 'min-height:76px' in s,
            'Review Solutions CTA': 'v102-review-action' in s and 'data-v102-review-cta="1"' in s,
            'deterministic review interception': 'stopImmediatePropagation' in s and 'window.QB.reviewTest' in s,
            'structured explanation treatment': 'formatExplanations' in s and 'v102-explanation-heading' in s,
            'reduced motion': 'prefers-reduced-motion' in s,
            'responsive layout': '@media(max-width:640px)' in s,
          }
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              body=body.strip()
              if not body: continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8'); f.write(body); f.close()
              r=subprocess.run(['node','--check',f.name],text=True,capture_output=True)
              if r.returncode!=0:
                  print(r.stderr); raise SystemExit(f'JavaScript syntax error in script {i}')
          checks['inline JavaScript syntax']=True
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if failed: raise SystemExit('UX/UI acceptance failures: '+', '.join(failed))
          print('All V10.2 static UX/UI acceptance checks passed')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi

      - name: Upload exact tested debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QBank-V10.2-ui-overhaul-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html tools/v102_ui_overhaul.py .github/workflows/v102-ux-audit.yml .github/workflows tools
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'V10.2 immersive UI and review reliability pass'
          git push origin HEAD:${GITHUB_REF_NAME}
