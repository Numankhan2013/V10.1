name: V10.2 UX/UI audit

on:
  push:
    branches: [v10.2]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v4
      - name: Run UX/UI static acceptance audit
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'modern UI layer': 'v102-modern-ui' in s,
            'streak/dashboard layer': 'v102-streak-layer' in s,
            'review CTA guard': 'v102-review-cta-guard' in s,
            'practice submission': 'submitPractice();' in s,
            'review solutions': 'Review Solutions' in s,
            'canonical haptic': s.count("function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }")==1,
            'reduced motion': 'prefers-reduced-motion' in s,
            'responsive layout': bool(re.search(r'@media',s)),
            'focus-visible states': ':focus-visible' in s,
            'touch-friendly controls': bool(re.search(r'min-height\s*:\s*(4[4-9]|[5-9][0-9])px',s)),
          }
          failed=[k for k,v in checks.items() if not v]
          print('V10.2 UX/UI audit:')
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          assert not failed, 'UX/UI acceptance failures: '+', '.join(failed)
          print('All V10.2 static UX/UI acceptance checks passed')
