name: V10.2 UX/UI audit

on:
  push:
    branches: [v10.2, v10.2-ui-overhaul]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Normalize V10.2 transformer patterns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/v102_ui_overhaul.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace(r'''header_pat=re.compile(r"function header\(title = 'QBank'\)\{.*?\}\s+function bottomNav",re.S)''', r'''header_pat=re.compile(r"function\s+header\s*\(\s*title\s*=\s*['\"]QBank['\"]\s*\)\s*\{.*?\}\s*function\s+bottomNav",re.S)''')
          s=s.replace(r'''review_pat=re.compile(r"function reviewTest\(testId\)\{.*?\}\s+function reviewTestPage",re.S)''', r'''review_pat=re.compile(r"function\s+reviewTest\s*\(\s*testId\s*\)\s*\{.*?\}\s*function\s+reviewTestPage",re.S)''')
          s=s.replace(r'''page_pat=re.compile(r"function reviewTestPage\(\)\{\s*let s=state\.activeSession;\s*if\(!s \|\| s\.mode!==\'review\' \|\| \(route\.id && String\(s\.sourceTestId\)!==String\(route\.id\)\)\) \{\s*const t=state\.tests\.find\(x=>String\(x\.id\)===String\(route\.id\);",re.S)''', r'''page_pat=re.compile(r"function\s+reviewTestPage\s*\(\s*\)\s*\{\s*let\s+s=state\.activeSession;\s*if\(!s\s*\|\|\s*s\.mode!==['\"]review['\"]\s*\|\|\s*\(route\.id\s*&&\s*String\(s\.sourceTestId\)!==String\(route\.id\)\)\)\s*\{\s*const\s+t=state\.tests\.find\(x=>String\(x\.id\)===String\(route\.id\)\);",re.S)''')
          p.write_text(s,encoding='utf-8')
          print('Transformer patterns normalized')
          PY

      - name: Apply immersive UI and review reliability pass
        run: python3 tools/v102_ui_overhaul.py

      - name: Remove temporary inspection scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v102-inspect.yml
          rm -f .github/workflows/v102-ui-overhaul-apply.yml
          rm -f tools/v102_source_inspect.py tools/v102_branch_marker.txt tools/v102_branch_seed.txt tools/.keep

      - name: Run V10.2 static UX/UI acceptance audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'next UI layer': 'id="v102-next-ui"' in s and 'id="v102-next-ui-behavior"' in s,
            'subject hub': 'v102-subject-hub' in s and 'data-v102-subject-card' in s and 'Choose a topic' in s,
            'topbar simplified': 'function header(title = \'QBank\')' in s and 'Open navigation' not in s[s.find('function header'):s.find('function bottomNav')],
            'whole-card correct feedback': '.option.correct,.option.correct.selected' in s,
            'whole-card wrong feedback': '.option.wrong,.option.wrong.selected' in s,
            'large readable options': '.option-text{font-size:16px' in s and 'min-height:76px' in s,
            'Review Solutions button': 'v102-review-action' in s and 'data-v102-review-cta="1"' in s,
            'deterministic review guard': 'stopImmediatePropagation' in s and 'function reviewTest(testId)' in s,
            'review route decoding': 'decodeURIComponent(String(route.id||\'\'))' in s,
            'structured explanation treatment': 'formatExplanations' in s and 'v102-explanation-heading' in s,
            'reduced motion': 'prefers-reduced-motion' in s,
            'responsive layout': '@media(max-width:640px)' in s,
            'canonical haptic count': s.count("function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }")==1,
            'single vibrate call': s.count('navigator.vibrate(')==1,
          }
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              body=body.strip()
              if not body: continue
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8'); f.write(body); f.close()
              r=subprocess.run(['node','--check',f.name],text=True,capture_output=True)
              if r.returncode!=0:
                  print(r.stderr); raise SystemExit(f'JavaScript syntax error in script {i}')
          checks['inline JavaScript syntax']=True
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          if failed: raise SystemExit('UX/UI acceptance failures: '+', '.join(failed))
          print('All V10.2 static UX/UI acceptance checks passed')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html tools/v102_ui_overhaul.py .github/workflows/v102-ux-audit.yml .github/workflows tools
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'V10.2 immersive UI and review reliability pass'
          git push origin HEAD:${GITHUB_REF_NAME}
