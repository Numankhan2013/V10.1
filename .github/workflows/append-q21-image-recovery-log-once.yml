          rm -f .github/workflows/append-q21-image-recovery-log-once.yml
          git config user.name "NK QBank Memory Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Log Q21 image recovery checkpoint [skip ci]"
          git push origin HEAD:feature/marrow-canonical-full-current
