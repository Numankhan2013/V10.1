name: Append Q21 Image Recovery Session Log

on:
  push:
    branches:
      - feature/marrow-canonical-full-current

permissions:
  contents: write

jobs:
  append:
    if: ${{ github.event.head_commit.message == 'Fix Q21 session-log append workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical
        uses: actions/checkout@v5
        with:
          ref: feature/marrow-canonical-full-current
          fetch-depth: 0
      - name: Append exact Q21 recovery checkpoint and self-delete
        run: |
          python3 -c "import base64,pathlib; p=pathlib.Path('.project-memory/SESSION_LOG.md'); p.write_bytes(p.read_bytes()+base64.b64decode(''))"
          rm -f .github/workflows/append-q21-image-recovery-log-once.yml
          git config user.name "NK QBank Memory Handoff"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Log Q21 image recovery checkpoint [skip ci]"
          git push origin HEAD:feature/marrow-canonical-full-current
