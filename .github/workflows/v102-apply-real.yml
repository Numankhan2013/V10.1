name: V10.2 real UX source pass

# This is the reusable/source transformation used by the canonical V10.2 build.
# It is intentionally manual so it does not create duplicate/red CI runs on every push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Apply real UX product pass
        shell: bash
        run: |
          set -euo pipefail
          # The canonical V10.2 product transformation lives here. The fixed
          # build workflow extracts this step's Python payload and executes it.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          h="function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }"
          if s.count(h) != 1:
              raise SystemExit(f'FAIL: haptic implementation count={s.count(h)}')
          # Keep this source workflow intentionally conservative: the canonical
          # product pass is already applied by v102-build-fixed.yml.
          required=['Review Solutions','v102-review-cta-guard','submitPractice();','v102-streak-layer','v102-modern-ui']
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'FAIL: missing {marker}')
          print('V10.2 real UX source validation passed')
          PY
