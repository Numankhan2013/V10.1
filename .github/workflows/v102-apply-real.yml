name: V10.2 real UX build

on:
  push:
    branches: [v10.2]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Patch the real app source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          if len(s) < 1_000_000:
              raise SystemExit(f'FAIL: unexpected index.html size: {len(s)}')

          # Preserve the original haptic implementation exactly.
          haptic = "function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }"
          if s.count(haptic) != 1:
              raise SystemExit(f'FAIL: expected one canonical haptic function, found {s.count(haptic)}')
          vibrates_before = s.count('navigator.vibrate')

          # Practice: selecting an option is the submit action. Existing submitPractice()
          # remains the single source of truth for feedback, timing and attempt recording.
          old = "function selectPractice(qid,n){ const s=state.activeSession;if(!s||s.mode!=='practice'||s.submitted[qid])return;s.answers[qid]=n;haptic(8);saveState();render(); }"
          new = "function selectPractice(qid,n){ const s=state.activeSession;if(!s||s.mode!=='practice'||s.submitted[qid])return;s.answers[qid]=n;haptic(8);submitPractice(); }"
          if s.count(old) != 1:
              raise SystemExit(f'FAIL: expected one selectPractice implementation, found {s.count(old)}')
          s = s.replace(old, new, 1)

          # Review CTA: keep the exact completed test id, but give the action a clear name.
          old_review = 'onclick="window.QB.reviewTest(\'${esc(t.id)}\')">Review Test</button>'
          new_review = 'type="button" data-review-test-id="${esc(t.id)}" onclick="window.QB.reviewTest(\'${esc(t.id)}\')">Review Solutions</button>'
          if old_review in s:
              s = s.replace(old_review, new_review, 1)
          else:
              # Current source already uses the exact handler; only rename if needed.
              s = s.replace('>Review Test</button>', '>Review Solutions</button>', 1)

          # Make the review action resilient to WebView event quirks: delegation works even
          # if the result page is rendered again. It calls the same exported reviewTest(testId).
          review_guard = r'''\n<script id="v102-review-action-guard">\n(function(){\n  document.addEventListener('click',function(e){\n    const b=e.target && e.target.closest ? e.target.closest('[data-review-test-id]') : null;\n    if(!b) return;\n    const id=b.getAttribute('data-review-test-id');\n    if(!id || !window.QB || typeof window.QB.reviewTest!=='function') return;\n    e.preventDefault(); e.stopPropagation();\n    window.QB.reviewTest(id);\n  }, true);\n})();\n</script>\n'''
          if 'id="v102-review-action-guard"' not in s:
              s = s.replace('</body>', review_guard + '</body>', 1)

          # Remove the redundant Practice Submit controls by hiding only buttons whose label
          # is Submit/Submit Answer inside the active practice question view.
          practice_css = r'''\n<style id="v102-practice-submit-cleanup">\nbutton.v102-hidden-submit{display:none!important}\n</style>\n<script id="v102-practice-submit-cleanup">\n(function(){\n  function clean(){\n    document.querySelectorAll('button').forEach(function(btn){\n      const t=(btn.textContent||'').trim().toLowerCase();\n      if(t!=='submit' && t!=='submit answer') return;\n      const scope=btn.closest('.question-card,.session-card,.question-shell,.page');\n      if(scope && scope.querySelector('.option,.option-item')) btn.classList.add('v102-hidden-submit');\n    });\n  }\n  new MutationObserver(clean).observe(document.body,{subtree:true,childList:true});\n  clean();\n})();\n</script>\n'''
          if 'id="v102-practice-submit-cleanup"' not in s:
              s = s.replace('</body>', practice_css + '</body>', 1)

          # De-emphasize the old generic visual language with a tighter 2026 mobile system.
          visual = r'''\n<style id="v102-2026-surface">\n:root{--v102-bg:#f4f6fb;--v102-ink:#0e1220;--v102-muted:#6b7280;--v102-indigo:#5b5ce2;--v102-violet:#7b61ff;--v102-line:#e7e9f0}\nbody{background:var(--v102-bg)!important;color:var(--v102-ink);-webkit-font-smoothing:antialiased}\n.page{padding-top:20px}\n.page-title{font-size:30px!important;font-weight:900!important;letter-spacing:-.8px!important;line-height:1.05}\n.page-sub{color:var(--v102-muted)!important;line-height:1.45}\n.card{border:1px solid rgba(18,25,48,.06)!important;box-shadow:0 12px 38px rgba(24,30,60,.065)!important;border-radius:22px!important}\n.stat-card{background:linear-gradient(145deg,#fff,#fafbff)!important;border-radius:18px!important}\n.primary-btn{background:linear-gradient(135deg,var(--v102-indigo),var(--v102-violet))!important;border:0!important;box-shadow:0 12px 26px rgba(91,92,226,.25)!important;font-weight:850!important}\n.ghost-btn{border:1px solid rgba(18,25,48,.08)!important;background:rgba(255,255,255,.84)!important;font-weight:760!important}\n.option,.option-item{border-radius:16px!important;border-color:#e1e5ee!important;background:#fff!important;box-shadow:0 2px 9px rgba(30,35,60,.03)!important;transition:transform .09s ease,box-shadow .09s ease,border-color .09s ease!important}\n.option:active,.option-item:active{transform:scale(.992)!important}\n.question-text{font-size:18px!important;font-weight:720!important;letter-spacing:-.22px}\n.dashboard-greeting h1{font-size:31px!important;font-weight:900!important;letter-spacing:-1.1px!important}\n.focus-card{border-radius:24px!important;background:linear-gradient(145deg,#17173a,#4032a2)!important;color:#fff!important;box-shadow:0 18px 50px rgba(47,38,115,.24)!important}\n.focus-card .eyebrow,.focus-card .small-muted,.focus-card .page-sub{color:rgba(255,255,255,.7)!important}\n.focus-card h2{font-size:22px!important;font-weight:900!important;letter-spacing:-.55px!important}\n.streak-card{margin-top:14px!important;padding:18px!important;border-radius:24px!important;background:radial-gradient(circle at 88% 20%,rgba(249,115,22,.22),transparent 31%),linear-gradient(135deg,#191631,#39286e 65%,#5b21b6)!important;color:#fff!important;box-shadow:0 18px 44px rgba(55,35,110,.24)!important;border:0!important}\n.streak-number{font-size:46px!important;font-weight:950!important;letter-spacing:-2.4px!important;color:#fff!important}.streak-number span{color:rgba(255,255,255,.72)!important}\n.flame-hero{background:rgba(255,255,255,.11)!important;border:1px solid rgba(255,255,255,.13)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 10px 24px rgba(0,0,0,.16)!important}\n.streak-day{color:rgba(255,255,255,.67)!important}.streak-day b{color:#fff!important}.streak-day small{color:rgba(255,255,255,.5)!important}.streak-dot{background:rgba(255,255,255,.09)!important;border-color:rgba(255,255,255,.12)!important}.streak-day.done .streak-dot{background:linear-gradient(135deg,#fbbf24,#f97316)!important;border-color:transparent!important;box-shadow:0 5px 16px rgba(249,115,22,.3)!important}.streak-day.today .streak-dot{box-shadow:0 0 0 3px rgba(255,255,255,.16)!important}\n.chapter-hero{border-radius:24px!important;box-shadow:0 18px 46px rgba(30,35,60,.08)!important}\n.result-hero{background:linear-gradient(145deg,#fff,#f8f7ff)!important}\n.bottom-nav{background:rgba(255,255,255,.88)!important;backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important}\n@media(max-width:640px){.page{padding-left:16px!important;padding-right:16px!important}.page-title{font-size:28px!important}.dashboard-greeting h1{font-size:28px!important}.streak-card{padding:16px!important}.streak-number{font-size:42px!important}.flame-hero{width:54px!important;height:54px!important}.option,.option-item{padding:14px 13px!important}}\n@media(prefers-reduced-motion:reduce){.option,.option-item{transition:none!important}}\n</style>\n'''
          if 'id="v102-2026-surface"' not in s:
              s = s.replace('</body>', visual + '</body>', 1)

          # Strong source invariants.
          if s.count(haptic) != 1 or s.count('navigator.vibrate') != vibrates_before:
              raise SystemExit('FAIL: haptic implementation changed')
          if s.count('id="v102-review-action-guard"') != 1:
              raise SystemExit('FAIL: review action guard not installed')
          if 'Review Solutions' not in s:
              raise SystemExit('FAIL: Review Solutions CTA missing')
          if 'function selectPractice(qid,n){' not in s or 'submitPractice();' not in s:
              raise SystemExit('FAIL: practice auto-submit not installed')
          p.write_text(s, encoding='utf-8')
          print(f'Patched index.html: {len(original)} -> {len(s)} chars')
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          grep -q 'Review Solutions' app/src/main/assets/index.html
          grep -q 'v102-2026-surface' app/src/main/assets/index.html
          grep -q 'v102-review-action-guard' app/src/main/assets/index.html
          grep -q 'submitPractice();' app/src/main/assets/index.html
          echo 'V10.2 source validation passed.'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Commit the real V10.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'No source commit required.'
          else
            git commit -m 'V10.2: apply real core UX and 2026 visual system'
            git push origin v10.2
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V10.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
