name: Community Stats Diagnostic

on:
  push:
    branches:
      - feature/marrow-community-stats-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Print canonical Biochemistry question fingerprints
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import pathlib
          import zlib

          data = pathlib.Path('data/marrow')
          prefix = 'biochemistry_ch001_028'
          encoded = ''.join(
              part.read_text(encoding='utf-8').strip()
              for part in sorted(data.glob(prefix + '.zlib.b64.part*'))
          )
          bank = json.loads(zlib.decompress(base64.b64decode(encoded)).decode('utf-8'))
          print('CANONICAL_BIOCHEM_COUNT', len(bank.get('questions', [])))
          for q in bank.get('questions', []):
              print('CANONICAL_Q ' + json.dumps({
                  'id': q.get('id'),
                  'question': q.get('question'),
                  'options': [o.get('text') for o in (q.get('options') or [])],
                  'correctOption': q.get('correctOption'),
              }, ensure_ascii=False, separators=(',', ':')))
          PY
