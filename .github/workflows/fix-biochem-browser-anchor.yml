name: Fix Biochemistry Browser Anchor

on:
  push:
    branches:
      - feature/marrow-biochem-ch27-28-integration
    paths:
      - '.github/workflows/fix-biochem-browser-anchor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make Ch27-28 insertion choose the first deterministic Chapter 1 anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/verify_marrow_bank_browser.py')
          s=p.read_text(encoding='utf-8')
          old="""if source.count(biochem_anchor) != 1:\n    raise SystemExit(f\"Biochemistry browser insertion anchor count: {source.count(biochem_anchor)}\")\nsource = source.replace(biochem_anchor, biochem_guard + biochem_anchor, 1)"""
          new="""if source.count(biochem_anchor) < 1:\n    raise SystemExit('Biochemistry browser insertion anchor missing')\nsource = source.replace(biochem_anchor, biochem_guard + biochem_anchor, 1)"""
          if s.count(old)!=1:
              raise SystemExit(f'expected one browser-anchor guard, found {s.count(old)}')
          s=s.replace(old,new,1)
          compile(s,str(p),'exec')
          p.write_text(s,encoding='utf-8')
          print('BIOCHEM_BROWSER_ANCHOR_FIX_OK first_match=true assertions_preserved=true')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify_marrow_bank_browser.py
          git diff --cached --quiet && { echo 'No change'; exit 1; }
          git commit -m 'Fix Biochemistry browser insertion anchor'
          git push
