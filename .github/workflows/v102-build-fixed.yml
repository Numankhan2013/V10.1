name: V10.2 fixed build

on:
  push:
    branches: [v10.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Repair and validate runtime source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')

          # Keep the dashboard streak inside dashboard(), because render() replaces
          # #app.innerHTML after every question. This makes the streak reactive and persistent.
          anchor='<div class="dashboard-section"><div class="section-title"><span>At a glance</span>'
          if '${streakMarkup()}' not in s:
              if anchor not in s: raise SystemExit('dashboard anchor missing')
              s=s.replace(anchor,'${streakMarkup()}'+anchor,1)
          s=s.replace("if(document.querySelector('.v102-streak-card')) return;","if(document.querySelector('.streak-card') || document.querySelector('.v102-streak-card')) return;",1)

          # Make Review Solutions update state and render synchronously, then keep a
          # real hash for Back navigation. This avoids WebView hashchange timing issues.
          pat=re.compile(r'  function reviewTest\(testId\) \{.*?\n  \}\n\n  function reviewTestPage',re.S)
          repl=('  function reviewTest(testId) {\n'
                '    const t=state.tests.find(x=>String(x.id)===String(testId)); if(!t) return;\n'
                '    state.activeSession={ id:`review_${t.id}`, mode:\'review\', sourceTestId:t.id, title:`Review · ${t.title}`, questionIds:[...t.questionIds], index:0, answers:{...(t.answers||{})}, submitted:Object.fromEntries(t.questionIds.map(id=>[id,Boolean(t.answers?.[id])])), startedAt:t.createdAt, questionTimes:{...(t.questionTimes||{})} };\n'
                '    saveState();\n'
                '    route={page:\'review-test\',id:String(t.id)};\n'
                '    render();\n'
                '    const hash=`review-test/${encodeURIComponent(t.id)}`;\n'
                '    if(location.hash!==`#${hash}`) history.pushState(null,\'\',`#${hash}`);\n'
                '  }\n\n  function reviewTestPage')
          s,n=pat.subn(repl,s,count=1)
          if n!=1: raise SystemExit('reviewTest function missing')

          # Keep the CTA guard non-invasive; the button's exported handler remains primary.
          guard=re.compile(r'<script id="v102-review-cta-guard">.*?</script>\\?',re.S)
          guard_repl=('''<script id="v102-review-cta-guard">\n'''
                      '''(function(){\n'''
                      '''  document.addEventListener('click',function(e){\n'''
                      '''    var b=e.target && e.target.closest ? e.target.closest('[data-v102-review-cta]') : null;\n'''
                      '''    if(!b || e.defaultPrevented) return;\n'''
                      '''    var id=b.getAttribute('data-review-test-id');\n'''
                      '''    if(id && window.QB && typeof window.QB.reviewTest==='function') window.QB.reviewTest(id);\n'''
                      '''  });\n'''
                      '''})();\n'''
                      '''</script>''')
          s,n=guard.subn(guard_repl,s,count=1)
          if n!=1: raise SystemExit('review guard missing')

          # Repair earlier malformed selector and escaped separators.
          s=s.replace('.card.pad.card.pad.focus-card{background:','.card.pad.focus-card{background:')
          s=s.replace('</script>\\n','</script>\n').replace('</style>\\n','</style>\n')

          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'dashboard streak render':'${streakMarkup()}' in s,
            'review direct render':bool(re.search(r"route=\{page:'review-test',id:String\(t.id\)\}",s)),
            'review data id':'data-review-test-id="${esc(t.id)}"' in s,
            'focus card':'.card.pad.focus-card{background:' in s,
            'green feedback':'.option.correct.selected{background:#eaf9f3!important' in s,
            'red feedback':'.option.wrong.selected{background:#fff0f1!important' in s,
            'no escaped separators':'\\n<script id="v102-' not in s and '\\n<style id="v102-' not in s,
          }
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              body=body.strip()
              if not body: continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(f'inline script {i} syntax failure')
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          assert all(checks.values()), checks
          h="function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }"
          assert s.count(h)==1, f'canonical haptic count={s.count(h)}'
          PY
      - name: Commit repaired product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'V10.2 product source: fix review and persistent streak'
            git push
          fi
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace
      - name: Upload V10.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: qbank-v10.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
