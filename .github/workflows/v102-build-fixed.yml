name: V10.2 fixed build

on:
  push:
    branches: [v10.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'V10.2 product source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - name: Apply existing V10.2 product pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          try:
              import yaml
          except ImportError:
              subprocess.check_call(['python3','-m','pip','install','PyYAML','-q'])
              import yaml
          wf = yaml.safe_load(Path('.github/workflows/v102-apply-real.yml').read_text(encoding='utf-8'))
          steps = wf['jobs']['build']['steps']
          run_block = next(x['run'] for x in steps if x.get('name') == 'Apply V10.2 product pass')
          Path('/tmp/v102-apply.sh').write_text(run_block, encoding='utf-8')
          subprocess.check_call(['bash','/tmp/v102-apply.sh'])
          PY

      - name: Validate V10.2 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Review Solutions' app/src/main/assets/index.html
          grep -q 'id="v102-review-cta-guard"' app/src/main/assets/index.html
          grep -q 'submitPractice();' app/src/main/assets/index.html
          grep -q 'id="v102-streak-layer"' app/src/main/assets/index.html
          grep -q 'id="v102-modern-ui"' app/src/main/assets/index.html
          echo 'V10.2 source validation passed.'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Commit V10.2 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'V10.2 product source'
            git push origin HEAD:v10.2
          fi

      - name: Upload V10.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: qbank-v10.2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
