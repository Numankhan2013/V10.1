name: V10.2 fixed build

on:
  push:
    branches: [v10.2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v10.2
        uses: actions/checkout@v5
        with:
          ref: v10.2
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Repair Review Solutions runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')

          # Review CTA: native hash fallback + JS enhancement.
          old=re.compile(r'<button class="primary-btn"\s+type="button" data-v102-review-cta="1" data-review-test-id="\$\{esc\(t\.id\)\}" onclick="window\.QB\.reviewTest\(\'\$\{esc\(t\.id\)\}\'\)">Review Solutions</button>')
          new='<a class="primary-btn" role="button" data-v102-review-cta="1" data-review-test-id="${esc(t.id)}" href="#review-test/${encodeURIComponent(t.id)}" onclick="window.QB.reviewTest(\'${esc(t.id)}\');return false;">Review Solutions</a>'
          if 'href="#review-test/${encodeURIComponent(t.id)}"' not in s:
              s,n=old.subn(new,s,count=1)
              if n!=1: raise SystemExit(f'Review CTA replacement count={n}')

          # One canonical session constructor, used both by the button and by direct
          # #review-test/<id> navigation. This makes review independent of hashchange
          # timing and resilient to WebView click behavior.
          pat=re.compile(r'  function reviewTest\(testId\) \{.*?\n  \}\n\n  function reviewTestPage\(\) \{',re.S)
          repl='''  function buildReviewSession(t) {
    return { id:`review_${t.id}`, mode:'review', sourceTestId:t.id, title:`Review · ${t.title}`, questionIds:[...t.questionIds], index:0, answers:{...(t.answers||{})}, submitted:Object.fromEntries(t.questionIds.map(id=>[id,Boolean(t.answers?.[id])])), startedAt:t.createdAt, questionTimes:{...(t.questionTimes||{})} };
  }

  function reviewTest(testId) {
    const t=state.tests.find(x=>String(x.id)===String(testId));
    if(!t){ showToast('That test could not be found in saved history.','bad'); return; }
    state.activeSession=buildReviewSession(t);
    saveState();
    route={page:'review-test',id:String(t.id)};
    render();
    const hash=`review-test/${encodeURIComponent(t.id)}`;
    if(location.hash!==`#${hash}`) history.replaceState(null,'',`#${hash}`);
  }

  function reviewTestPage() {'''
          s,n=pat.subn(repl,s,count=1)
          if n!=1: raise SystemExit(f'review function replacement count={n}')

          old2='''  function reviewTestPage() {
    const s=state.activeSession; if(!s || s.mode!=='review') return testsPage();
    const q=BY_ID[s.questionIds[s.index]], selected=s.answers[q.id]||null, corr=Number(selected)===Number(q.correctOption);'''
          new2='''  function reviewTestPage() {
    let s=state.activeSession;
    if(!s || s.mode!=='review' || (route.id && String(s.sourceTestId)!==String(route.id))) {
      const t=state.tests.find(x=>String(x.id)===String(route.id));
      if(!t) return testsPage();
      s=buildReviewSession(t);
      state.activeSession=s;
      saveState();
    }
    const q=BY_ID[s.questionIds[s.index]], selected=s.answers[q.id]||null, corr=Number(selected)===Number(q.correctOption);'''
          if old2 in s: s=s.replace(old2,new2,1)
          else: raise SystemExit('review page guard not found')

          # Remove duplicate delegated review handler and stray escaped separator artifact.
          s=re.sub(r'<script id="v102-review-cta-guard">.*?</script>\\?','',s,flags=re.S,count=1)
          s=s.replace('</script>n\n<style id="v102-practice-layer">','</script>\n<style id="v102-practice-layer">')
          s=s.replace('</script>\\n','</script>\n').replace('</style>\\n','</style>\n')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate source and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          checks={
            'Review Solutions CTA':'href="#review-test/${encodeURIComponent(t.id)}"' in s,
            'Review session builder':'function buildReviewSession(t)' in s,
            'Review route fallback':"String(s.sourceTestId)!==String(route.id)" in s,
            'streak render':'${streakMarkup()}' in s,
            'green feedback':'.option.correct.selected{background:#eaf9f3!important' in s,
            'red feedback':'.option.wrong.selected{background:#fff0f1!important' in s,
            'no escaped separators':'\\n<script id="v102-' not in s and '\\n<style id="v102-' not in s,
          }
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,b in enumerate(scripts):
            if not b.strip(): continue
            with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(b); name=f.name
            r=subprocess.run(['node','--check',name],capture_output=True,text=True)
            if r.returncode: print(r.stderr); raise SystemExit(f'inline script {i} syntax failure')
          for k,v in checks.items(): print(('PASS ' if v else 'FAIL ')+k)
          assert all(checks.values()), checks
          h="function haptic(pattern){ try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(pattern); }catch(e){} }"
          assert s.count(h)==1, f'canonical haptic count={s.count(h)}'
          PY
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'V10.2 product source: harden review navigation'
            git push
          fi
      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload V10.2 review-fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: qbank-v10.2-review-fixed-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
